barang bukti lain", "intro": "", "items": [{"n": 26, "lvl": "Sulit", "title": "Siapa \"r3ndyx\"?", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Tambahkan <code><span class=\"evd\">EVD-01</span>.dd</code> (flashdisk tersangka phishing) ke case yang sama.</li><li>Di EVD-01, buka <code>kit/samlognus-owa/README.txt</code> dan metadata <code>template_email/invoice_template_vendor.docx</code>.</li><li>Bandingkan dengan <em>Author</em> dokumen di Soal 15 dan Soal 17.</li></ol>", "ask": "<p>Siapa nama pemilik flashdisk EVD-01 yang memakai alias r3ndyx?</p>", "text": "siapa \"r3ndyx\"? langkah:\n1. tambahkan evd-01.dd (flashdisk tersangka phishing) ke case yang sama.\n2. di evd-01, buka kit/samlognus-owa/readme.txt dan metadata template_email/invoice_template_vendor.docx.\n3. bandingkan dengan author dokumen di soal 15 dan soal 17.\n\npertanyaan: siapa nama pemilik flashdisk evd-01 yang memakai alias r3ndyx?\n", "hint": "Di EVD-01, buka CV di folder pribadi/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "R**** S******"}, {"n": 27, "lvl": "Sulit", "title": "Dari komputer mana persetujuan dilakukan?", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Tambahkan <code><span class=\"evd\">EVD-09</span>.dd</code> (PC kantor bersama SLN-FIN-PC03) ke case yang sama, dengan modul <strong>Recent Activity</strong> dan <strong>EXIF Parser</strong>.</li><li>Di EVD-09, buka <strong>Data Artifacts → Web History</strong>. Cari URL yang memuat <code>PAY-2025-0415-007/approve</code>.</li><li>Di EVD-09, buka <code>Users/hendra.wibisono/Documents/</code> dan cari formulir cuti.</li></ol>", "ask": "<p>Dari profil pengguna siapa di EVD-09 halaman approve diakses?</p>", "text": "dari komputer mana persetujuan dilakukan? langkah:\n1. tambahkan evd-09.dd (pc kantor bersama sln-fin-pc03) ke case yang sama, dengan modul recent activity dan exif parser.\n2. di evd-09, buka data artifacts → web history. cari url yang memuat pay-2025-0415-007/approve.\n3. di evd-09, buka users/hendra.wibisono/documents/ dan cari formulir cuti.\n\npertanyaan: dari profil pengguna siapa di evd-09 halaman approve diakses?\n\n---\n", "hint": "Path file History di Web History menunjukkan nama profil.", "mandiri": false, "isian": "Jawaban singkat", "mask": "h*****.w*******"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Apa yang terbukti</strong> tentang cara Dewi tertipu, dari email, download, sampai transfer.</li><li><strong>Apa yang tidak terbukti</strong>, misalnya keterlibatan Dewi, makro berjalan, dan siapa yang sebenarnya menekan \"setuju\".</li><li><strong>Keterbatasan</strong>, misalnya: data registry adalah rekonstruksi pelatihan, waktu hapus hanya berasal dari Recycle Bin, dan catatan dari unallocated space tidak punya nama atau waktu asli.</li></ul>", "scen_title": "EVD-02 — Laptop Korban BEC", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP — LP/B/117/IV/2025/SIBER/PDNR (fiktif)<br><strong>Barang bukti:</strong> laptop dinas <strong>SLN-LT-FIN07</strong> milik PT Samudra Logistik Nusantara, pengguna <strong>Dewi Anggraini</strong> (staf keuangan). Diserahkan pelapor (SLN) pada 17 April 2025 pukul 17.30 WIB dalam keadaan mati.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-02</span>.dd</code> (raw, 90 MiB, GPT: EFI FAT16 + NTFS \"OS\"). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>Pada 15 April 2025 SLN mentransfer <strong>Rp 1.475.000.000</strong> untuk invoice INV/BPS/2025/0412 ke rekening <strong>Bank Arta Niaga 7310448201 a.n. CV Baja Prima Sentosa</strong>. Vendor asli, PT Baja Prima Sentosa (<code>bajaprimasentosa.co.id</code>), menyatakan tidak pernah mengganti rekening. Dewi mengaku menerima email \"perubahan rekening\" yang tampak berasal dari vendor dan membuka lampirannya.</p><p>Dewi juga mengaku:</p><ul><li>pada 7 April ada \"kurir BPS\" yang memintanya mencetak invoice dari flashdisk milik kurir di laptopnya;</li><li>pada 8 April ia pernah memasukkan password di tautan \"reset password\".</li></ul><p>Persetujuan pembayaran tercatat atas nama manajer <strong>Hendra Wibisono</strong>, padahal ia sedang cuti (lihat EVD-09).</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Rekonstruksi alur email BEC: pengirim, domain tiruan, IP asal, dan lampiran.</li><li>Buktikan Dewi mengunjungi halaman phishing dan apa yang terjadi setelahnya.</li><li>Pulihkan file yang dihapus Dewi (Recycle Bin) dan file yang dihapus permanen.</li><li>Identifikasi flashdisk \"kurir\" dari jejak USB dan <code>.lnk</code>, lalu cocokkan dengan EVD-01.</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Bedakan korban yang tertipu dari pelaku. Sebut apa yang belum terbukti tentang siapa yang menekan \"setuju\"."}, {"id": "EVD-03", "title": "EVD-03 — Lembar Kerja (Workstation Terkena Ransomware)", "short": "Workstation Terkena Ransomware", "exam": false, "intro": "", "sections": [{"n": "1", "name": "Pemeriksaan EVD-03", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-03</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-03</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-03.dd.\n\npertanyaan: berapa md5 image evd-03.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "7c2766**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-03</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Recent Activity, File Type Identification, Extension Mismatch Detector, Hash Lookup, Email Parser, Embedded File Extractor, Keyword Search, Encryption Detection, Interesting Files, PhotoRec Carver</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-03.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): recent activity, file type identification, extension mismatch detector, hash lookup, email parser, embedded file extractor, keyword search, encryption detection, interesting files, photorec carver.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Struktur disk dan identitas komputer", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-03</span>.dd</code> dan lihat daftar volume.</li><li>Buka <strong>Data Artifacts → Operating System Information</strong> dan <strong>OS Accounts</strong>.</li></ol>", "ask": "<p>Apa computer name workstation ini?</p>", "text": "struktur disk dan identitas komputer langkah:\n1. klik evd-03.dd dan lihat daftar volume.\n2. buka data artifacts → operating system information dan os accounts.\n\npertanyaan: apa computer name workstation ini?\n", "hint": "Lihat Operating System Information.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A******-A****"}, {"n": 4, "lvl": "Dasar", "title": "File terenkripsi", "tahap": "Tahap 4 · Penelusuran dampak serangan", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Substring Match</strong> dengan kata <code>.kabut</code>. Cara lain: buka <strong>Views → File Types → By Extension</strong> atau gunakan <em>File Search by Attributes</em> dengan nama <code>%.kabut</code>.</li></ol>", "ask": "<p>Berapa jumlah file berekstensi .kabut?</p>", "text": "file terenkripsi langkah:\n1. jalankan keyword search substring match dengan kata .kabut. cara lain: buka views → file types → by extension atau gunakan file search by attributes dengan nama %.kabut.\n\npertanyaan: berapa jumlah file berekstensi .kabut?\n", "hint": "Gunakan Substring Match \".kabut\" atau File Search by Attributes, lalu hitung hasilnya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 5, "lvl": "Dasar", "title": "Catatan tebusan", "tahap": "Tahap 4 · Penelusuran dampak serangan", "label": "Langkah", "steps": "<ol><li>Cari file <code>BACA_SAYA_KABUT.txt</code> dengan <em>File Search by Attributes</em> (nama).</li><li>Bandingkan MD5 setiap salinannya (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li></ol>", "ask": "<p>Apa MD5 catatan tebusan BACA_SAYA_KABUT.txt?</p>", "text": "catatan tebusan langkah:\n1. cari file baca_saya_kabut.txt dengan file search by attributes (nama).\n2. bandingkan md5 setiap salinannya (p8).\n\npertanyaan: apa md5 catatan tebusan baca_saya_kabut.txt?\n", "hint": "Semua salinan catatan punya MD5 yang sama. Ambil dari salah satunya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "94532e**************************"}, {"n": 6, "lvl": "Dasar", "title": "Isi catatan tebusan", "tahap": "Tahap 4 · Penelusuran dampak serangan", "label": "Langkah", "steps": "<ol><li>Buka salah satu <code>BACA_SAYA_KABUT.txt</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa alamat wallet BTC di catatan tebusan?</p>", "text": "isi catatan tebusan langkah:\n1. buka salah satu baca_saya_kabut.txt dengan tab text.\n\npertanyaan: apa alamat wallet btc di catatan tebusan?\n", "hint": "Alamat BTC bech32 berawalan bc1.", "mandiri": false, "isian": "Jawaban singkat", "mask": "bc1q4fhf**********************************"}, {"n": 7, "lvl": "Dasar", "title": "Konfigurasi ransomware", "tahap": "Tahap 4 · Penelusuran dampak serangan", "label": "Langkah", "steps": "<ol><li>Buka <code>ProgramData/KabutGelap/svc/config.json</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa nilai \"variant\" di ProgramData/KabutGelap/svc/config.json?</p>", "text": "konfigurasi ransomware langkah:\n1. buka programdata/kabutgelap/svc/config.json dengan tab text.\n\npertanyaan: apa nilai \"variant\" di programdata/kabutgelap/svc/config.json?\n", "hint": "config.json berisi pasangan kunci-nilai. Cari kunci \"variant\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "a******"}, {"n": 8, "lvl": "Dasar", "title": "Negosiasi", "tahap": "Tahap 4 · Penelusuran dampak serangan", "label": "Langkah", "steps": "<ol><li>Buka <code>Users/sri.wahyuni/Desktop/negosiasi_kabut.txt</code>.</li></ol>", "ask": "<p>Berapa penawaran akhir pelaku dalam BTC menurut negosiasi_kabut.txt?</p>", "text": "negosiasi langkah:\n1. buka users/sri.wahyuni/desktop/negosiasi_kabut.txt.\n\npertanyaan: berapa penawaran akhir pelaku dalam btc menurut negosiasi_kabut.txt?\n", "hint": "Ada tiga angka BTC: tawaran awal, tawaran Arunika, dan penawaran akhir.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*.*"}, {"n": 9, "lvl": "Dasar", "title": "Email pemicu", "tahap": "Tahap 5 · Analisis artefak: bagaimana infeksi terjadi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → E-Mail Messages</strong> dan cari email tanggal 2 Juni 2025.</li></ol>", "ask": "<p>Apa nama lampiran email pemicu?</p>", "text": "email pemicu langkah:\n1. buka data artifacts → e-mail messages dan cari email tanggal 2 juni 2025.\n\npertanyaan: apa nama lampiran email pemicu?\n", "hint": "Email diterima 2 Juni 2025 dan lampirannya berupa ZIP.", "mandiri": false, "isian": "Jawaban singkat", "mask": "K******_Pe********_H****.z**"}, {"n": 10, "lvl": "Dasar", "title": "Download lampiran", "tahap": "Tahap 5 · Analisis artefak: bagaimana infeksi terjadi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Downloads</strong>.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) ZIP lampiran di-download?</p>", "text": "download lampiran langkah:\n1. buka data artifacts → web downloads.\n\npertanyaan: pukul berapa (hh:mm:ss) zip lampiran di-download?\n", "hint": "Lihat kolom waktu di Web Downloads.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 11, "lvl": "Dasar", "title": "Pencarian Google korban", "tahap": "Tahap 5 · Analisis artefak: bagaimana infeksi terjadi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Search</strong> untuk pagi 3 Juni 2025.</li></ol>", "ask": "<p>Situs pemulihan ransomware apa yang dikunjungi Sri pada pagi 3 Juni?</p>", "text": "pencarian google korban langkah:\n1. buka data artifacts → web search untuk pagi 3 juni 2025.\n\npertanyaan: situs pemulihan ransomware apa yang dikunjungi sri pada pagi 3 juni?\n", "hint": "Situs ini dikunjungi tidak lama setelah pencarian tentang file .kabut.", "mandiri": false, "isian": "Jawaban singkat", "mask": "no**********.o**"}, {"n": 12, "lvl": "Menengah", "title": "Metadata dokumen tawaran", "tahap": "Tahap 5 · Analisis artefak: bagaimana infeksi terjadi", "label": "Langkah", "steps": "<ol><li>Klik <code>Users/sri.wahyuni/Documents/Nego/Tawaran_ke_peretas.docx</code>, lalu buka <strong>Data Artifacts → Metadata</strong> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li></ol>", "ask": "<p>Siapa Author dokumen Documents/Nego/Tawaran_ke_peretas.docx?</p>", "text": "metadata dokumen tawaran langkah:\n1. klik users/sri.wahyuni/documents/nego/tawaran_ke_peretas.docx, lalu buka data artifacts → metadata (p9).\n\npertanyaan: siapa author dokumen documents/nego/tawaran_ke_peretas.docx?\n", "hint": "Lihat Metadata. Nama Author berbeda dengan Last Modified By.", "mandiri": false, "isian": "Jawaban singkat", "mask": "B*** S******"}, {"n": 13, "lvl": "Menengah", "title": "Shortcut berkedok PDF", "tahap": "Tahap 5 · Analisis artefak: bagaimana infeksi terjadi", "label": "Langkah", "steps": "<ol><li>Buka folder <code>Users/sri.wahyuni/Downloads/Katalog_Permintaan_Hotel/</code>.</li><li>Klik <code>Katalog_Permintaan_Hotel.pdf.lnk</code>, lalu lihat tab <strong>Text</strong> atau <strong>Data Artifacts → Recent Documents</strong>.</li></ol>", "ask": "<p>Program apa yang dijalankan oleh shortcut Katalog_Permintaan_Hotel.pdf.lnk?</p>", "text": "shortcut berkedok pdf langkah:\n1. buka folder users/sri.wahyuni/downloads/katalog_permintaan_hotel/.\n2. klik katalog_permintaan_hotel.pdf.lnk, lalu lihat tab text atau data artifacts → recent documents.\n\npertanyaan: program apa yang dijalankan oleh shortcut katalog_permintaan_hotel.pdf.lnk?\n", "hint": "Lihat target path shortcut. Program ini bawaan Windows.", "mandiri": false, "isian": "Jawaban singkat", "mask": "c**.e**"}, {"n": 14, "lvl": "Menengah", "title": "Skrip yang dihapus", "tahap": "Tahap 6 · Pemulihan dan sisa jejak pelaku", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files</strong> (<a class=\"pref\" href=\"#panduan-p6\" data-p=\"P6\">P6</a>) dan cari file berakhiran <code>.bat</code>.</li><li>Baca isinya dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa nama file .bat yang dihapus?</p>", "text": "skrip yang dihapus langkah:\n1. buka views → deleted files (p6) dan cari file berakhiran .bat.\n2. baca isinya dengan tab text.\n\npertanyaan: apa nama file .bat yang dihapus?\n", "hint": "File ini ada di folder Users/Public dan berhubungan dengan shadow copy.", "mandiri": false, "isian": "Jawaban singkat", "mask": "d**_v**.b**"}, {"n": 15, "lvl": "Menengah", "title": "File tanpa parent folder ($OrphanFiles)", "tahap": "Tahap 6 · Pemulihan dan sisa jejak pelaku", "label": "Langkah", "steps": "<ol><li>Di pohon volume NTFS, buka folder <strong><code>$OrphanFiles</code></strong>.</li><li>Buka setiap file di dalamnya dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Dari folder apa file-file di $OrphanFiles berasal menurut kbl.log?</p>", "text": "file tanpa parent folder ($orphanfiles) langkah:\n1. di pohon volume ntfs, buka folder $orphanfiles.\n2. buka setiap file di dalamnya dengan tab text.\n\npertanyaan: dari folder apa file-file di $orphanfiles berasal menurut kbl.log?\n", "hint": "kbl.log menyebut folder kerja sementara bernama pendek.", "mandiri": false, "isian": "Jawaban singkat", "mask": "Pr*********\\Ka********\\t**"}, {"n": 16, "lvl": "Menengah", "title": "Data yang dicuri", "tahap": "Tahap 6 · Pemulihan dan sisa jejak pelaku", "label": "Langkah", "steps": "<ol><li>Baca <code>exfil_list.txt</code> (di <code>$OrphanFiles</code>) dan <code>ProgramData/KabutGelap/kbl.log</code>.</li></ol>", "ask": "<p>Ke IP mana data dicuri dikirim?</p>", "text": "data yang dicuri langkah:\n1. baca exfil_list.txt (di $orphanfiles) dan programdata/kabutgelap/kbl.log.\n\npertanyaan: ke ip mana data dicuri dikirim?\n", "hint": "Cari baris \"exfil\" di kbl.log.", "mandiri": false, "isian": "Jawaban singkat", "mask": "1**.*.*.1**"}, {"n": 17, "lvl": "Menengah", "title": "Folder yang tidak terenkripsi", "tahap": "Tahap 6 · Pemulihan dan sisa jejak pelaku", "label": "Langkah", "steps": "<ol><li>Bandingkan folder di Soal 4 dengan folder <code>Users/sri.wahyuni/Pictures/Acara_Kantor</code> dan <code>Users/sri.wahyuni/Documents/Arsip_2024</code>.</li><li>Baca <code>targets.txt</code> di <code>$OrphanFiles</code>.</li></ol>", "ask": "<p>File apa yang menjelaskan mengapa folder Acara_Kantor dan Arsip_2024 tidak terenkripsi?</p>", "text": "folder yang tidak terenkripsi langkah:\n1. bandingkan folder di soal 4 dengan folder users/sri.wahyuni/pictures/acara_kantor dan users/sri.wahyuni/documents/arsip_2024.\n2. baca targets.txt di $orphanfiles.\n\npertanyaan: file apa yang menjelaskan mengapa folder acara_kantor dan arsip_2024 tidak terenkripsi?\n", "hint": "File itu ada di $OrphanFiles dan berisi daftar folder.", "mandiri": false, "isian": "Jawaban singkat", "mask": "t******.t**"}, {"n": 18, "lvl": "Menengah", "title": "\"Foto\" yang ternyata program", "tahap": "Tahap 7 · Identifikasi file berbahaya", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Extension Mismatch Detected</strong> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li><li>Klik file yang mencurigakan, lalu lihat tab <strong>Hex</strong>. Dua byte pertama <code>4D 5A</code> (huruf \"MZ\") adalah tanda file program Windows (.exe).</li></ol>", "ask": "<p>File .jpg mana yang isinya sebenarnya program Windows?</p>", "text": "\"foto\" yang ternyata program langkah:\n1. buka analysis results → extension mismatch detected (p9).\n2. klik file yang mencurigakan, lalu lihat tab hex. dua byte pertama 4d 5a (huruf \"mz\") adalah tanda file program windows (.exe).\n\npertanyaan: file .jpg mana yang isinya sebenarnya program windows?\n", "hint": "Lihat Extension Mismatch Detected dan cari file dengan byte awal 4D 5A (MZ).", "mandiri": false, "isian": "Jawaban singkat", "mask": "f***_p*****_k******.j**"}, {"n": 19, "lvl": "Menengah", "title": "Program yang sama di tempat lain", "tahap": "Tahap 7 · Identifikasi file berbahaya", "label": "Langkah", "steps": "<ol><li>Catat MD5 file dari Soal 18.</li><li>Cari MD5 itu dengan <strong>File Search by Attributes</strong> (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li></ol>", "ask": "<p>Dengan nama apa file identik dari Soal 18 ditemukan di folder Temp?</p>", "text": "program yang sama di tempat lain langkah:\n1. catat md5 file dari soal 18.\n2. cari md5 itu dengan file search by attributes (p8).\n\npertanyaan: dengan nama apa file identik dari soal 18 ditemukan di folder temp?\n", "hint": "Cari MD5 file dari Soal 18 dengan File Search by Attributes.", "mandiri": false, "isian": "Jawaban singkat", "mask": "W********.e**"}, {"n": 20, "lvl": "Menengah", "title": "Hash set known-bad", "tahap": "Tahap 7 · Identifikasi file berbahaya", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Hashset Hits → KABUT_known_bad</strong>.</li></ol>", "ask": "<p>Apa nama biner locker yang tertandai Notable di ProgramData/KabutGelap/svc?</p>", "text": "hash set known-bad langkah:\n1. buka analysis results → hashset hits → kabut_known_bad.\n\npertanyaan: apa nama biner locker yang tertandai notable di programdata/kabutgelap/svc?\n", "hint": "Lihat Hashset Hits dan cari file di folder svc.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k**.e**"}, {"n": 21, "lvl": "Menengah", "title": "Waktu yang dipalsukan (timestomp)", "tahap": "Tahap 7 · Identifikasi file berbahaya", "label": "Langkah", "steps": "<ol><li>Klik <code>Users/sri.wahyuni/AppData/Local/Temp/WinUpdate.exe</code>, lalu buka tab <strong>File Metadata</strong>.</li><li>Gulir ke bawah. Ada dua kelompok waktu: <strong><code>$STANDARD_INFORMATION</code></strong> (yang biasa tampil di tabel dan mudah diubah program) dan <strong><code>$FILE_NAME</code></strong> (diisi oleh Windows dan sulit diubah).</li><li>Bandingkan nilai <em>Created</em> di kedua kelompok.</li></ol>", "ask": "<p>Berapa nilai Created di $FILE_NAME milik WinUpdate.exe (YYYY-MM-DD HH:MM:SS)?</p>", "text": "waktu yang dipalsukan (timestomp) langkah:\n1. klik users/sri.wahyuni/appdata/local/temp/winupdate.exe, lalu buka tab file metadata.\n2. gulir ke bawah. ada dua kelompok waktu: $standard_information (yang biasa tampil di tabel dan mudah diubah program) dan $file_name (diisi oleh windows dan sulit diubah).\n3. bandingkan nilai created di kedua kelompok.\n\npertanyaan: berapa nilai created di $file_name milik winupdate.exe (yyyy-mm-dd hh:mm:ss)?\n", "hint": "Di tab File Metadata, gulir ke kelompok $FILE_NAME, bukan $STANDARD_INFORMATION.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-** **:**:**"}, {"n": 22, "lvl": "Sulit", "title": "Memulihkan file asli sebelum dienkripsi", "tahap": "Tahap 8 · Carving", "label": "Langkah", "steps": "<ol><li>Buka folder <strong><code>$CarvedFiles</code></strong> (<a class=\"pref\" href=\"#panduan-p10\" data-p=\"P10\">P10</a>).</li><li>Buka file hasil carving (xlsx, docx, pdf, jpg) dengan tab <strong>Application</strong> atau <strong>Metadata</strong>. Judul dan Author di metadata dokumen membantu mengenali file aslinya.</li><li>Cocokkan dengan nama file <code>.kabut</code> (misalnya <code>Daftar_Gaji_Mei_2025.xlsx.kabut</code>).</li></ol>", "ask": "<p>Berapa jumlah file asli yang pulih utuh lewat carving?</p>", "text": "memulihkan file asli sebelum dienkripsi langkah:\n1. buka folder $carvedfiles (p10).\n2. buka file hasil carving (xlsx, docx, pdf, jpg) dengan tab application atau metadata. judul dan author di metadata dokumen membantu mengenali file aslinya.\n3. cocokkan dengan nama file .kabut (misalnya daftar_gaji_mei_2025.xlsx.kabut).\n\npertanyaan: berapa jumlah file asli yang pulih utuh lewat carving?\n", "hint": "Cocokkan judul dan Author di metadata setiap file hasil carving dengan nama file .kabut.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 23, "lvl": "Sulit", "title": "Mengapa tidak semua bisa dipulihkan?", "tahap": "Tahap 8 · Carving", "label": "Langkah", "steps": "<ol><li>Bandingkan jumlah file <code>.kabut</code> (Soal 4) dengan jumlah file asli yang terpulihkan (Soal 22).</li><li>Periksa <strong>Views → Deleted Files</strong>. Apakah file asli muncul dengan namanya?</li></ol>", "ask": "<p>Berapa file asli yang tidak dapat dipulihkan sama sekali?</p>", "text": "mengapa tidak semua bisa dipulihkan? langkah:\n1. bandingkan jumlah file .kabut (soal 4) dengan jumlah file asli yang terpulihkan (soal 22).\n2. periksa views → deleted files. apakah file asli muncul dengan namanya?\n\npertanyaan: berapa file asli yang tidak dapat dipulihkan sama sekali?\n", "hint": "Kurangkan jumlah file asli yang pulih dari jumlah file .kabut.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 24, "lvl": "Sulit", "title": "Rantai eksekusi", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Run Programs</strong>. Bila kosong, buka folder <code>Windows/Prefetch/</code>: nama file <code>.pf</code> menunjukkan program yang pernah dijalankan, dan waktu modifikasinya menunjukkan kapan terakhir dijalankan.</li><li>Buka <strong>Tools → Timeline</strong> (<a class=\"pref\" href=\"#panduan-p11\" data-p=\"P11\">P11</a>) untuk 2025-06-02 14:00 sampai 2025-06-03 02:00.</li><li>Gabungkan dengan isi <code>kbl.log</code>.</li></ol>", "ask": "<p>Program apa yang dipakai untuk menghapus shadow copy menurut folder Prefetch?</p>", "text": "rantai eksekusi langkah:\n1. buka data artifacts → run programs. bila kosong, buka folder windows/prefetch/: nama file .pf menunjukkan program yang pernah dijalankan, dan waktu modifikasinya menunjukkan kapan terakhir dijalankan.\n2. buka tools → timeline (p11) untuk 2025-06-02 14:00 sampai 2025-06-03 02:00.\n3. gabungkan dengan isi kbl.log.\n\npertanyaan: program apa yang dipakai untuk menghapus shadow copy menurut folder prefetch?\n", "hint": "Cari file .pf yang namanya berkaitan dengan Volume Shadow Copy.", "mandiri": false, "isian": "Jawaban singkat", "mask": "V*******.E**"}, {"n": 25, "lvl": "Sulit", "title": "Klaim pelaku", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Baca ulang <code>negosiasi_kabut.txt</code> dan cari kalimat pelaku tentang \"perusahaan logistik di Semarang\".</li></ol>", "ask": "<p>Apakah kalimat pelaku tentang \"perusahaan logistik di Semarang\" cukup sendirian untuk membuktikan serangan ke perusahaan itu? (ya/tidak)</p>", "text": "klaim pelaku langkah:\n1. baca ulang negosiasi_kabut.txt dan cari kalimat pelaku tentang \"perusahaan logistik di semarang\".\n\npertanyaan: apakah kalimat pelaku tentang \"perusahaan logistik di semarang\" cukup sendirian untuk membuktikan serangan ke perusahaan itu? (ya/tidak)\n\n---\n", "hint": "Itu klaim dalam pesan pemerasan. Pikirkan apa yang dibutuhkan untuk menguatkannya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "t****"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 26, "lvl": "Sulit", "title": "Asal biner ransomware", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat MD5 <code>ProgramData/KabutGelap/svc/kbl.exe</code> di EVD-03.</li><li>Tambahkan <code><span class=\"evd\">EVD-08</span>.dd</code> (laptop tersangka Fajar) ke case yang sama. Ingest cukup dengan <strong>Hash Lookup</strong> dan <strong>File Type Identification</strong>.</li><li>Di EVD-08, buka folder <code>/home/fajar/tools/build/</code> dan bandingkan MD5 setiap file dengan <code>kbl.exe</code>.</li></ol>", "ask": "<p>File apa di EVD-08 yang identik dengan kbl.exe?</p>", "text": "asal biner ransomware langkah:\n1. catat md5 programdata/kabutgelap/svc/kbl.exe di evd-03.\n2. tambahkan evd-08.dd (laptop tersangka fajar) ke case yang sama. ingest cukup dengan hash lookup dan file type identification.\n3. di evd-08, buka folder /home/fajar/tools/build/ dan bandingkan md5 setiap file dengan kbl.exe.\n\npertanyaan: file apa di evd-08 yang identik dengan kbl.exe?\n", "hint": "Bandingkan MD5 file di /home/fajar/tools/build/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k**_a******.e**"}, {"n": 27, "lvl": "Sulit", "title": "Kelompok yang sama, wallet berbeda", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Tambahkan <code><span class=\"evd\">EVD-11</span>.dd</code> (file server SLN) ke case yang sama.</li><li>Di EVD-11, cari dan buka <code>BACA_SAYA_KABUT.txt</code>.</li><li>Bandingkan dengan catatan tebusan EVD-03 (Soal 6): email kontak, ekstensi file, wallet, dan nominal.</li></ol>", "ask": "<p>Email kontak apa yang sama di catatan tebusan EVD-03 dan EVD-11?</p>", "text": "kelompok yang sama, wallet berbeda langkah:\n1. tambahkan evd-11.dd (file server sln) ke case yang sama.\n2. di evd-11, cari dan buka baca_saya_kabut.txt.\n3. bandingkan dengan catatan tebusan evd-03 (soal 6): email kontak, ekstensi file, wallet, dan nominal.\n\npertanyaan: email kontak apa yang sama di catatan tebusan evd-03 dan evd-11?\n\n---\n", "hint": "Bandingkan baris kontak di kedua catatan tebusan.", "mandiri": false, "isian": "Jawaban singkat", "mask": "n********@k********.**"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> vektor infeksi, kerugian (file terenkripsi dan data dicuri), dan upaya pelaku menghapus jejak.</li><li><strong>Tidak terbukti:</strong> misalnya identitas operator dan apakah data benar-benar dipublikasikan.</li><li><strong>Keterbatasan:</strong> misalnya file hasil carving tanpa nama atau waktu asli, sebagian file tidak dapat dipulihkan, dan klaim pelaku di chat.</li></ul>", "scen_title": "EVD-03 — Workstation Terkena Ransomware", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP (fiktif). Laporan korban kedua: PT Arunika Mebel Jepara.<br><strong>Barang bukti:</strong> PC admin keuangan <strong>ARUNIKA-ADM01</strong>, pengguna <strong>Sri Wahyuni</strong>. Disita pada 5 Juni 2025 pukul 17.00 WIB.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-03</span>.dd</code> (raw, 82 MiB, MBR + NTFS). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>Pada pagi 3 Juni 2025 Sri mendapati semua file kerjanya berekstensi <code>.kabut</code> dan ada catatan <code>BACA_SAYA_KABUT.txt</code>. Pelaku meminta 0,85 BTC. Direktur (Budi Santoso) memerintahkan Sri bernegosiasi lewat email, lalu memutuskan melapor ke polisi tanpa membayar.</p><p>Sehari sebelumnya Sri menerima email \"permintaan penawaran mebel restoran\" dari \"Hotel Nusa Indah\" berlampiran ZIP katalog.</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Tentukan vektor awal infeksi dan file pemicunya.</li><li>Identifikasi dropper, locker, konfigurasi, wallet, dan kontak pelaku.</li><li>Buktikan upaya anti-forensik: penghapusan shadow copy, timestomp, dan pembersihan folder kerja.</li><li>Pulihkan sebanyak mungkin file asli sebelum dienkripsi.</li><li>Cari indikasi pencurian data (double extortion) dan kaitannya dengan korban lain (SLN).</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Sebut vektor infeksi, kerugian, anti-forensik, dan apa yang belum terbukti tentang operator."}, {"id": "EVD-04", "title": "EVD-04 — Lembar Kerja (Webserver Di-deface)", "short": "Webserver Di-deface", "exam": false, "intro": "<aside class=\"note\"><p>Catatan Linux untuk pemula: konfigurasi sistem ada di <code>/etc</code>, file situs web di <code>/var/www</code>, log di <code>/var/log</code>, dan folder pengguna di <code>/home/&lt;nama&gt;</code>. File yang namanya diawali titik (misalnya <code>.htaccess</code>) adalah file tersembunyi.</p></aside>", "sections": [{"n": "1", "name": "Pemeriksaan EVD-04", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-04</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-04</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-04.dd.\n\npertanyaan: berapa md5 image evd-04.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "1d5726**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-04</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>File Type Identification, Extension Mismatch Detector (All file types), Hash Lookup, Keyword Search, EXIF Parser, Interesting Files, PhotoRec Carver</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-04.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): file type identification, extension mismatch detector (all file types), hash lookup, keyword search, exif parser, interesting files, photorec carver.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Jenis file system", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-04</span>.dd</code> di pohon kiri. Perhatikan apakah Autopsy menampilkan daftar partisi, atau langsung menampilkan folder.</li></ol>", "ask": "<p>File system apa yang dipakai image ini?</p>", "text": "jenis file system langkah:\n1. klik evd-04.dd di pohon kiri. perhatikan apakah autopsy menampilkan daftar partisi, atau langsung menampilkan folder.\n\npertanyaan: file system apa yang dipakai image ini?\n", "hint": "Image ini langsung berisi folder tanpa partition table. Sistem Linux biasanya memakai keluarga ext.", "mandiri": false, "isian": "Jawaban singkat", "mask": "e***"}, {"n": 4, "lvl": "Dasar", "title": "Identitas server", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <code>/etc/hostname</code>, <code>/etc/os-release</code>, dan <code>/etc/timezone</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa hostname server ini?</p>", "text": "identitas server langkah:\n1. buka /etc/hostname, /etc/os-release, dan /etc/timezone dengan tab text.\n\npertanyaan: apa hostname server ini?\n", "hint": "Buka /etc/hostname.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k**-w****"}, {"n": 5, "lvl": "Dasar", "title": "Akun pengguna", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <code>/etc/passwd</code> dengan tab <strong>Text</strong>. Setiap baris berformat <code>nama:x:UID:GID:keterangan:home:shell</code>.</li></ol>", "ask": "<p>Berapa UID akun www-data?</p>", "text": "akun pengguna langkah:\n1. buka /etc/passwd dengan tab text. setiap baris berformat nama:x:uid:gid:keterangan:home:shell.\n\npertanyaan: berapa uid akun www-data?\n", "hint": "Di /etc/passwd, UID adalah angka ketiga pada baris www-data.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 6, "lvl": "Dasar", "title": "Lokasi situs web", "tahap": "Tahap 4 · Penelusuran file situs", "label": "Langkah", "steps": "<ol><li>Buka <code>/etc/apache2/sites-available/kspmakmur.conf</code>.</li></ol>", "ask": "<p>Apa DocumentRoot situs koperasi?</p>", "text": "lokasi situs web langkah:\n1. buka /etc/apache2/sites-available/kspmakmur.conf.\n\npertanyaan: apa documentroot situs koperasi?\n", "hint": "Cari baris DocumentRoot di kspmakmur.conf.", "mandiri": false, "isian": "Jawaban singkat", "mask": "/v**/w**/k********"}, {"n": 7, "lvl": "Dasar", "title": "Halaman deface", "tahap": "Tahap 4 · Penelusuran file situs", "label": "Langkah", "steps": "<ol><li>Buka <code>index.html</code> di folder DocumentRoot dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa handle pelaku di halaman deface?</p>", "text": "halaman deface langkah:\n1. buka index.html di folder documentroot dengan tab text.\n\npertanyaan: apa handle pelaku di halaman deface?\n", "hint": "Baca judul halaman \"HACKED BY …\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "G****_K****"}, {"n": 8, "lvl": "Dasar", "title": "Folder upload", "tahap": "Tahap 4 · Penelusuran file situs", "label": "Langkah", "steps": "<ol><li>Buka <code>uploads/2025/06/</code> di dalam DocumentRoot.</li></ol>", "ask": "<p>Berapa jumlah file di uploads/2025/06, termasuk file tersembunyi?</p>", "text": "folder upload langkah:\n1. buka uploads/2025/06/ di dalam documentroot.\n\npertanyaan: berapa jumlah file di uploads/2025/06, termasuk file tersembunyi?\n", "hint": "Hitung semua file, termasuk yang namanya diawali titik.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 9, "lvl": "Dasar", "title": "Aturan .htaccess di folder upload", "tahap": "Tahap 4 · Penelusuran file situs", "label": "Langkah", "steps": "<ol><li>Buka <code>uploads/2025/06/.htaccess</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Ekstensi apa yang dibuat diproses sebagai PHP oleh .htaccess di folder upload?</p>", "text": "aturan .htaccess di folder upload langkah:\n1. buka uploads/2025/06/.htaccess dengan tab text.\n\npertanyaan: ekstensi apa yang dibuat diproses sebagai php oleh .htaccess di folder upload?\n", "hint": "Lihat baris AddType.", "mandiri": false, "isian": "Jawaban singkat", "mask": ".j**"}, {"n": 10, "lvl": "Dasar", "title": "Catatan admin", "tahap": "Tahap 4 · Penelusuran file situs", "label": "Langkah", "steps": "<ol><li>Buka <code>/home/agus/catatan_server.txt</code>.</li></ol>", "ask": "<p>Celah apa yang sudah diketahui admin menurut catatan_server.txt?</p>", "text": "catatan admin langkah:\n1. buka /home/agus/catatan_server.txt.\n\npertanyaan: celah apa yang sudah diketahui admin menurut catatan_server.txt?\n", "hint": "Cari baris TODO di catatan itu.", "mandiri": false, "isian": "Jawaban singkat", "mask": "u*****"}, {"n": 11, "lvl": "Dasar", "title": "Foto berita", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → EXIF Metadata</strong> untuk foto di <code>uploads/2025/05/</code>.</li></ol>", "ask": "<p>Model kamera apa yang dipakai untuk foto berita di uploads/2025/05/?</p>", "text": "foto berita langkah:\n1. buka data artifacts → exif metadata untuk foto di uploads/2025/05/.\n\npertanyaan: model kamera apa yang dipakai untuk foto berita di uploads/2025/05/?\n", "hint": "Lihat kolom Model di EXIF Metadata.", "mandiri": false, "isian": "Jawaban singkat", "mask": "C**** E** M**"}, {"n": 12, "lvl": "Menengah", "title": "SSH key", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <code>/home/agus/.ssh/authorized_keys</code> dengan tab <strong>Text</strong>. Setiap baris adalah satu kunci yang boleh login tanpa password, dan bagian akhir baris adalah komentar <code>nama@komputer</code>.</li><li>Lihat waktu <em>Modified</em> file itu di tab <strong>File Metadata</strong>.</li></ol>", "ask": "<p>Apa komentar pada SSH key yang mencurigakan di authorized_keys?</p>", "text": "ssh key langkah:\n1. buka /home/agus/.ssh/authorized_keys dengan tab text. setiap baris adalah satu kunci yang boleh login tanpa password, dan bagian akhir baris adalah komentar nama@komputer.\n2. lihat waktu modified file itu di tab file metadata.\n\npertanyaan: apa komentar pada ssh key yang mencurigakan di authorized_keys?\n", "hint": "Komentar adalah teks di akhir baris, berformat nama@komputer.", "mandiri": false, "isian": "Jawaban singkat", "mask": "f****@k***"}, {"n": 13, "lvl": "Menengah", "title": "Pemilik file", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik <code>uploads/2025/06/avatar_8812.jpg</code> dan <code>uploads/2025/06/.cache.php</code>, lalu lihat <strong>UID/GID</strong> di tab <strong>File Metadata</strong>.</li></ol>", "ask": "<p>User siapa pemilik avatar_8812.jpg dan .cache.php?</p>", "text": "pemilik file langkah:\n1. klik uploads/2025/06/avatar_8812.jpg dan uploads/2025/06/.cache.php, lalu lihat uid/gid di tab file metadata.\n\npertanyaan: user siapa pemilik avatar_8812.jpg dan .cache.php?\n", "hint": "Cocokkan UID di File Metadata dengan /etc/passwd.", "mandiri": false, "isian": "Jawaban singkat", "mask": "w**-d***"}, {"n": 14, "lvl": "Menengah", "title": "Waktu file yang janggal", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik <code>uploads/2025/06/.cache.php</code> dan buka tab <strong>File Metadata</strong>.</li><li>Catat keempat waktu: <strong>Created</strong>, <strong>Modified</strong>, <strong>Changed</strong>, dan <strong>Accessed</strong>.</li></ol>", "ask": "<p>Berapa nilai Created .cache.php (YYYY-MM-DD HH:MM:SS)?</p>", "text": "waktu file yang janggal langkah:\n1. klik uploads/2025/06/.cache.php dan buka tab file metadata.\n2. catat keempat waktu: created, modified, changed, dan accessed.\n\npertanyaan: berapa nilai created .cache.php (yyyy-mm-dd hh:mm:ss)?\n", "hint": "Di File Metadata ada empat waktu. Created tidak bisa diubah dengan perintah touch.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-** **:**:**"}, {"n": 15, "lvl": "Menengah", "title": "Deleted file", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files</strong> (<a class=\"pref\" href=\"#panduan-p6\" data-p=\"P6\">P6</a>).</li></ol>", "ask": "<p>Berapa ukuran (byte) yang ditampilkan Autopsy untuk deleted file di volume ini?</p>", "text": "deleted file langkah:\n1. buka views → deleted files (p6).\n\npertanyaan: berapa ukuran (byte) yang ditampilkan autopsy untuk deleted file di volume ini?\n", "hint": "Lihat kolom Size untuk index.php dan kbt_drop.sh di Deleted Files.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 16, "lvl": "Sulit", "title": "Memulihkan beranda asli", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Di Linux (ext4), isi deleted file tidak lagi tertaut ke namanya, tetapi teksnya bisa masih tersisa di unallocated space.</li><li>Jalankan Keyword Search <strong>Exact Match</strong> dengan kata <code>Selamat datang</code> (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li><li>Buka hasil dari unallocated space (<code>Unalloc</code>) dengan tab <strong>Indexed Text</strong>.</li></ol>", "ask": "<p>Versi CMS apa yang disebut di isi asli index.php?</p>", "text": "memulihkan beranda asli langkah:\n1. di linux (ext4), isi deleted file tidak lagi tertaut ke namanya, tetapi teksnya bisa masih tersisa di unallocated space.\n2. jalankan keyword search exact match dengan kata selamat datang (p7).\n3. buka hasil dari unallocated space (unalloc) dengan tab indexed text.\n\npertanyaan: versi cms apa yang disebut di isi asli index.php?\n", "hint": "Hasil keyword \"Selamat datang\" di unallocated space berupa potongan kode PHP beserta komentarnya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k**-c** *.*"}, {"n": 17, "lvl": "Sulit", "title": "Skrip download yang dihapus", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Perhatikan nama deleted file di folder <code>/tmp/.x/</code> (Soal 15).</li><li>Cari nama file itu dengan Keyword Search <strong>Exact Match</strong>, lalu buka hasil dari unallocated space.</li></ol>", "ask": "<p>Dari URL mana kbt_drop.sh di-download?</p>", "text": "skrip download yang dihapus langkah:\n1. perhatikan nama deleted file di folder /tmp/.x/ (soal 15).\n2. cari nama file itu dengan keyword search exact match, lalu buka hasil dari unallocated space.\n\npertanyaan: dari url mana kbt_drop.sh di-download?\n", "hint": "Isi skrip yang tersisa di unallocated space menyebut URL asalnya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "h***://1**.**.1**.**/*/k**_d***.**"}, {"n": 18, "lvl": "Menengah", "title": "Webshell berkedok gambar", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Extension Mismatch Detected</strong>.</li><li>Buka file yang muncul dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa kunci akses $k di webshell avatar_8812.jpg?</p>", "text": "webshell berkedok gambar langkah:\n1. buka analysis results → extension mismatch detected.\n2. buka file yang muncul dengan tab text.\n\npertanyaan: apa kunci akses $k di webshell avatar_8812.jpg?\n", "hint": "Buka file dengan tab Text dan cari variabel $k.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k******"}, {"n": 19, "lvl": "Menengah", "title": "Jejak handle pelaku", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Exact Match</strong> dengan kata <code>Gh0st_K4but</code>.</li></ol>", "ask": "<p>Apa path webshell kedua?</p>", "text": "jejak handle pelaku langkah:\n1. jalankan keyword search exact match dengan kata gh0st_k4but.\n\npertanyaan: apa path webshell kedua?\n", "hint": "Keyword Gh0st_K4but juga muncul di file tersembunyi di folder yang sama dengan avatar.", "mandiri": false, "isian": "Jawaban singkat", "mask": "/v**/w**/k********/u******/2***/**/.c****.p**"}, {"n": 20, "lvl": "Menengah", "title": "Hash set known-bad", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Hashset Hits → KABUT_known_bad</strong>.</li></ol>", "ask": "<p>File apa di /root yang ikut tertandai hash set?</p>", "text": "hash set known-bad langkah:\n1. buka analysis results → hashset hits → kabut_known_bad.\n\npertanyaan: file apa di /root yang ikut tertandai hash set?\n", "hint": "Isinya identik dengan halaman deface, meskipun namanya berbeda.", "mandiri": false, "isian": "Jawaban singkat", "mask": "d*****_i****.h***.b**"}, {"n": 21, "lvl": "Menengah", "title": "Salinan halaman deface", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Catat MD5 <code>index.html</code>, lalu cari file lain dengan MD5 yang sama (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li><li>Buka <code>/home/agus/.bash_history</code> untuk melihat perintah yang diketik admin.</li></ol>", "ask": "<p>User siapa yang membuat salinan deface_index.html.bak?</p>", "text": "salinan halaman deface langkah:\n1. catat md5 index.html, lalu cari file lain dengan md5 yang sama (p8).\n2. buka /home/agus/.bash_history untuk melihat perintah yang diketik admin.\n\npertanyaan: user siapa yang membuat salinan deface_index.html.bak?\n", "hint": "Cari perintah cp di /home/agus/.bash_history.", "mandiri": false, "isian": "Jawaban singkat", "mask": "a***"}, {"n": 22, "lvl": "Menengah", "title": "IP penyerang di log", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Buka <code>/var/log/apache2/access.log.1</code> dengan tab <strong>Text</strong>.</li><li>Cari baris yang memuat <code>/admin/login</code>, <code>upload.php</code>, dan <code>avatar_8812.jpg?cmd=</code>. Anda juga dapat menggunakan regex IP (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li></ol>", "ask": "<p>IP mana yang login ke panel admin, mengunggah file, dan memanggil webshell?</p>", "text": "ip penyerang di log langkah:\n1. buka /var/log/apache2/access.log.1 dengan tab text.\n2. cari baris yang memuat /admin/login, upload.php, dan avatar_8812.jpg?cmd=. anda juga dapat menggunakan regex ip (p7).\n\npertanyaan: ip mana yang login ke panel admin, mengunggah file, dan memanggil webshell?\n", "hint": "Satu IP yang sama muncul di /admin/login, upload.php, dan ?cmd=.", "mandiri": false, "isian": "Jawaban singkat", "mask": "1**.**.1**.**"}, {"n": 23, "lvl": "Menengah", "title": "Dua sumber waktu", "tahap": "Tahap 8 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Catat waktu <em>Created</em> <code>avatar_8812.jpg</code>, <code>.htaccess</code>, dan <code>index.html</code> (<strong>File Metadata</strong>).</li><li>Bandingkan dengan waktu permintaan di <code>access.log.1</code> dan <code>error.log.1</code>.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) avatar_8812.jpg diunggah?</p>", "text": "dua sumber waktu langkah:\n1. catat waktu created avatar_8812.jpg, .htaccess, dan index.html (file metadata).\n2. bandingkan dengan waktu permintaan di access.log.1 dan error.log.1.\n\npertanyaan: pukul berapa (hh:mm:ss) avatar_8812.jpg diunggah?\n", "hint": "Created file sama dengan jam POST upload di access log.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 24, "lvl": "Menengah", "title": "Celah aplikasi", "tahap": "Tahap 8 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Buka <code>/var/www/kspmakmur/admin/upload.php</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Bagian nama file apa yang diperiksa admin/upload.php sebelum menerima file?</p>", "text": "celah aplikasi langkah:\n1. buka /var/www/kspmakmur/admin/upload.php dengan tab text.\n\npertanyaan: bagian nama file apa yang diperiksa admin/upload.php sebelum menerima file?\n", "hint": "Lihat kode validasinya: yang diperiksa hanya nama, bukan isi.", "mandiri": false, "isian": "Jawaban singkat", "mask": "e*******"}, {"n": 25, "lvl": "Sulit", "title": "Rangkaian serangan", "tahap": "Tahap 8 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Tools → Timeline</strong> (<a class=\"pref\" href=\"#panduan-p11\" data-p=\"P11\">P11</a>) untuk 2025-06-20 01:50 sampai 02:40.</li><li>Gabungkan dengan temuan Soal 12–24.</li></ol>", "ask": "<p>Pada pukul berapa (HH:MM:SS) penyerang login SSH memakai kunci backdoor?</p>", "text": "rangkaian serangan langkah:\n1. buka tools → timeline (p11) untuk 2025-06-20 01:50 sampai 02:40.\n2. gabungkan dengan temuan soal 12–24.\n\npertanyaan: pada pukul berapa (hh:mm:ss) penyerang login ssh memakai kunci backdoor?\n", "hint": "Cari \"Accepted publickey\" di /var/log/auth.log.1.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 26, "lvl": "Sulit", "title": "Jejak admin sebelum akuisisi", "tahap": "Tahap 8 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Baca <code>/home/agus/.bash_history</code> dan baris log dari IP <code>10.0.0.5</code>.</li></ol>", "ask": "<p>IP mana di access log yang berasal dari admin, bukan penyerang?</p>", "text": "jejak admin sebelum akuisisi langkah:\n1. baca /home/agus/.bash_history dan baris log dari ip 10.0.0.5.\n\npertanyaan: ip mana di access log yang berasal dari admin, bukan penyerang?\n\n---\n", "hint": "Lihat permintaan pada pagi hari setelah serangan (pukul 08.xx).", "mandiri": false, "isian": "Jawaban singkat", "mask": "**.*.*.*"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 27, "lvl": "Sulit", "title": "Pemilik SSH key backdoor", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Tambahkan <code><span class=\"evd\">EVD-08</span>.dd</code> (laptop tersangka Fajar) ke case yang sama.</li><li>Di EVD-08, buka <code>/home/fajar/.ssh/id_ed25519.pub</code> dengan tab <strong>Text</strong>.</li><li>Bandingkan isinya dengan kunci mencurigakan di Soal 12.</li></ol>", "ask": "<p>Apakah SSH key mencurigakan di EVD-04 sama dengan id_ed25519.pub di EVD-08? (ya/tidak)</p>", "text": "pemilik ssh key backdoor langkah:\n1. tambahkan evd-08.dd (laptop tersangka fajar) ke case yang sama.\n2. di evd-08, buka /home/fajar/.ssh/id_ed25519.pub dengan tab text.\n3. bandingkan isinya dengan kunci mencurigakan di soal 12.\n\npertanyaan: apakah ssh key mencurigakan di evd-04 sama dengan id_ed25519.pub di evd-08? (ya/tidak)\n", "hint": "Bandingkan seluruh teks kunci publik, termasuk komentar di akhir.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 28, "lvl": "Sulit", "title": "Ke mana database koperasi berpindah?", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Di EVD-04, catat MD5 <code>/home/agus/backup/ksp_cms_2025-06-19.sql</code>.</li><li>Tambahkan <code><span class=\"evd\">EVD-06</span>.dd</code> (laptop penjual data) ke case yang sama, dengan modul <strong>Hash Lookup</strong>.</li><li>Cari MD5 tersebut dengan <strong>File Search by Attributes</strong> (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li></ol>", "ask": "<p>Apa nama file di EVD-06 yang identik dengan ksp_cms_2025-06-19.sql?</p>", "text": "ke mana database koperasi berpindah? langkah:\n1. di evd-04, catat md5 /home/agus/backup/ksp_cms_2025-06-19.sql.\n2. tambahkan evd-06.dd (laptop penjual data) ke case yang sama, dengan modul hash lookup.\n3. cari md5 tersebut dengan file search by attributes (p8).\n\npertanyaan: apa nama file di evd-06 yang identik dengan ksp_cms_2025-06-19.sql?\n\n---\n", "hint": "Cari MD5 file backup itu di EVD-06. Hasilnya ada di folder \"dagangan\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "k**_c**_a******.s**"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> cara masuk, perubahan yang dilakukan, dan cara pelaku mempertahankan akses (persistensi).</li><li><strong>Tidak terbukti:</strong> misalnya siapa orang di balik IP atau handle, dan bagaimana password admin diperoleh.</li><li><strong>Keterbatasan:</strong> misalnya tindakan admin sebelum akuisisi, log yang hanya cuplikan, dan <code>index.php</code> yang pulih tanpa metadata.</li></ul>", "scen_title": "EVD-04 — Disk Webserver yang Di-deface", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP (fiktif). Laporan Koperasi Simpan Pinjam Makmur Bersama, Kudus.<br><strong>Barang bukti:</strong> image logical volume root webserver <strong>ksp-web01</strong> (Ubuntu 22.04, Apache + PHP) yang melayani <code>www.kspmakmur.id</code> (203.0.113.45). Diakuisisi penyedia hosting atas permintaan penyidik pada 20 Juni 2025 pukul 08.49 WIB.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-04</span>.dd</code> (raw, 64 MiB, <strong>ext4 tanpa partition table</strong>, seperti image LV). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>Pada pagi 20 Juni 2025 anggota koperasi melapor bahwa beranda situs berganti tulisan \"HACKED BY Gh0st_K4but\". Admin, Agus Salim, login pukul 08.12 lewat SSH, sempat melihat-lihat folder upload, dan menyalin halaman deface ke <code>/root</code> sebelum server dimatikan. Situs memakai CMS lokal \"ksp-cms 1.4\" yang punya celah unggah file.</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Bagaimana penyerang masuk, dan file apa yang diunggah?</li><li>Temukan semua webshell, termasuk yang disembunyikan.</li><li>Buktikan waktu unggah dengan artefak file system, lalu konfirmasi dengan cuplikan log.</li><li>Apakah ada persistensi (backdoor) setelah deface?</li><li>Hubungkan pelaku dengan kelompok KABUTGELAP dan barang bukti lain.</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Sebut cara masuk, perubahan, persistensi, dan apa yang tidak terbukti tentang identitas di balik IP."}, {"id": "EVD-05", "title": "EVD-05 — Lembar Kerja (Laptop Orang Dalam / Insider)", "short": "Laptop Orang Dalam / Insider", "exam": false, "intro": "", "sections": [{"n": "1", "name": "Pemeriksaan EVD-05", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-05</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-05</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-05.dd.\n\npertanyaan: berapa md5 image evd-05.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "45aeda**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-05</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Recent Activity, Encryption Detection, Embedded File Extractor, Email Parser, Keyword Search, Hash Lookup, File Type Identification, Interesting Files</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-05.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): recent activity, encryption detection, embedded file extractor, email parser, keyword search, hash lookup, file type identification, interesting files.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Disk dan identitas komputer", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-05</span>.dd</code> dan lihat daftar volume.</li><li>Buka <strong>Data Artifacts → Operating System Information</strong>.</li></ol>", "ask": "<p>Apa computer name laptop ini?</p>", "text": "disk dan identitas komputer langkah:\n1. klik evd-05.dd dan lihat daftar volume.\n2. buka data artifacts → operating system information.\n\npertanyaan: apa computer name laptop ini?\n", "hint": "Lihat Operating System Information.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**-**-I***"}, {"n": 4, "lvl": "Dasar", "title": "Akun pengguna", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>OS Accounts</strong> dan folder <code>Users/</code>.</li></ol>", "ask": "<p>Apa SID akun bagus.prakoso?</p>", "text": "akun pengguna langkah:\n1. buka os accounts dan folder users/.\n\npertanyaan: apa sid akun bagus.prakoso?\n", "hint": "Lihat OS Accounts. SID diakhiri empat digit.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*-*-*-**-34********-18********-27********-1***"}, {"n": 5, "lvl": "Dasar", "title": "Tawaran kerja", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → E-Mail Messages</strong>. Cara lain: buka folder <code>Users/bagus.prakoso/Documents/Pribadi/surel/</code>.</li><li>Buka juga <code>Users/bagus.prakoso/Downloads/Offer_Letter_Bagus.pdf</code>.</li></ol>", "ask": "<p>Berapa gaji per bulan yang ditawarkan kepada Bagus?</p>", "text": "tawaran kerja langkah:\n1. buka data artifacts → e-mail messages. cara lain: buka folder users/bagus.prakoso/documents/pribadi/surel/.\n2. buka juga users/bagus.prakoso/downloads/offer_letter_bagus.pdf.\n\npertanyaan: berapa gaji per bulan yang ditawarkan kepada bagus?\n", "hint": "Baca email penawaran atau Offer_Letter_Bagus.pdf.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**.0**.0**"}, {"n": 6, "lvl": "Dasar", "title": "Arsip mencurigakan", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Cari nama <code>SLN_arsip_0502</code> dengan <strong>File Search by Attributes</strong> (nama), atau dengan Keyword Search <em>Substring Match</em>.</li><li>Periksa juga <strong>Views → Deleted Files</strong>.</li></ol>", "ask": "<p>Berapa jumlah salinan SLN_arsip_0502.7z (aktif dan terhapus)?</p>", "text": "arsip mencurigakan langkah:\n1. cari nama sln_arsip_0502 dengan file search by attributes (nama), atau dengan keyword search substring match.\n2. periksa juga views → deleted files.\n\npertanyaan: berapa jumlah salinan sln_arsip_0502.7z (aktif dan terhapus)?\n", "hint": "Cek folder Documents/arsip, folder Dropbox, dan cache Dropbox.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 7, "lvl": "Dasar", "title": "Arsip terkunci", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Encryption Detected</strong> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li></ol>", "ask": "<p>File apa yang ditandai Encryption Detected?</p>", "text": "arsip terkunci langkah:\n1. buka analysis results → encryption detected (p9).\n\npertanyaan: file apa yang ditandai encryption detected?\n", "hint": "Lihat Analysis Results → Encryption Detected.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**_a****_0***.**"}, {"n": 8, "lvl": "Dasar", "title": "Surat pengunduran diri", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Cari <code>Surat_Pengunduran_Diri_Bagus.docx</code>, lalu lihat <strong>Data Artifacts → Metadata</strong>.</li></ol>", "ask": "<p>Berapa nomor revisi Surat_Pengunduran_Diri_Bagus.docx?</p>", "text": "surat pengunduran diri langkah:\n1. cari surat_pengunduran_diri_bagus.docx, lalu lihat data artifacts → metadata.\n\npertanyaan: berapa nomor revisi surat_pengunduran_diri_bagus.docx?\n", "hint": "Lihat field Revision di Metadata.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 9, "lvl": "Dasar", "title": "Pencarian Google", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Search</strong>.</li></ol>", "ask": "<p>Apa yang dicari Bagus pada 3 Mei 2025 tentang USB?</p>", "text": "pencarian google langkah:\n1. buka data artifacts → web search.\n\npertanyaan: apa yang dicari bagus pada 3 mei 2025 tentang usb?\n", "hint": "Lihat Web Search pada 2025-05-03.", "mandiri": false, "isian": "Jawaban singkat", "mask": "h**** r****** u** w****** **"}, {"n": 10, "lvl": "Dasar", "title": "Program yang diunduh", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Downloads</strong>.</li></ol>", "ask": "<p>Apa nama installer 7-Zip yang di-download Bagus?</p>", "text": "program yang diunduh langkah:\n1. buka data artifacts → web downloads.\n\npertanyaan: apa nama installer 7-zip yang di-download bagus?\n", "hint": "Lihat Web Downloads pada 25 April 2025.", "mandiri": false, "isian": "Jawaban singkat", "mask": "7*****-x**.e**"}, {"n": 11, "lvl": "Menengah", "title": "Flashdisk", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → USB Device Attached</strong>.</li></ol>", "ask": "<p>Merek flashdisk apa yang terhubung pada 2 Mei 2025?</p>", "text": "flashdisk langkah:\n1. buka data artifacts → usb device attached.\n\npertanyaan: merek flashdisk apa yang terhubung pada 2 mei 2025?\n", "hint": "Di USB Device Attached ada dua merek. Lihat tanggalnya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "K*******"}, {"n": 12, "lvl": "Menengah", "title": "Membuka file dari server kantor", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Recent Documents</strong>, lalu urutkan berdasarkan path. Perhatikan path yang diawali <strong><code>Z:\\</code></strong>. Huruf Z: di sini adalah drive jaringan yang terhubung ke server kantor.</li></ol>", "ask": "<p>Berapa file yang dibuka Bagus dari drive Z:?</p>", "text": "membuka file dari server kantor langkah:\n1. buka data artifacts → recent documents, lalu urutkan berdasarkan path. perhatikan path yang diawali z:\\. huruf z: di sini adalah drive jaringan yang terhubung ke server kantor.\n\npertanyaan: berapa file yang dibuka bagus dari drive z:?\n", "hint": "Hitung shortcut di Recent Documents yang path-nya diawali Z:\\.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 13, "lvl": "Menengah", "title": "Arsip disalin ke flashdisk", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Di <strong>Recent Documents</strong>, cari shortcut yang menunjuk ke <code>E:\\SLN_arsip_0502.7z</code> dan shortcut yang namanya memuat nama flashdisk.</li><li>Bandingkan waktunya dengan flashdisk di Soal 11.</li></ol>", "ask": "<p>Apa label flashdisk yang tercantum di nama shortcut drive E:?</p>", "text": "arsip disalin ke flashdisk langkah:\n1. di recent documents, cari shortcut yang menunjuk ke e:\\sln_arsip_0502.7z dan shortcut yang namanya memuat nama flashdisk.\n2. bandingkan waktunya dengan flashdisk di soal 11.\n\npertanyaan: apa label flashdisk yang tercantum di nama shortcut drive e:?\n", "hint": "Shortcut drive diberi nama berformat \"LABEL (E)\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "K*******"}, {"n": 14, "lvl": "Menengah", "title": "Program yang dijalankan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Run Programs</strong>. Bila kosong, buka folder <code>Windows/Prefetch/</code> dan lihat waktu modifikasi file <code>7ZFM.EXE-<em>.pf</code> dan <code>DROPBOX.EXE-</em>.pf</code>.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) 7-Zip terakhir dijalankan pada 2 Mei?</p>", "text": "program yang dijalankan langkah:\n1. buka data artifacts → run programs. bila kosong, buka folder windows/prefetch/ dan lihat waktu modifikasi file 7zfm.exe-.pf dan dropbox.exe-.pf.\n\npertanyaan: pukul berapa (hh:mm:ss) 7-zip terakhir dijalankan pada 2 mei?\n", "hint": "Lihat Run Programs atau waktu file 7ZFM.EXE-*.pf.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 15, "lvl": "Menengah", "title": "Recycle Bin", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Recycle Bin</strong>. Cara lain: buka folder <code>$Recycle.Bin/&lt;SID Bagus&gt;/</code> dan baca file <code>$R…</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa nama file asli item di Recycle Bin?</p>", "text": "recycle bin langkah:\n1. buka data artifacts → recycle bin. cara lain: buka folder $recycle.bin/<sid bagus>/ dan baca file $r… dengan tab text.\n\npertanyaan: apa nama file asli item di recycle bin?\n", "hint": "File $I menyimpan path asli.", "mandiri": false, "isian": "Jawaban singkat", "mask": "c******_p******.t**"}, {"n": 16, "lvl": "Menengah", "title": "Folder \"bahan presentasi\" yang dihapus", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files</strong> (<a class=\"pref\" href=\"#panduan-p6\" data-p=\"P6\">P6</a>) dan cari folder <code>bahan_presentasi</code> di <code>Documents</code>.</li><li>Buka setiap subfolder dan file di dalamnya.</li></ol>", "ask": "<p>Apa nama folder staging yang dihapus di Documents?</p>", "text": "folder \"bahan presentasi\" yang dihapus langkah:\n1. buka views → deleted files (p6) dan cari folder bahan_presentasi di documents.\n2. buka setiap subfolder dan file di dalamnya.\n\npertanyaan: apa nama folder staging yang dihapus di documents?\n", "hint": "Cari folder terhapus berisi subfolder bernomor 01–04.", "mandiri": false, "isian": "Jawaban singkat", "mask": "b****_pr********"}, {"n": 17, "lvl": "Menengah", "title": "Membuka arsip", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Gunakan password dari Soal 15.</li><li>Klik kanan arsip <code>Documents/arsip/SLN_arsip_0502.7z</code> → <strong>Extract File(s)</strong>, lalu buka dengan 7-Zip di komputer Anda.</li></ol>", "ask": "<p>Apa password arsip SLN_arsip_0502.7z?</p>", "text": "membuka arsip langkah:\n1. gunakan password dari soal 15.\n2. klik kanan arsip documents/arsip/sln_arsip_0502.7z → extract file(s), lalu buka dengan 7-zip di komputer anda.\n\npertanyaan: apa password arsip sln_arsip_0502.7z?\n", "hint": "Password tertulis di file yang dibuang ke Recycle Bin.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**#b********!"}, {"n": 18, "lvl": "Menengah", "title": "Data pribadi pelanggan", "tahap": "Tahap 7 · Pencarian", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Sea pus pada 2 Mei?</p>", "text": "timeline 2 mei 2025 langkah:\n1. buka tools → timeline (p11) untuk 2025-05-02 17:50 sampai 21:15.\n2. gabungkan dengan temuan soal 11–22.\n\npertanyaan: pukul berapa (hh:mm:ss) folder staging dihapus pada 2 mei?\n", "hint": "Lihat Timeline. Ini kejadian terakhir dari Bagus sendiri pada sore itu.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 24, "lvl": "Sulit", "title": "Upaya menghapus jejak", "tahap": "Tahap 8 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Daftar semua tindakan penghapusan yang Anda temukan (Soal 9, 15, 16, dan 21).</li></ol>", "ask": "<p>Upaya menghapus jejak mana yang berhasil menyembunyikan informasi (sampai password ditemukan)?</p>", "text": "upaya menghapus jejak langkah:\n1. daftar semua tindakan penghapusan yang anda temukan (soal 9, 15, 16, dan 21).\n\npertanyaan: upaya menghapus jejak mana yang berhasil menyembunyikan informasi (sampai password ditemukan)?\n", "hint": "Semua penghapusan gagal. Satu tindakan lain efektif menyembunyikan isi.", "mandiri": false, "isian": "Jawaban singkat", "mask": "p******* a****"}, {"n": 25, "lvl": "Sulit", "title": "Menguji dalih tersangka", "tahap": "Tahap 8 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Baca ulang <code>scenario.md</code>, bagian dalih Bagus.</li></ol>", "ask": "<p>Apakah dalih \"bahan presentasi IT\" didukung bukti? (ya/tidak)</p>", "text": "menguji dalih tersangka langkah:\n1. baca ulang scenario.md, bagian dalih bagus.\n\npertanyaan: apakah dalih \"bahan presentasi it\" didukung bukti? (ya/tidak)\n\n---\n", "hint": "Lihat isi folder, perlindungan password, tujuan pengiriman, dan penghapusannya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "t****"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 26, "lvl": "Sulit", "title": "Arsip yang sama di server korban ransomware", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat MD5 arsip dari Soal 19 , "mask": "**:**:**"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> data apa yang dikumpulkan, dikemas, dan dikirim (Dropbox dan flashdisk), kepada siapa, dan motif yang terdokumentasi.</li><li><strong>Tidak terbukti:</strong> misalnya isi flashdisk Kingston yang tidak disita, dan pengiriman password lewat WhatsApp.</li><li><strong>Keterbatasan:</strong> misalnya artefak Dropbox yang disederhanakan, dan metadata dokumen yang dapat diubah.</li></ul>", "scen_title": "EVD-05 — Laptop Insider (Exfiltration)", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP — LP/B/117/IV/2025/SIBER/PDNR (fiktif)<br><strong>Barang bukti:</strong> laptop dinas <strong>SLN-LT-IT02</strong>, pengguna <strong>Bagus Prakoso</strong> (staf IT PT Samudra Logistik Nusantara). Diamankan HRD dan diserahkan ke penyidik pada 20 Mei 2025 pukul 09.00 WIB, setelah Bagus mengajukan pengunduran diri.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-05</span>.dd</code> (raw, 88 MiB, MBR + NTFS). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>Setelah serangan ransomware pada SLN-FS01 (17 Mei 2025, EVD-11), data pelanggan SLN dijual di forum (EVD-06). Audit akses menunjukkan Bagus beberapa kali membuka share <code>\\\\SLN-FS01\\RAHASIA</code> pada akhir April, padahal folder itu di luar tugasnya. Pada 5 Mei ia menyusun surat pengunduran diri. Dalam wawancara ia membantah pernah menyalin data perusahaan. Ia berdalih folder <code>bahan_presentasi</code> di laptopnya hanya \"untuk bahan presentasi IT\".</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Dokumen rahasia apa yang dikumpulkan, dari mana, dan kapan?</li><li>Bagaimana data dikemas dan apa passwordnya?</li><li>Ke mana data dikirim (cloud, USB)?</li><li>Adakah motif atau pihak penerima?</li><li>Apa upaya menghilangkan jejak?</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Pisahkan apa yang terbukti terkirim (Dropbox, flashdisk) dari yang hanya tertulis (password lewat WA)."}, {"id": "EVD-06", "title": "EVD-06 — Lembar Kerja (Laptop Penjual Data)", "short": "Laptop Penjual Data", "exam": false, "intro": "", "sections": [{"n": "1", "name": "Pemeriksaan EVD-06", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-06</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-06</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-06.dd.\n\npertanyaan: berapa md5 image evd-06.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "8b8c14**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-06</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Recent Activity, Keyword Search, Hash Lookup, File Type Identification, Embedded File Extractor, EXIF Parser, Interesting Files</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-06.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): recent activity, keyword search, hash lookup, file type identification, embedded file extractor, exif parser, interesting files.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Disk dan identitas komputer", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-06</span>.dd</code>. Perhatikan apakah ada daftar partisi.</li><li>Buka <strong>Data Artifacts → Operating System Information</strong> dan <strong>OS Accounts</strong>.</li></ol>", "ask": "<p>Apa computer name laptop ini?</p>", "text": "disk dan identitas komputer langkah:\n1. klik evd-06.dd. perhatikan apakah ada daftar partisi.\n2. buka data artifacts → operating system information dan os accounts.\n\npertanyaan: apa computer name laptop ini?\n", "hint": "Lihat Operating System Information.", "mandiri": false, "isian": "Jawaban singkat", "mask": "Y***-**"}, {"n": 4, "lvl": "Dasar", "title": "\"Dagangan\"", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>Users/yoga/Documents/dagangan/</code> dan setiap subfoldernya.</li></ol>", "ask": "<p>Apa nama subfolder di dagangan yang berisi data SLN?</p>", "text": "\"dagangan\" langkah:\n1. buka users/yoga/documents/dagangan/ dan setiap subfoldernya.\n\npertanyaan: apa nama subfolder di dagangan yang berisi data sln?\n", "hint": "Nama subfolder memuat kata logistik dan nama kota.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**_l*******_s*******_2***"}, {"n": 5, "lvl": "Dasar", "title": "Iklan penjualan", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>dagangan/SLN_logistik_semarang_2025/README_jual.txt</code>.</li></ol>", "ask": "<p>Berapa harga data SLN dalam BTC menurut README_jual.txt?</p>", "text": "iklan penjualan langkah:\n1. buka dagangan/sln_logistik_semarang_2025/
