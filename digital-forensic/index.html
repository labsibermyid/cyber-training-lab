const DATA = {"evs": [{"id": "EVD-01", "title": "EVD-01 — Lembar Kerja (Flashdisk Pelaku Phishing)", "short": "Flashdisk Pelaku Phishing", "exam": false, "intro": "", "sections": [{"n": "1", "name": "Pemeriksaan EVD-01", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a>: hitung MD5 <code><span class=\"evd\">EVD-01</span>.dd</code>, lalu bandingkan dengan isi <code>EVD-01.md5</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-01</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1: hitung md5 evd-01.dd, lalu bandingkan dengan isi evd-01.md5.\n\npertanyaan: berapa md5 image evd-01.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal. Bandingkan dengan isi EVD-01.md5.", "mandiri": false, "isian": "Jawaban singkat", "mask": "20ee27**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case, hash set, dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-01</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>). Jangan lupa time zone <strong>Asia/Jakarta</strong>.</li><li>Impor hash set <code>hashsets/KABUT_known_bad.txt</code> sebagai <strong>Notable</strong> (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Pada halaman ingest (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>), centang modul berikut: <strong>Hash Lookup, File Type Identification, Extension Mismatch Detector, Embedded File Extractor, Picture Analyzer/EXIF Parser, Keyword Search, Email Parser, PhotoRec Carver</strong>.</li><li>Tunggu sampai ingest selesai.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case, hash set, dan ingest langkah:\n1. buat case dan tambahkan evd-01.dd (p2). jangan lupa time zone asia/jakarta.\n2. impor hash set hashsets/kabut_known_bad.txt sebagai notable (p3).\n3. pada halaman ingest (p4), centang modul berikut: hash lookup, file type identification, extension mismatch detector, embedded file extractor, picture analyzer/exif parser, keyword search, email parser, photorec carver.\n4. tunggu sampai ingest selesai.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2. FAT menyimpan waktu lokal, jadi pilihan ini menentukan benar atau tidaknya semua jam.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Struktur disk", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Di pohon kiri, klik <code><span class=\"evd\">EVD-01</span>.dd</code>. Tabel di kanan menampilkan daftar volume (partisi).</li><li>Klik volume yang berisi file system, lalu buka tab <strong>File Metadata</strong> atau <em>Details</em>.</li></ol>", "ask": "<p>File system apa yang dipakai partisi data di image ini?</p>", "text": "struktur disk langkah:\n1. di pohon kiri, klik evd-01.dd. tabel di kanan menampilkan daftar volume (partisi).\n2. klik volume yang berisi file system, lalu buka tab file metadata atau details.\n\npertanyaan: file system apa yang dipakai partisi data di image ini?\n", "hint": "Klik image, lalu baca keterangan tipe pada baris volume yang bukan \"Unallocated\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "F****"}, {"n": 4, "lvl": "Dasar", "title": "Gambaran isi flashdisk", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka volume tersebut sampai terlihat folder di root.</li><li>Klik setiap folder dan amati jenis file di dalamnya, tanpa membuka isinya dulu.</li></ol>", "ask": "<p>Apa nama file PDF yang berada langsung di root flashdisk?</p>", "text": "gambaran isi flashdisk langkah:\n1. buka volume tersebut sampai terlihat folder di root.\n2. klik setiap folder dan amati jenis file di dalamnya, tanpa membuka isinya dulu.\n\npertanyaan: apa nama file pdf yang berada langsung di root flashdisk?\n", "hint": "Di root ada beberapa folder dan hanya satu file PDF. Namanya mirip invoice.", "mandiri": false, "isian": "Jawaban singkat", "mask": "I**_B**_M****_2***.p**"}, {"n": 5, "lvl": "Dasar", "title": "Kit phishing", "tahap": "Tahap 4 · Penelusuran file aktif", "label": "Langkah", "steps": "<ol><li>Buka folder <code>kit/</code>. Perhatikan subfolder dan file ZIP di dalamnya.</li><li>Buka <code>kit/samlognus-owa/config.php</code> dengan tab <strong>Text</strong> (<a class=\"pref\" href=\"#panduan-p5\" data-p=\"P5\">P5</a>).</li></ol>", "ask": "<p>Ke alamat email apa hasil panen kredensial dikirim (nilai notif_email di config.php)?</p>", "text": "kit phishing langkah:\n1. buka folder kit/. perhatikan subfolder dan file zip di dalamnya.\n2. buka kit/samlognus-owa/config.php dengan tab text (p5).\n\npertanyaan: ke alamat email apa hasil panen kredensial dikirim (nilai notif_email di config.php)?\n", "hint": "Kit ada di dalam folder kit/. Di config.php, cari variabel yang nilainya berbentuk alamat email.", "mandiri": false, "isian": "Jawaban singkat", "mask": "r*****.o**@k********.n**"}, {"n": 6, "lvl": "Dasar", "title": "Domain dan server phishing", "tahap": "Tahap 4 · Penelusuran file aktif", "label": "Langkah", "steps": "<ol><li>Tetap di <code>config.php</code>. Cari baris <code>phish_host</code>, <code>server_ip</code>, dan <code>redirect_ok</code>.</li></ol>", "ask": "<p>Apa domain phishing (nilai phish_host) di config.php?</p>", "text": "domain dan server phishing langkah:\n1. tetap di config.php. cari baris phish_host, server_ip, dan redirect_ok.\n\npertanyaan: apa domain phishing (nilai phish_host) di config.php?\n", "hint": "Variabel phish_host berisi nama host lengkap halaman login palsu.", "mandiri": false, "isian": "Jawaban singkat", "mask": "m***.s********-w******.c**"}, {"n": 7, "lvl": "Dasar", "title": "Daftar target", "tahap": "Tahap 4 · Penelusuran file aktif", "label": "Langkah", "steps": "<ol><li>Buka <code>target/emails_sln.txt</code> dan hitung jumlah barisnya.</li><li>Buka <code>target/catatan_target.txt</code>.</li></ol>", "ask": "<p>Berapa jumlah alamat email target di target/emails_sln.txt?</p>", "text": "daftar target langkah:\n1. buka target/emails_sln.txt dan hitung jumlah barisnya.\n2. buka target/catatan_target.txt.\n\npertanyaan: berapa jumlah alamat email target di target/emails_sln.txt?\n", "hint": "Satu baris berisi satu alamat. Hitung barisnya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 8, "lvl": "Dasar", "title": "Template email phishing", "tahap": "Tahap 4 · Penelusuran file aktif", "label": "Langkah", "steps": "<ol><li>Buka <code>template_email/reset_password_SLN.eml</code> dengan tab <strong>Text</strong>, atau lewat <strong>Data Artifacts → E-Mail Messages</strong> bila Email Parser sudah selesai.</li></ol>", "ask": "<p>Apa subject email pada template_email/reset_password_SLN.eml?</p>", "text": "template email phishing langkah:\n1. buka template_email/reset_password_sln.eml dengan tab text, atau lewat data artifacts → e-mail messages bila email parser sudah selesai.\n\npertanyaan: apa subject email pada template_email/reset_password_sln.eml?\n", "hint": "Baca baris header Subject di bagian atas file.", "mandiri": false, "isian": "Jawaban singkat", "mask": "[P******] P******** K*** S**** E**** K*****"}, {"n": 9, "lvl": "Dasar", "title": "Catatan pengiriman hasil panen", "tahap": "Tahap 4 · Penelusuran file aktif", "label": "Langkah", "steps": "<ol><li>Buka <code>hasil/kirim_ke_kabut.txt</code>.</li></ol>", "ask": "<p>Kepada siapa kredensial hasil panen dikirim menurut hasil/kirim_ke_kabut.txt?</p>", "text": "catatan pengiriman hasil panen langkah:\n1. buka hasil/kirim_ke_kabut.txt.\n\npertanyaan: kepada siapa kredensial hasil panen dikirim menurut hasil/kirim_ke_kabut.txt?\n", "hint": "Nama penerima juga menjadi bagian dari nama file catatan ini.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k****_a****"}, {"n": 10, "lvl": "Dasar", "title": "Metadata dokumen CV", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik <code>pribadi/CV_Rendi_Saputra.docx</code>.</li><li>Lihat <strong>Data Artifacts → Metadata</strong>, atau tab <em>Metadata</em> di content viewer (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li><li>Buka juga isinya di tab <strong>Text</strong>.</li></ol>", "ask": "<p>Siapa Author dokumen pribadi/CV_Rendi_Saputra.docx?</p>", "text": "metadata dokumen cv langkah:\n1. klik pribadi/cv_rendi_saputra.docx.\n2. lihat data artifacts → metadata, atau tab metadata di content viewer (p9).\n3. buka juga isinya di tab text.\n\npertanyaan: siapa author dokumen pribadi/cv_rendi_saputra.docx?\n", "hint": "Lihat Data Artifacts → Metadata atau tab Metadata pada file tersebut.", "mandiri": false, "isian": "Jawaban singkat", "mask": "R**** S******"}, {"n": 11, "lvl": "Dasar", "title": "Metadata template invoice", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Ulangi langkah Soal 10 untuk <code>template_email/invoice_template_vendor.docx</code>.</li></ol>", "ask": "<p>Siapa Author dokumen template_email/invoice_template_vendor.docx?</p>", "text": "metadata template invoice langkah:\n1. ulangi langkah soal 10 untuk template_email/invoice_template_vendor.docx.\n\npertanyaan: siapa author dokumen template_email/invoice_template_vendor.docx?\n", "hint": "Author di dokumen ini bukan nama asli, melainkan alias yang juga muncul di README kit.", "mandiri": false, "isian": "Jawaban singkat", "mask": "r*****"}, {"n": 12, "lvl": "Menengah", "title": "EXIF foto KTP", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → EXIF Metadata</strong> dan cari <code>pribadi/KTP_scan.jpg</code>.</li><li>Lihat gambarnya di tab <strong>Application</strong>.</li></ol>", "ask": "<p>Model kamera apa yang tercatat di EXIF pribadi/KTP_scan.jpg?</p>", "text": "exif foto ktp langkah:\n1. buka data artifacts → exif metadata dan cari pribadi/ktp_scan.jpg.\n2. lihat gambarnya di tab application.\n\npertanyaan: model kamera apa yang tercatat di exif pribadi/ktp_scan.jpg?\n", "hint": "Lihat kolom Model di EXIF Metadata.", "mandiri": false, "isian": "Jawaban singkat", "mask": "R**** N*** **"}, {"n": 13, "lvl": "Menengah", "title": "Lokasi foto ponsel", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Tools → Geolocation</strong> dan cari titik untuk <code>pribadi/foto_hp/IMG_20250407_101233.jpg</code>. Cara lain: lihat baris foto ini di EXIF Metadata.</li><li>Baca alamat kantor SLN di <code>scenario.md</code> (bagian Latar belakang).</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS, WIB) foto pribadi/foto_hp/IMG_20250407_101233.jpg diambil menurut EXIF?</p>", "text": "lokasi foto ponsel langkah:\n1. buka tools → geolocation dan cari titik untuk pribadi/foto_hp/img_20250407_101233.jpg. cara lain: lihat baris foto ini di exif metadata.\n2. baca alamat kantor sln di scenario.md (bagian latar belakang).\n\npertanyaan: pukul berapa (hh:mm:ss, wib) foto pribadi/foto_hp/img_20250407_101233.jpg diambil menurut exif?\n", "hint": "Lihat kolom Date Taken di EXIF Metadata. Nama file juga memberi petunjuk format waktunya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 14, "lvl": "Menengah", "title": "Daftar deleted file", "tahap": "Tahap 6 · Pemulihan deleted file", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files → File System</strong> (<a class=\"pref\" href=\"#panduan-p6\" data-p=\"P6\">P6</a>).</li><li>Bedakan file dari folder: folder punya ikon map.</li></ol>", "ask": "<p>Berapa jumlah deleted file (tidak termasuk folder) di volume ini?</p>", "text": "daftar deleted file langkah:\n1. buka views → deleted files → file system (p6).\n2. bedakan file dari folder: folder punya ikon map.\n\npertanyaan: berapa jumlah deleted file (tidak termasuk folder) di volume ini?\n", "hint": "Di Views → Deleted Files, hitung hanya baris berikon dokumen.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 15, "lvl": "Menengah", "title": "Memulihkan log hasil panen", "tahap": "Tahap 6 · Pemulihan deleted file", "label": "Langkah", "steps": "<ol><li>Di daftar deleted file, klik file log di folder <code>hasil/</code> yang namanya berakhiran <code>_0408.txt</code>.</li><li>Baca isinya di tab <strong>Text</strong>.</li><li>Klik kanan → <strong>Extract File(s)</strong>, lalu catat MD5 dari tab <strong>File Metadata</strong>.</li></ol>", "ask": "<p>Apa password akun dewi.anggraini@samlognus.co.id di log terhapus hasil/_og_0408.txt?</p>", "text": "memulihkan log hasil panen langkah:\n1. di daftar deleted file, klik file log di folder hasil/ yang namanya berakhiran _0408.txt.\n2. baca isinya di tab text.\n3. klik kanan → extract file(s), lalu catat md5 dari tab file metadata.\n\npertanyaan: apa password akun dewi.anggraini@samlognus.co.id di log terhapus hasil/_og_0408.txt?\n", "hint": "Setiap baris log berisi waktu, email, password, dan IP. Cari baris akun Dewi.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A****@i******"}, {"n": 16, "lvl": "Menengah", "title": "Folder lama yang dihapus", "tahap": "Tahap 6 · Pemulihan deleted file", "label": "Langkah", "steps": "<ol><li>Di daftar deleted file, buka folder terhapus di bawah <code>kit/</code> beserta isinya.</li></ol>", "ask": "<p>Template phishing jenis apa yang ada di folder terhapus kit/_ld?</p>", "text": "folder lama yang dihapus langkah:\n1. di daftar deleted file, buka folder terhapus di bawah kit/ beserta isinya.\n\npertanyaan: template phishing jenis apa yang ada di folder terhapus kit/_ld?\n", "hint": "Baca README_old.txt di dalam folder terhapus itu.", "mandiri": false, "isian": "Jawaban singkat", "mask": "i******* b******"}, {"n": 17, "lvl": "Menengah", "title": "File dengan ekstensi palsu", "tahap": "Tahap 7 · Pencarian dan identifikasi file", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Extension Mismatch Detected</strong> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li><li>Klik file yang muncul, lihat tab <strong>Hex</strong> (perhatikan beberapa byte pertama), lalu ekstrak file itu dan buka sesuai tipe aslinya.</li></ol>", "ask": "<p>File mana yang terdeteksi Extension Mismatch?</p>", "text": "file dengan ekstensi palsu langkah:\n1. buka analysis results → extension mismatch detected (p9).\n2. klik file yang muncul, lihat tab hex (perhatikan beberapa byte pertama), lalu ekstrak file itu dan buka sesuai tipe aslinya.\n\npertanyaan: file mana yang terdeteksi extension mismatch?\n", "hint": "Lihat Analysis Results → Extension Mismatch Detected. File itu ada di folder hasil/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "I**_2*******_2***.j**"}, {"n": 18, "lvl": "Menengah", "title": "Varian domain", "tahap": "Tahap 7 · Pencarian dan identifikasi file", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Substring Match</strong> dengan kata <code>samlognus</code> (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li><li>Buka beberapa hasil dan catat domain lengkap yang muncul.</li></ol>", "ask": "<p>Apa domain palsu (tanpa subdomain) yang meniru domain SLN?</p>", "text": "varian domain langkah:\n1. jalankan keyword search substring match dengan kata samlognus (p7).\n2. buka beberapa hasil dan catat domain lengkap yang muncul.\n\npertanyaan: apa domain palsu (tanpa subdomain) yang meniru domain sln?\n", "hint": "Domain asli SLN ada di skenario. Domain palsu menambahkan satu kata di belakang nama perusahaan.", "mandiri": false, "isian": "Jawaban singkat", "mask": "s********-w******.c**"}, {"n": 19, "lvl": "Menengah", "title": "Email operator", "tahap": "Tahap 7 · Pencarian dan identifikasi file", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Keyword Hits → Email Addresses</strong>. Cara lain: jalankan Keyword Search <em>Exact Match</em> untuk alamat email dari Soal 5.</li></ol>", "ask": "<p>Dokumen pribadi mana yang juga memuat alamat email operator kit?</p>", "text": "email operator langkah:\n1. buka analysis results → keyword hits → email addresses. cara lain: jalankan keyword search exact match untuk alamat email dari soal 5.\n\npertanyaan: dokumen pribadi mana yang juga memuat alamat email operator kit?\n", "hint": "Selain file di kit/, ada satu hit di folder pribadi/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**_R****_S******.d***"}, {"n": 20, "lvl": "Menengah", "title": "Hash set known-bad", "tahap": "Tahap 7 · Pencarian dan identifikasi file", "label": "Langkah", "steps": "<ol><li>Pastikan hash set sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>) dan modul Hash Lookup sudah selesai.</li><li>Buka <strong>Analysis Results → Hashset Hits → KABUT_known_bad</strong>.</li></ol>", "ask": "<p>Berapa file aktif (di luar isi ZIP) yang cocok dengan hash set KABUT_known_bad?</p>", "text": "hash set known-bad langkah:\n1. pastikan hash set sudah diimpor (p3) dan modul hash lookup sudah selesai.\n2. buka analysis results → hashset hits → kabut_known_bad.\n\npertanyaan: berapa file aktif (di luar isi zip) yang cocok dengan hash set kabut_known_bad?\n", "hint": "Hitung hit di Hashset Hits yang berasal dari folder kit/ dan tools/, tanpa salinan hasil ekstraksi ZIP.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 21, "lvl": "Menengah", "title": "File duplikat", "tahap": "Tahap 7 · Pencarian dan identifikasi file", "label": "Langkah", "steps": "<ol><li>Buka folder <code>ss/</code> dan <code>ss/backup/</code>, lalu catat MD5 setiap screenshot.</li><li>Untuk memastikan, cari salah satu MD5 itu lewat <strong>Tools → File Search by Attributes</strong> (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li></ol>", "ask": "<p>Apa MD5 dua screenshot yang identik?</p>", "text": "file duplikat langkah:\n1. buka folder ss/ dan ss/backup/, lalu catat md5 setiap screenshot.\n2. untuk memastikan, cari salah satu md5 itu lewat tools → file search by attributes (p8).\n\npertanyaan: apa md5 dua screenshot yang identik?\n", "hint": "Salinan biasanya punya nama mirip dengan tambahan \" (1)\" di folder backup.", "mandiri": false, "isian": "Jawaban singkat", "mask": "3fafd6**************************"}, {"n": 22, "lvl": "Sulit", "title": "Gambar hasil carving", "tahap": "Tahap 8 · Carving dan unallocated space", "label": "Langkah", "steps": "<ol><li>Pastikan PhotoRec Carver sudah dijalankan, lalu buka folder <strong><code>$CarvedFiles</code></strong> di bawah volume (<a class=\"pref\" href=\"#panduan-p10\" data-p=\"P10\">P10</a>).</li><li>Buka setiap gambar dengan tab <strong>Application</strong>. Abaikan gambar yang sama dengan file aktif atau deleted file yang sudah Anda lihat.</li><li>Untuk gambar yang tersisa, catat nama hasil carving dan MD5-nya.</li></ol>", "ask": "<p>Apa MD5 gambar chat yang hanya ditemukan lewat carving?</p>", "text": "gambar hasil carving langkah:\n1. pastikan photorec carver sudah dijalankan, lalu buka folder $carvedfiles di bawah volume (p10).\n2. buka setiap gambar dengan tab application. abaikan gambar yang sama dengan file aktif atau deleted file yang sudah anda lihat.\n3. untuk gambar yang tersisa, catat nama hasil carving dan md5-nya.\n\npertanyaan: apa md5 gambar chat yang hanya ditemukan lewat carving?\n", "hint": "Di $CarvedFiles, cari screenshot percakapan chat yang tidak ada padanannya di file aktif maupun deleted file.", "mandiri": false, "isian": "Jawaban singkat", "mask": "4bcdbe**************************"}, {"n": 23, "lvl": "Sulit", "title": "Catatan di unallocated space", "tahap": "Tahap 8 · Carving dan unallocated space", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Exact Match</strong> dengan kata <code>CATATAN BAYARAN</code> (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li><li>Buka hasilnya di tab <strong>Indexed Text</strong>. Perhatikan bahwa hasil ini berasal dari unallocated space (<code>Unalloc</code>).</li></ol>", "ask": "<p>Dari wallet apa pembayaran dalam \"CATATAN BAYARAN\" dikirim?</p>", "text": "catatan di unallocated space langkah:\n1. jalankan keyword search exact match dengan kata catatan bayaran (p7).\n2. buka hasilnya di tab indexed text. perhatikan bahwa hasil ini berasal dari unallocated space (unalloc).\n\npertanyaan: dari wallet apa pembayaran dalam \"catatan bayaran\" dikirim?\n", "hint": "Alamat wallet TRC20 selalu berawalan huruf T dan panjangnya 34 karakter.", "mandiri": false, "isian": "Jawaban singkat", "mask": "TJfRCJ****************************"}, {"n": 24, "lvl": "Sulit", "title": "Timeline", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Tools → Timeline</strong> (<a class=\"pref\" href=\"#panduan-p11\" data-p=\"P11\">P11</a>), atur rentang 2025-03-15 sampai 2025-04-10, lalu gunakan mode <em>List</em>.</li><li>Lengkapi dengan waktu dari temuan Soal 5–23 (waktu dibuat atau diubah, EXIF, dan isi log).</li></ol>", "ask": "<p>Pada tanggal berapa (YYYY-MM-DD) kit samlognus-owa dibuat menurut timestamp file?</p>", "text": "timeline langkah:\n1. buka tools → timeline (p11), atur rentang 2025-03-15 sampai 2025-04-10, lalu gunakan mode list.\n2. lengkapi dengan waktu dari temuan soal 5–23 (waktu dibuat atau diubah, exif, dan isi log).\n\npertanyaan: pada tanggal berapa (yyyy-mm-dd) kit samlognus-owa dibuat menurut timestamp file?\n", "hint": "Lihat waktu Created file di kit/samlognus-owa/ lewat Timeline atau tab File Metadata.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-**"}, {"n": 25, "lvl": "Sulit", "title": "Atribusi", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Kumpulkan temuan yang menyebut nama Rendi atau alias r3ndyx (Soal 5, 10, 11, 12, 17, dan 19).</li></ol>", "ask": "<p>Siapa pemilik flashdisk menurut artefak identitas di dalamnya?</p>", "text": "atribusi langkah:\n1. kumpulkan temuan yang menyebut nama rendi atau alias r3ndyx (soal 5, 10, 11, 12, 17, dan 19).\n\npertanyaan: siapa pemilik flashdisk menurut artefak identitas di dalamnya?\n\n---\n", "hint": "Lihat CV dan foto KTP di folder pribadi/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "R**** S******"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "<p>Tambahkan data source baru ke case yang sama: <strong>Add Data Source</strong> → <code><span class=\"evd\">EVD-02</span>.dd</code> (laptop korban Dewi), dengan time zone Asia/Jakarta. Untuk ingest, cukup centang <strong>Recent Activity</strong>.</p>", "items": [{"n": 26, "lvl": "Sulit", "title": "Apakah flashdisk ini pernah dicolokkan ke laptop korban?", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Di EVD-01, catat nama dan waktu dibuat file PDF di root (Soal 4).</li><li>Di EVD-02, buka <strong>Data Artifacts → USB Device Attached</strong>. Catat merek flashdisk dan waktu pemasangannya.</li><li>Di EVD-02, buka <strong>Data Artifacts → Recent Documents</strong>. Cari shortcut yang menunjuk ke drive <strong>E:</strong>.</li><li>Bandingkan dengan kalimat dalam gambar hasil carving (Soal 22).</li></ol>", "ask": "<p>Apa label flashdisk yang tercantum di nama shortcut drive E: di EVD-02?</p>", "text": "apakah flashdisk ini pernah dicolokkan ke laptop korban? langkah:\n1. di evd-01, catat nama dan waktu dibuat file pdf di root (soal 4).\n2. di evd-02, buka data artifacts → usb device attached. catat merek flashdisk dan waktu pemasangannya.\n3. di evd-02, buka data artifacts → recent documents. cari shortcut yang menunjuk ke drive e:.\n4. bandingkan dengan kalimat dalam gambar hasil carving (soal 22).\n\npertanyaan: apa label flashdisk yang tercantum di nama shortcut drive e: di evd-02?\n", "hint": "Di Recent Documents EVD-02, shortcut untuk drive diberi nama berformat \"LABEL (E)\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "R******"}, {"n": 27, "lvl": "Sulit", "title": "Kredensial Dewi: dari laptop korban ke log pelaku", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Di EVD-01, catat jam tercatatnya kredensial Dewi pada log terhapus (Soal 15).</li><li>Di EVD-02, buka <strong>Data Artifacts → Web History</strong>. Urutkan berdasarkan tanggal, lalu cari kunjungan ke domain phishing (Soal 6) pada 8 April 2025.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) Dewi mengirim formulir logon.php menurut Web History EVD-02?</p>", "text": "kredensial dewi: dari laptop korban ke log pelaku langkah:\n1. di evd-01, catat jam tercatatnya kredensial dewi pada log terhapus (soal 15).\n2. di evd-02, buka data artifacts → web history. urutkan berdasarkan tanggal, lalu cari kunjungan ke domain phishing (soal 6) pada 8 april 2025.\n\npertanyaan: pukul berapa (hh:mm:ss) dewi mengirim formulir logon.php menurut web history evd-02?\n\n---\n", "hint": "Cari kunjungan ke domain phishing pada 2025-04-08 dengan URL berakhiran logon.php.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}]}], "penutup": "<p>Buat laporan HTML dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Apa yang terbukti</strong> dari EVD-01. Sebutkan artefak dan path-nya.</li><li><strong>Apa yang tidak terbukti</strong> atau belum dapat disimpulkan.</li><li><strong>Keterbatasan</strong> pemeriksaan, misalnya: FAT tidak mencatat kapan file dihapus, file hasil carving tidak punya nama dan waktu asli, dan flashdisk dapat dipakai lebih dari satu orang.</li></ul>", "scen_title": "EVD-01 — Flashdisk Pelaku Phishing", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP — LP/B/117/IV/2025/SIBER/PDNR (fiktif)<br><strong>Barang bukti:</strong> 1 (satu) flashdisk SanDisk Cruzer Blade 64 GB, label tulisan tangan \"R\", disita dari kamar kos tersangka <strong>Rendi Saputra</strong> (alias <em>r3ndyx</em>) di Semarang pada 24 April 2025 pukul 07.10 WIB.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-01</span>.dd</code> (raw, 64 MiB; replika diperkecil untuk pelatihan)<br><strong>Zona waktu:</strong> WIB (UTC+7). FAT menyimpan waktu lokal, jadi <strong>atur time zone data source ke Asia/Jakarta (GMT+7)</strong> saat <em>Add Data Source</em>.</p><h4 class=\"mdh\">Latar belakang</h4><p>Pada 8 April 2025 sejumlah karyawan PT Samudra Logistik Nusantara (SLN, <code>samlognus.co.id</code>) (kantor pusat: Jl. Pelabuhan Raya No. 88, Tanjung Mas, Semarang) menerima email \"[PENTING] Pembaruan Kata Sandi Email Kantor\" yang mengarah ke halaman login palsu di <code>mail.samlognus-webmail.com</code> (IP 198.51.100.23). Seminggu kemudian staf keuangan SLN, Dewi Anggraini, menjadi korban <em>Business Email Compromise</em> (lihat EVD-02).</p><p>Penyidik menduga Rendi membuat dan mengoperasikan kit phishing tersebut, lalu menyerahkan kredensial hasil panen kepada pihak bernama <strong>kabut_admin</strong>. Di BAP, Rendi menyatakan flashdisk itu \"hanya berisi tugas kuliah dan pekerjaan freelance\".</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Pastikan apakah flashdisk berisi kit phishing, template email, daftar target, dan hasil panen kredensial.</li><li>Pulihkan file yang dihapus tersangka.</li><li>Hubungkan isi flashdisk dengan tersangka (atribusi) dan dengan pihak lain (kabut_admin).</li><li>Periksa apakah ada petunjuk bahwa flashdisk ini pernah dicolokkan ke laptop korban (EVD-02).</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Pisahkan fakta (artefak dan path) dari dugaan. Sebut keterbatasan FAT, carving, dan kepemilikan flashdisk."}, {"id": "EVD-02", "title": "EVD-02 — Lembar Kerja (Laptop Korban BEC)", "short": "Laptop Korban BEC", "exam": false, "intro": "", "sections": [{"n": "1", "name": "Pemeriksaan EVD-02", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-02</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-02</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-02.dd.\n\npertanyaan: berapa md5 image evd-02.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "48e823**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-02</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone <strong>Asia/Jakarta</strong>.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Recent Activity, Email Parser, Embedded File Extractor, File Type Identification, Extension Mismatch Detector, Keyword Search, Hash Lookup, Interesting Files</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-02.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): recent activity, email parser, embedded file extractor, file type identification, extension mismatch detector, keyword search, hash lookup, interesting files.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Struktur disk", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-02</span>.dd</code> di pohon kiri dan perhatikan daftar volume.</li></ol>", "ask": "<p>File system apa yang dipakai partisi yang berisi Windows?</p>", "text": "struktur disk langkah:\n1. klik evd-02.dd di pohon kiri dan perhatikan daftar volume.\n\npertanyaan: file system apa yang dipakai partisi yang berisi windows?\n", "hint": "Ada partisi kecil dan partisi besar. Folder Windows dan Users hanya ada di salah satunya.", "mandiri": false, "isian": "Jawaban singkat", "mask": "N***"}, {"n": 4, "lvl": "Dasar", "title": "Identitas komputer", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Operating System Information</strong> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li></ol>", "ask": "<p>Apa computer name laptop ini?</p>", "text": "identitas komputer langkah:\n1. buka data artifacts → operating system information (p9).\n\npertanyaan: apa computer name laptop ini?\n", "hint": "Lihat Data Artifacts → Operating System Information.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**-**-F****"}, {"n": 5, "lvl": "Dasar", "title": "Akun pengguna", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>OS Accounts</strong> di pohon kiri, lalu bandingkan dengan isi folder <code>Users/</code>.</li></ol>", "ask": "<p>Apa SID akun dewi.anggraini?</p>", "text": "akun pengguna langkah:\n1. buka os accounts di pohon kiri, lalu bandingkan dengan isi folder users/.\n\npertanyaan: apa sid akun dewi.anggraini?\n", "hint": "Lihat OS Accounts. SID diawali S-1-5-21- dan diakhiri empat digit.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*-*-*-**-34********-18********-27********-1***"}, {"n": 6, "lvl": "Dasar", "title": "Kotak email Dewi", "tahap": "Tahap 4 · Penelusuran email", "label": "Langkah", "steps": "<ol><li>Buka folder <code>Users/dewi.anggraini/Documents/Email/</code>.</li></ol>", "ask": "<p>Berapa jumlah file .eml di folder Email milik Dewi?</p>", "text": "kotak email dewi langkah:\n1. buka folder users/dewi.anggraini/documents/email/.\n\npertanyaan: berapa jumlah file .eml di folder email milik dewi?\n", "hint": "Hitung file berakhiran .eml di Users/dewi.anggraini/Documents/Email/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 7, "lvl": "Dasar", "title": "Email perubahan rekening", "tahap": "Tahap 4 · Penelusuran email", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → E-Mail Messages</strong>, lalu cari email berjudul \"RE: Invoice INV/BPS/2025/0412 - Perubahan Rekening\".</li><li>Atau buka file <code>.eml</code>-nya dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Ke alamat apa balasan email BEC diarahkan (Reply-To)?</p>", "text": "email perubahan rekening langkah:\n1. buka data artifacts → e-mail messages, lalu cari email berjudul \"re: invoice inv/bps/2025/0412 - perubahan rekening\".\n2. atau buka file .eml-nya dengan tab text.\n\npertanyaan: ke alamat apa balasan email bec diarahkan (reply-to)?\n", "hint": "Bandingkan header From dengan header Reply-To. Salah satunya webmail gratis.", "mandiri": false, "isian": "Jawaban singkat", "mask": "b**.f******.d***@k********.n**"}, {"n": 8, "lvl": "Dasar", "title": "Lampiran email", "tahap": "Tahap 4 · Penelusuran email", "label": "Langkah", "steps": "<ol><li>Pada email Soal 7, lihat tab <strong>Attachments</strong>, atau baca bagian bawah teks <code>.eml</code>.</li></ol>", "ask": "<p>Lampiran mana yang berupa dokumen Word yang dapat berisi makro?</p>", "text": "lampiran email langkah:\n1. pada email soal 7, lihat tab attachments, atau baca bagian bawah teks .eml.\n\npertanyaan: lampiran mana yang berupa dokumen word yang dapat berisi makro?\n", "hint": "Ekstensi dokumen Word yang mendukung makro diakhiri huruf m.", "mandiri": false, "isian": "Jawaban singkat", "mask": "I**-B**-2***-0***.d***"}, {"n": 9, "lvl": "Dasar", "title": "Persetujuan pembayaran", "tahap": "Tahap 4 · Penelusuran email", "label": "Langkah", "steps": "<ol><li>Cari email e-Approval di folder Email (judulnya mengandung \"eapproval\" atau \"disetujui\").</li><li>Baca juga <code>01_jadwal_tutup_buku.eml</code>.</li></ol>", "ask": "<p>Dari terminal mana persetujuan pembayaran dilakukan menurut email e-Approval?</p>", "text": "persetujuan pembayaran langkah:\n1. cari email e-approval di folder email (judulnya mengandung \"eapproval\" atau \"disetujui\").\n2. baca juga 01_jadwal_tutup_buku.eml.\n\npertanyaan: dari terminal mana persetujuan pembayaran dilakukan menurut email e-approval?\n", "hint": "Baca 09_eapproval_disetujui.eml dan cari nama komputer.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**-F**-P***"}, {"n": 10, "lvl": "Dasar", "title": "Riwayat browser 8 April", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web History</strong>, lalu urutkan kolom <em>Date Accessed</em>.</li><li>Lihat kunjungan pada 2025-04-08 sekitar pukul 09.20.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) Dewi mengirim formulir logon.php pada 8 April 2025?</p>", "text": "riwayat browser 8 april langkah:\n1. buka data artifacts → web history, lalu urutkan kolom date accessed.\n2. lihat kunjungan pada 2025-04-08 sekitar pukul 09.20.\n\npertanyaan: pukul berapa (hh:mm:ss) dewi mengirim formulir logon.php pada 8 april 2025?\n", "hint": "Di Web History, URL formulir berakhiran /owa/auth/logon.php.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 11, "lvl": "Dasar", "title": "Download", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Downloads</strong>.</li></ol>", "ask": "<p>Ke folder apa kedua lampiran di-download pada 14 April 2025?</p>", "text": "download langkah:\n1. buka data artifacts → web downloads.\n\npertanyaan: ke folder apa kedua lampiran di-download pada 14 april 2025?\n", "hint": "Lihat kolom path tujuan di Web Downloads.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*:\\U****\\d***.a********\\D********"}, {"n": 12, "lvl": "Menengah", "title": "Pencarian Google dan domain tiruan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Search</strong> dan <strong>Web History</strong> pada 2025-04-14 pukul 09.00–09.10.</li></ol>", "ask": "<p>Domain tiruan vendor apa yang dikunjungi Dewi pada 14 April pukul 09.05?</p>", "text": "pencarian google dan domain tiruan langkah:\n1. buka data artifacts → web search dan web history pada 2025-04-14 pukul 09.00–09.10.\n\npertanyaan: domain tiruan vendor apa yang dikunjungi dewi pada 14 april pukul 09.05?\n", "hint": "Ejaannya hanya berbeda satu huruf dari nama vendor asli.", "mandiri": false, "isian": "Jawaban singkat", "mask": "baj*************.**.**"}, {"n": 13, "lvl": "Menengah", "title": "Flashdisk yang pernah dicolokkan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → USB Device Attached</strong>.</li></ol>", "ask": "<p>Merek flashdisk apa yang terhubung pada April 2025?</p>", "text": "flashdisk yang pernah dicolokkan langkah:\n1. buka data artifacts → usb device attached.\n\npertanyaan: merek flashdisk apa yang terhubung pada april 2025?\n", "hint": "Di USB Device Attached ada dua merek. Lihat tanggal masing-masing.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S******"}, {"n": 14, "lvl": "Menengah", "title": "File yang dibuka dari flashdisk", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Recent Documents</strong>, lalu cari path yang diawali <code>E:\\</code>.</li><li>Lihat juga folder <code>Users/dewi.anggraini/AppData/Roaming/Microsoft/Windows/Recent/</code>.</li></ol>", "ask": "<p>Apa label flashdisk yang tercantum di nama shortcut drive E:?</p>", "text": "file yang dibuka dari flashdisk langkah:\n1. buka data artifacts → recent documents, lalu cari path yang diawali e:\\.\n2. lihat juga folder users/dewi.anggraini/appdata/roaming/microsoft/windows/recent/.\n\npertanyaan: apa label flashdisk yang tercantum di nama shortcut drive e:?\n", "hint": "Shortcut untuk drive diberi nama berformat \"LABEL (E)\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "R******"}, {"n": 15, "lvl": "Menengah", "title": "Metadata dokumen lampiran", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik <code>Users/dewi.anggraini/Downloads/Surat_Perubahan_Rekening.pdf</code>, lalu lihat <strong>Data Artifacts → Metadata</strong> atau tab <em>Metadata</em> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li></ol>", "ask": "<p>Siapa Author PDF Surat_Perubahan_Rekening.pdf?</p>", "text": "metadata dokumen lampiran langkah:\n1. klik users/dewi.anggraini/downloads/surat_perubahan_rekening.pdf, lalu lihat data artifacts → metadata atau tab metadata (p9).\n\npertanyaan: siapa author pdf surat_perubahan_rekening.pdf?\n", "hint": "Author ini berupa alias internet, bukan nama orang atau perusahaan.", "mandiri": false, "isian": "Jawaban singkat", "mask": "r*****"}, {"n": 16, "lvl": "Menengah", "title": "Recycle Bin", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Recycle Bin</strong>.</li><li>Cara manual: buka folder <code>$Recycle.Bin/&lt;SID Dewi&gt;/</code>. File berawalan <code>$I</code> menyimpan path asli dan waktu hapus, sedangkan <code>$R</code> menyimpan isi file.</li></ol>", "ask": "<p>Berapa item di Recycle Bin milik Dewi?</p>", "text": "recycle bin langkah:\n1. buka data artifacts → recycle bin.\n2. cara manual: buka folder $recycle.bin/<sid dewi>/. file berawalan $i menyimpan path asli dan waktu hapus, sedangkan $r menyimpan isi file.\n\npertanyaan: berapa item di recycle bin milik dewi?\n", "hint": "Setiap pasangan $I/$R mewakili satu item.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 17, "lvl": "Menengah", "title": "Isi dokumen .docm", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Klik file <code>$R…docm</code> di Recycle Bin. Embedded File Extractor sudah membongkar isinya menjadi file-file di bawahnya.</li><li>Cari <code>word/vbaProject.bin</code>, lalu baca dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>IP apa yang disebut di dalam vbaProject.bin?</p>", "text": "isi dokumen .docm langkah:\n1. klik file $r…docm di recycle bin. embedded file extractor sudah membongkar isinya menjadi file-file di bawahnya.\n2. cari word/vbaproject.bin, lalu baca dengan tab text.\n\npertanyaan: ip apa yang disebut di dalam vbaproject.bin?\n", "hint": "Baca komentar di bawah baris \"Sub AutoOpen()\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "1**.**.1**.**"}, {"n": 18, "lvl": "Menengah", "title": "Bukti transfer yang dihapus", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Di Recycle Bin, buka file <code>$R…pdf</code> dengan tab <strong>Application</strong> atau <strong>Text</strong>.</li><li>Cari asal downloadnya di <strong>Web Downloads</strong> (15 April 2025 sore).</li></ol>", "ask": "<p>Ke nomor rekening berapa dana ditransfer menurut bukti transfer yang dihapus?</p>", "text": "bukti transfer yang dihapus langkah:\n1. di recycle bin, buka file $r…pdf dengan tab application atau text.\n2. cari asal downloadnya di web downloads (15 april 2025 sore).\n\npertanyaan: ke nomor rekening berapa dana ditransfer menurut bukti transfer yang dihapus?\n", "hint": "Buka file $R…pdf di Recycle Bin dan cari baris rekening tujuan.", "mandiri": false, "isian": "Jawaban singkat", "mask": "73********"}, {"n": 19, "lvl": "Menengah", "title": "Nomor rekening penampung", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Exact Match</strong> untuk nomor rekening dari Soal 18 (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li></ol>", "ask": "<p>File email (.eml) BEC mana yang memuat nomor rekening penampung?</p>", "text": "nomor rekening penampung langkah:\n1. jalankan keyword search exact match untuk nomor rekening dari soal 18 (p7).\n\npertanyaan: file email (.eml) bec mana yang memuat nomor rekening penampung?\n", "hint": "Nama file email itu memuat kata \"invoice\" dan \"rekening\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "**_**_i******_p********_r*******.e**"}, {"n": 20, "lvl": "Menengah", "title": "Asal email BEC", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Buka email Soal 7 dengan tab <strong>Text</strong>, lalu baca baris <code>Received: from …</code> di bagian header atas.</li></ol>", "ask": "<p>IP apa yang mengirim email BEC menurut header Received?</p>", "text": "asal email bec langkah:\n1. buka email soal 7 dengan tab text, lalu baca baris received: from … di bagian header atas.\n\npertanyaan: ip apa yang mengirim email bec menurut header received?\n", "hint": "IP pengirim tertulis dalam kurung siku setelah nama host.", "mandiri": false, "isian": "Jawaban singkat", "mask": "1**.**.1**.**"}, {"n": 21, "lvl": "Menengah", "title": "Lampiran = file di Recycle Bin?", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Catat MD5 lampiran <code>.docm</code> pada email (hasil Email Parser atau Embedded File Extractor).</li><li>Catat MD5 file <code>$R…docm</code> di Recycle Bin, lalu bandingkan lewat <strong>File Search by Attributes</strong> (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li><li>Lihat juga <strong>Analysis Results → Hashset Hits</strong>.</li></ol>", "ask": "<p>Apa MD5 file $RK7Q2MX.docm di Recycle Bin?</p>", "text": "lampiran = file di recycle bin? langkah:\n1. catat md5 lampiran .docm pada email (hasil email parser atau embedded file extractor).\n2. catat md5 file $r…docm di recycle bin, lalu bandingkan lewat file search by attributes (p8).\n3. lihat juga analysis results → hashset hits.\n\npertanyaan: apa md5 file $rk7q2mx.docm di recycle bin?\n", "hint": "Lihat tab File Metadata atau kolom MD5 Hash.", "mandiri": false, "isian": "Jawaban singkat", "mask": "881527**************************"}, {"n": 22, "lvl": "Menengah", "title": "Tanda \"diunduh dari Internet\"", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Di folder <code>Downloads/</code> dan <code>$Recycle.Bin/&lt;SID Dewi&gt;/</code>, cari file yang namanya diakhiri <code>:Zone.Identifier</code>.</li><li>Buka dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Berapa nilai ZoneId di Zone.Identifier file yang di-download?</p>", "text": "tanda \"diunduh dari internet\" langkah:\n1. di folder downloads/ dan $recycle.bin/<sid dewi>/, cari file yang namanya diakhiri :zone.identifier.\n2. buka dengan tab text.\n\npertanyaan: berapa nilai zoneid di zone.identifier file yang di-download?\n", "hint": "Isi Zone.Identifier hanya beberapa baris, dan ZoneId ada di baris kedua.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 23, "lvl": "Sulit", "title": "Catatan yang dihapus permanen", "tahap": "Tahap 8 · Unallocated space", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Exact Match</strong> untuk <code>KRONOLOGI</code> (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li><li>Buka hasil yang berasal dari unallocated space (<code>Unalloc</code>) dengan tab <strong>Indexed Text</strong>.</li></ol>", "ask": "<p>Apa judul catatan yang ditemukan di unallocated space?</p>", "text": "catatan yang dihapus permanen langkah:\n1. jalankan keyword search exact match untuk kronologi (p7).\n2. buka hasil yang berasal dari unallocated space (unalloc) dengan tab indexed text.\n\npertanyaan: apa judul catatan yang ditemukan di unallocated space?\n", "hint": "Judulnya adalah kat
