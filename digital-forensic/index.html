ngkah:\n1. bandingkan isi temuan soal 21 dengan nama file di soal 17, lalu lihat waktunya di timeline (p11) pada 12 mei 2025 malam.\n\npertanyaan: pukul berapa (hh:mm) file asli seed phrase di-wipe pada 12 mei?\n", "hint": "Lihat Timeline pada 12 Mei malam.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**"}, {"n": 23, "lvl": "Sulit", "title": "Alur dana", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Kumpulkan temuan Soal 8, 12–16, dan 19.</li></ol>", "ask": "<p>Berapa USDT bagian 30% yang ditarik Yoga menjadi rupiah?</p>", "text": "alur dana langkah:\n1. kumpulkan temuan soal 8, 12–16, dan 19.\n\npertanyaan: berapa usdt bagian 30% yang ditarik yoga menjadi rupiah?\n", "hint": "Hitung 30% dari 1.500 USDT.", "mandiri": false, "isian": "Jawaban singkat", "mask": "4**"}, {"n": 24, "lvl": "Sulit", "title": "Atribusi \"datakingid\"", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Kumpulkan artefak yang menghubungkan akun forum, wallet, dan identitas pemilik laptop.</li></ol>", "ask": "<p>Atas nama siapa rekening penarikan yang paling kuat mengaitkan laptop dengan identitas pemiliknya?</p>", "text": "atribusi \"datakingid\" langkah:\n1. kumpulkan artefak yang menghubungkan akun forum, wallet, dan identitas pemilik laptop.\n\npertanyaan: atas nama siapa rekening penarikan yang paling kuat mengaitkan laptop dengan identitas pemiliknya?\n\n---\n", "hint": "Lihat baris penarikan di CSV transaksi.", "mandiri": false, "isian": "Jawaban singkat", "mask": "Y*** P******"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 25, "lvl": "Sulit", "title": "Asal combolist akun SLN", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Di EVD-06, jalankan Keyword Search <strong>Substring Match</strong> dengan kata <code>samlognus.co.id</code>, lalu catat akun dan password di file combolist.</li><li>Tambahkan <code><span class=\"evd\">EVD-01</span>.dd</code> (flashdisk pelaku phishing) ke case yang sama.</li><li>Di EVD-01, buka log terhapus <code>hasil/_og_0408.txt</code> dan <code>hasil/kirim_ke_kabut.txt</code>.</li></ol>", "ask": "<p>Apa password akun dewi.anggraini di combolist?</p>", "text": "asal combolist akun sln langkah:\n1. di evd-06, jalankan keyword search substring match dengan kata samlognus.co.id, lalu catat akun dan password di file combolist.\n2. tambahkan evd-01.dd (flashdisk pelaku phishing) ke case yang sama.\n3. di evd-01, buka log terhapus hasil/_og_0408.txt dan hasil/kirim_ke_kabut.txt.\n\npertanyaan: apa password akun dewi.anggraini di combolist?\n", "hint": "Cari samlognus.co.id di file combolist.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A****@i******"}, {"n": 26, "lvl": "Sulit", "title": "Data pelanggan yang sama", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat MD5 <code>dagangan/SLN_logistik_semarang_2025/data_pelanggan_SLN_2025.csv</code> dan <code>Downloads/SLN_arsip_0502.7z</code>.</li><li>Tambahkan <code><span class=\"evd\">EVD-05</span>.dd</code> (laptop orang dalam, Bagus) ke case yang sama, dengan modul <strong>Hash Lookup</strong>.</li><li>Cari kedua MD5 itu di EVD-05 dengan <strong>File Search by Attributes</strong> (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>).</li></ol>", "ask": "<p>Di folder terhapus apa CSV identik ditemukan di EVD-05?</p>", "text": "data pelanggan yang sama langkah:\n1. catat md5 dagangan/sln_logistik_semarang_2025/data_pelanggan_sln_2025.csv dan downloads/sln_arsip_0502.7z.\n2. tambahkan evd-05.dd (laptop orang dalam, bagus) ke case yang sama, dengan modul hash lookup.\n3. cari kedua md5 itu di evd-05 dengan file search by attributes (p8).\n\npertanyaan: di folder terhapus apa csv identik ditemukan di evd-05?\n\n---\n", "hint": "Cari MD5 data_pelanggan_SLN_2025.csv di EVD-05.", "mandiri": false, "isian": "Jawaban singkat", "mask": "b****_pr********"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> data apa yang diperjualbelikan, kapan, berapa harganya, alur dananya, dan kepada siapa setoran dikirim.</li><li><strong>Tidak terbukti:</strong> misalnya identitas pembeli \"buyer_jkt\", dan identitas asli \"Pak H\" yang hanya berupa nama tampilan.</li><li><strong>Keterbatasan:</strong> misalnya wallet dan exchange yang perlu dikonfirmasi ke penyedia resmi, dan file yang di-wipe.</li></ul>", "scen_title": "EVD-06 — Laptop Penjual Data", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP (fiktif)<br><strong>Barang bukti:</strong> laptop pribadi <strong>YOGA-PC</strong> (Windows 10 Home) milik <strong>Yoga Pratama</strong>, yang diduga beralias <strong>datakingid</strong> di forum <code>pasarbocor.cc</code>. Disita dari rumah kontrakan di Surabaya pada 1 Juli 2025 pukul 06.00 WIB.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-06</span>.dd</code> (raw, 80 MiB, <strong>NTFS tanpa partition table</strong>, hasil akuisisi logical volume C:). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>Patroli siber menemukan thread \"[JUAL] DB pelanggan perusahaan logistik Semarang 2025 + VPN\" oleh datakingid pada 10 Mei 2025. Sampel data cocok dengan data pelanggan PT Samudra Logistik Nusantara. Penyidik menduga Yoga hanyalah \"penjual\". Data berasal dari orang dalam (EVD-05), dan sebagian hasil penjualan disetor ke sindikat (EVD-10).</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Data apa saja yang diperjualbelikan, dan dari mana asalnya?</li><li>Siapa pihak yang terlibat (penyedia data, pembeli, penerima setoran)?</li><li>Alur uang kripto: wallet, nominal, dan konversi ke rupiah.</li><li>Apa yang disembunyikan atau dihapus oleh tersangka?</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Sebut data, waktu, harga, alur dana, dan yang belum terbukti (identitas pembeli dan \"Pak H\")."}, {"id": "EVD-07", "title": "EVD-07 — Lembar Kerja (Backup Ponsel Penipuan Investasi)", "short": "Backup Ponsel Penipuan Investasi", "exam": false, "intro": "<aside class=\"note\"><p>Di bawah ini <strong>BK</strong> berarti folder <code>/Backup_Redmi_2025-07-10/</code>.</p></aside>", "sections": [{"n": "1", "name": "Pemeriksaan EVD-07", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-07</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-07</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-07.dd.\n\npertanyaan: berapa md5 image evd-07.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "8322a7**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-07</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Android Analyzer, EXIF Parser, Keyword Search, File Type Identification, Hash Lookup, PhotoRec Carver, Interesting Files</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-07.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): android analyzer, exif parser, keyword search, file type identification, hash lookup, photorec carver, interesting files.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Jenis media", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-07</span>.dd</code>. Perhatikan apakah ada daftar partisi, lalu lihat jenis file system-nya.</li></ol>", "ask": "<p>File system apa yang dipakai image ini?</p>", "text": "jenis media langkah:\n1. klik evd-07.dd. perhatikan apakah ada daftar partisi, lalu lihat jenis file system-nya.\n\npertanyaan: file system apa yang dipakai image ini?\n", "hint": "Image tanpa partition table, langsung berisi folder backup.", "mandiri": false, "isian": "Jawaban singkat", "mask": "F****"}, {"n": 4, "lvl": "Dasar", "title": "Keterangan backup", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <code>BK/backup_info.txt</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Siapa pemilik ponsel menurut backup_info.txt?</p>", "text": "keterangan backup langkah:\n1. buka bk/backup_info.txt dengan tab text.\n\npertanyaan: siapa pemilik ponsel menurut backup_info.txt?\n", "hint": "Cari baris Owner.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A*****"}, {"n": 5, "lvl": "Dasar", "title": "Ekspor chat WhatsApp", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>BK/sdcard/WhatsApp/Exported/</code>.</li></ol>", "ask": "<p>Berapa jumlah file ekspor chat WhatsApp yang masih aktif?</p>", "text": "ekspor chat whatsapp langkah:\n1. buka bk/sdcard/whatsapp/exported/.\n\npertanyaan: berapa jumlah file ekspor chat whatsapp yang masih aktif?\n", "hint": "Hitung file \"WhatsApp Chat with …\" yang tidak bertanda terhapus.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 6, "lvl": "Dasar", "title": "Nama samaran pemilik ponsel", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka chat dengan Ibu Ratna Sari dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Nama tampilan apa yang dipakai pemilik ponsel saat berbicara dengan korban?</p>", "text": "nama samaran pemilik ponsel langkah:\n1. buka chat dengan ibu ratna sari dengan tab text.\n\npertanyaan: nama tampilan apa yang dipakai pemilik ponsel saat berbicara dengan korban?\n", "hint": "Lihat nama pengirim pesan yang bukan korban.", "mandiri": false, "isian": "Jawaban singkat", "mask": "R*** ** C*****"}, {"n": 7, "lvl": "Dasar", "title": "Naskah CS", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>BK/sdcard/Documents/naskah_cs_v3.txt</code>.</li></ol>", "ask": "<p>Alasan apa yang dipakai menurut naskah saat korban ingin menarik dana?</p>", "text": "naskah cs langkah:\n1. buka bk/sdcard/documents/naskah_cs_v3.txt.\n\npertanyaan: alasan apa yang dipakai menurut naskah saat korban ingin menarik dana?\n", "hint": "Lihat tahap keempat di naskah_cs_v3.txt.", "mandiri": false, "isian": "Jawaban singkat", "mask": "p****"}, {"n": 8, "lvl": "Dasar", "title": "Daftar rekening", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Klik <code>BK/sdcard/Documents/rekening_aktif.xlsx</code>, lalu buka dengan tab <strong>Application</strong>. Bisa juga diekstrak dan dibuka di Excel.</li></ol>", "ask": "<p>Rekening mana di rekening_aktif.xlsx yang dicatat \"dipakai juga tagihan logistik (Pak H)\"?</p>", "text": "daftar rekening langkah:\n1. klik bk/sdcard/documents/rekening_aktif.xlsx, lalu buka dengan tab application. bisa juga diekstrak dan dibuka di excel.\n\npertanyaan: rekening mana di rekening_aktif.xlsx yang dicatat \"dipakai juga tagihan logistik (pak h)\"?\n", "hint": "Baca kolom catatan di setiap baris.", "mandiri": false, "isian": "Jawaban singkat", "mask": "73********"}, {"n": 9, "lvl": "Dasar", "title": "Screenshot bukti transfer", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>BK/sdcard/Pictures/Screenshots/</code> dan lihat setiap screenshot WhatsApp dengan tab <strong>Application</strong>.</li></ol>", "ask": "<p>Berapa jumlah screenshot bukti transfer dari korban yang masih aktif?</p>", "text": "screenshot bukti transfer langkah:\n1. buka bk/sdcard/pictures/screenshots/ dan lihat setiap screenshot whatsapp dengan tab application.\n\npertanyaan: berapa jumlah screenshot bukti transfer dari korban yang masih aktif?\n", "hint": "Hitung screenshot com.whatsapp yang tidak terhapus.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 10, "lvl": "Dasar", "title": "Catatan setoran", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>BK/sdcard/Documents/catatan_setoran.txt</code>.</li></ol>", "ask": "<p>Berapa total USDT yang disetor ke pool menurut catatan_setoran.txt?</p>", "text": "catatan setoran langkah:\n1. buka bk/sdcard/documents/catatan_setoran.txt.\n\npertanyaan: berapa total usdt yang disetor ke pool menurut catatan_setoran.txt?\n", "hint": "Jumlahkan semua baris setoran.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*.5**"}, {"n": 11, "lvl": "Dasar", "title": "SMS notifikasi bank", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Messages</strong> (hasil Android Analyzer).</li><li>Bila kosong, klik <code>BK/data/data/com.android.providers.telephony/databases/mmssms.db</code>, buka tab <strong>Application</strong>, lalu pilih tabel <code>sms</code>.</li></ol>", "ask": "<p>Berapa nominal dana masuk dari LUSIANA menurut SMS BPRMekar?</p>", "text": "sms notifikasi bank langkah:\n1. buka data artifacts → messages (hasil android analyzer).\n2. bila kosong, klik bk/data/data/com.android.providers.telephony/databases/mmssms.db, buka tab application, lalu pilih tabel sms.\n\npertanyaan: berapa nominal dana masuk dari lusiana menurut sms bprmekar?\n", "hint": "Cari SMS dari BPRMekar di tabel sms.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**.0**.0**"}, {"n": 12, "lvl": "Menengah", "title": "Kontak dan panggilan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Contacts</strong> dan <strong>Call Logs</strong>.</li><li>Bila kosong, buka <code>BK/data/data/com.android.providers.contacts/databases/contacts2.db</code> dengan tab <strong>Application</strong>.</li></ol>", "ask": "<p>Kapan (YYYY-MM-DD HH:MM) panggilan dengan kontak \"Fajar Kabut\" terjadi?</p>", "text": "kontak dan panggilan langkah:\n1. buka data artifacts → contacts dan call logs.\n2. bila kosong, buka bk/data/data/com.android.providers.contacts/databases/contacts2.db dengan tab application.\n\npertanyaan: kapan (yyyy-mm-dd hh:mm) panggilan dengan kontak \"fajar kabut\" terjadi?\n", "hint": "Lihat Call Logs dan cari nama itu.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-** **:**"}, {"n": 13, "lvl": "Menengah", "title": "Lokasi foto", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → EXIF Metadata</strong> dan <strong>Tools → Geolocation</strong>.</li><li>Cari <code>BK/sdcard/DCIM/Camera/IMG_20250603_104455.jpg</code> dan <code>IMG_20250610_090212.jpg</code>.</li></ol>", "ask": "<p>Di koordinat mana (lat, long) foto \"papan nama ruko\" diambil?</p>", "text": "lokasi foto langkah:\n1. buka data artifacts → exif metadata dan tools → geolocation.\n2. cari bk/sdcard/dcim/camera/img_20250603_104455.jpg dan img_20250610_090212.jpg.\n\npertanyaan: di koordinat mana (lat, long) foto \"papan nama ruko\" diambil?\n", "hint": "Lihat EXIF IMG_20250610_090212.jpg.", "mandiri": false, "isian": "Jawaban singkat", "mask": "-*.9***, 1**.4***"}, {"n": 14, "lvl": "Menengah", "title": "Voice note", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka folder <code>BK/sdcard/Recordings/VoiceNote/</code>.</li><li>Klik setiap file <code>.wav</code> dan buka tab <strong>Text</strong>. Komentar atau transkrip tersimpan sebagai teks di bagian awal file.</li></ol>", "ask": "<p>Voice note mana yang dihapus?</p>", "text": "voice note langkah:\n1. buka folder bk/sdcard/recordings/voicenote/.\n2. klik setiap file .wav dan buka tab text. komentar atau transkrip tersimpan sebagai teks di bagian awal file.\n\npertanyaan: voice note mana yang dihapus?\n", "hint": "Bandingkan isi folder VoiceNote dengan Deleted Files.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**_2*******_0*****.w**"}, {"n": 15, "lvl": "Menengah", "title": "Instruksi dari \"Pak H\"", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Baca <code>WhatsApp Chat with Pak H.txt</code>.</li></ol>", "ask": "<p>Ke wallet mana hasil penipuan dikirim menurut chat Pak H?</p>", "text": "instruksi dari \"pak h\" langkah:\n1. baca whatsapp chat with pak h.txt.\n\npertanyaan: ke wallet mana hasil penipuan dikirim menurut chat pak h?\n", "hint": "Cari alamat berawalan T di chat Pak H.", "mandiri": false, "isian": "Jawaban singkat", "mask": "TJfRCJ****************************"}, {"n": 16, "lvl": "Menengah", "title": "Peran Dimas Aryo", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Baca <code>WhatsApp Chat with Dimas Aryo.txt</code>.</li></ol>", "ask": "<p>Berapa fee joki rekening Dimas Aryo?</p>", "text": "peran dimas aryo langkah:\n1. baca whatsapp chat with dimas aryo.txt.\n\npertanyaan: berapa fee joki rekening dimas aryo?\n", "hint": "Baca chat dengan Dimas.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*.0**.0**"}, {"n": 17, "lvl": "Menengah", "title": "Daftar deleted file", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files</strong> (<a class=\"pref\" href=\"#panduan-p6\" data-p=\"P6\">P6</a>).</li></ol>", "ask": "<p>Berapa jumlah deleted file di backup ini?</p>", "text": "daftar deleted file langkah:\n1. buka views → deleted files (p6).\n\npertanyaan: berapa jumlah deleted file di backup ini?\n", "hint": "Lihat Views → Deleted Files.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 18, "lvl": "Menengah", "title": "Chat korban yang dihapus", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Klik <code>WhatsApp Chat with Mbak Lusiana.txt</code> (terhapus), lalu baca dengan tab <strong>Text</strong>.</li><li>Bandingkan dengan screenshot terhapus dan SMS di Soal 11.</li></ol>", "ask": "<p>Ke nomor rekening berapa Lusiana mentransfer dana?</p>", "text": "chat korban yang dihapus langkah:\n1. klik whatsapp chat with mbak lusiana.txt (terhapus), lalu baca dengan tab text.\n2. bandingkan dengan screenshot terhapus dan sms di soal 11.\n\npertanyaan: ke nomor rekening berapa lusiana mentransfer dana?\n", "hint": "Baca chat Lusiana yang dipulihkan.", "mandiri": false, "isian": "Jawaban singkat", "mask": "22********"}, {"n": 19, "lvl": "Menengah", "title": "Catatan rekening lama", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Klik <code>BK/sdcard/Documents/rekening_lama.txt</code> (terhapus), lalu baca dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Berapa nominal \"BEC logistik\" yang ditulis di rekening_lama.txt?</p>", "text": "catatan rekening lama langkah:\n1. klik bk/sdcard/documents/rekening_lama.txt (terhapus), lalu baca dengan tab text.\n\npertanyaan: berapa nominal \"bec logistik\" yang ditulis di rekening_lama.txt?\n", "hint": "Baca baris yang memuat kata BEC.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*,4***"}, {"n": 20, "lvl": "Menengah", "title": "Satu rekening, dua kejahatan", "tahap": "Tahap 7 · Pencarian", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Exact Match</strong> untuk <code>7310448201</code> (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li></ol>", "ask": "<p>File terhapus mana yang menyebut rekening 7310448201 dipakai untuk BEC?</p>", "text": "satu rekening, dua kejahatan langkah:\n1. jalankan keyword search exact match untuk 7310448201 (p7).\n\npertanyaan: file terhapus mana yang menyebut rekening 7310448201 dipakai untuk bec?\n", "hint": "Lihat hasil Keyword Search yang berasal dari deleted file.", "mandiri": false, "isian": "Jawaban singkat", "mask": "r*******_l***.t**"}, {"n": 21, "lvl": "Menengah", "title": "Hash set known-bad", "tahap": "Tahap 7 · Pencarian", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Hashset Hits</strong>.</li></ol>", "ask": "<p>Berapa jumlah hit hash set di backup ini?</p>", "text": "hash set known-bad langkah:\n1. buka analysis results → hashset hits.\n\npertanyaan: berapa jumlah hit hash set di backup ini?\n", "hint": "Buka Analysis Results → Hashset Hits.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 22, "lvl": "Sulit", "title": "Foto yang hanya tersisa di unallocated space", "tahap": "Tahap 8 · Carving", "label": "Langkah", "steps": "<ol><li>Buka folder <strong><code>$CarvedFiles</code></strong> (<a class=\"pref\" href=\"#panduan-p10\" data-p=\"P10\">P10</a>).</li><li>Buka setiap gambar dengan tab <strong>Application</strong>. Abaikan gambar yang sama dengan file aktif atau deleted file.</li><li>Lihat EXIF gambar yang tersisa (tab <strong>File Metadata</strong> atau <strong>Data Artifacts → EXIF Metadata</strong>).</li></ol>", "ask": "<p>Apa MD5 foto yang hanya ditemukan lewat carving?</p>", "text": "foto yang hanya tersisa di unallocated space langkah:\n1. buka folder $carvedfiles (p10).\n2. buka setiap gambar dengan tab application. abaikan gambar yang sama dengan file aktif atau deleted file.\n3. lihat exif gambar yang tersisa (tab file metadata atau data artifacts → exif metadata).\n\npertanyaan: apa md5 foto yang hanya ditemukan lewat carving?\n", "hint": "Cari gambar di $CarvedFiles yang tidak ada padanannya di file aktif maupun deleted file.", "mandiri": false, "isian": "Jawaban singkat", "mask": "5ddf74**************************"}, {"n": 23, "lvl": "Sulit", "title": "Kronologi korban Ibu Ratna Sari", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Gabungkan chat Ratna, screenshot, dan SMS.</li></ol>", "ask": "<p>Berapa nilai \"pajak penarikan\" yang diminta dari Ibu Ratna?</p>", "text": "kronologi korban ibu ratna sari langkah:\n1. gabungkan chat ratna, screenshot, dan sms.\n\npertanyaan: berapa nilai \"pajak penarikan\" yang diminta dari ibu ratna?\n", "hint": "Lihat pesan 5 Juni di chat Ratna.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*.0**.0**"}, {"n": 24, "lvl": "Sulit", "title": "Total kerugian", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Buat tabel per korban: nominal, tanggal, rekening, dan sumber bukti (chat, screenshot, SMS).</li></ol>", "ask": "<p>Berapa total kerugian ketiga korban dalam rupiah?</p>", "text": "total kerugian langkah:\n1. buat tabel per korban: nominal, tanggal, rekening, dan sumber bukti (chat, screenshot, sms).\n\npertanyaan: berapa total kerugian ketiga korban dalam rupiah?\n", "hint": "Jumlahkan per korban. Ratna mentransfer dua kali.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**.0**.0**"}, {"n": 25, "lvl": "Sulit", "title": "Siapa \"Rina CS Cahaya\"?", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Kumpulkan artefak yang menunjukkan pemilik ponsel (Soal 4, 6, 12, 14, dan 15).</li></ol>", "ask": "<p>Siapa pemilik ponsel yang memakai persona \"Rina CS Cahaya\"?</p>", "text": "siapa \"rina cs cahaya\"? langkah:\n1. kumpulkan artefak yang menunjukkan pemilik ponsel (soal 4, 6, 12, 14, dan 15).\n\npertanyaan: siapa pemilik ponsel yang memakai persona \"rina cs cahaya\"?\n", "hint": "Gabungkan backup_info.txt dengan persona yang sama di semua chat.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A*****"}, {"n": 26, "lvl": "Sulit", "title": "Penghapusan bukti", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Bandingkan deleted file (Soal 17) dengan instruksi Pak H (Soal 15) dan voice note terakhir (Soal 14).</li></ol>", "ask": "<p>Berapa deleted file yang berhasil dipulihkan isinya?</p>", "text": "penghapusan bukti langkah:\n1. bandingkan deleted file (soal 17) dengan instruksi pak h (soal 15) dan voice note terakhir (soal 14).\n\npertanyaan: berapa deleted file yang berhasil dipulihkan isinya?\n\n---\n", "hint": "Buka isi setiap deleted file.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 27, "lvl": "Sulit", "title": "Rekening penampung BEC", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Tambahkan <code><span class=\"evd\">EVD-02</span>.dd</code> (laptop korban BEC di SLN) ke case yang sama.</li><li>Di EVD-02, buka <code>$Recycle.Bin</code>. Cari bukti transfer PDF di folder SID Dewi dan baca isinya. Cara lain: jalankan Keyword Search <code>7310448201</code> dan lihat hasil dari EVD-02.</li></ol>", "ask": "<p>Berapa nominal transfer SLN menurut bukti transfer di EVD-02?</p>", "text": "rekening penampung bec langkah:\n1. tambahkan evd-02.dd (laptop korban bec di sln) ke case yang sama.\n2. di evd-02, buka $recycle.bin. cari bukti transfer pdf di folder sid dewi dan baca isinya. cara lain: jalankan keyword search 7310448201 dan lihat hasil dari evd-02.\n\npertanyaan: berapa nominal transfer sln menurut bukti transfer di evd-02?\n", "hint": "Buka $R…pdf di Recycle Bin EVD-02.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*.4**.0**.0**"}, {"n": 28, "lvl": "Sulit", "title": "Lokasi kantor", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat koordinat foto <code>IMG_20250610_090212.jpg</code> (Soal 13).</li><li>Tambahkan <code><span class=\"evd\">EVD-10</span>.dd</code> (laptop Hartono Wijaya) ke case yang sama, dengan modul <strong>EXIF Parser</strong>.</li><li>Di EVD-10, lihat EXIF foto di <code>Users/hartono/Pictures/Kantor/</code>, dan baca alamat di <code>Documents/Perusahaan/</code>.</li></ol>", "ask": "<p>Perusahaan apa yang berkantor di koordinat foto \"papan nama ruko\"?</p>", "text": "lokasi kantor langkah:\n1. catat koordinat foto img_20250610_090212.jpg (soal 13).\n2. tambahkan evd-10.dd (laptop hartono wijaya) ke case yang sama, dengan modul exif parser.\n3. di evd-10, lihat exif foto di users/hartono/pictures/kantor/, dan baca alamat di documents/perusahaan/.\n\npertanyaan: perusahaan apa yang berkantor di koordinat foto \"papan nama ruko\"?\n\n---\n", "hint": "Bandingkan dengan foto Pictures/Kantor dan akta di EVD-10.", "mandiri": false, "isian": "Jawaban singkat", "mask": "** C***** A*** D******"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> korban, nominal, rekening, serta peran Andika dan pihak lain.</li><li><strong>Tidak terbukti:</strong> misalnya identitas \"Pak H\" yang hanya dari nama kontak, dan setoran ke wallet pool yang hanya dari catatan pribadi.</li><li><strong>Keterbatasan:</strong> misalnya backup bukan ponsel asli, voice note tiruan berupa transkrip di metadata, dan FAT yang tidak mencatat waktu hapus.</li></ul>", "scen_title": "EVD-07 — Backup Ponsel Pelaku Penipuan Online", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP (fiktif). Klaster penipuan investasi \"Cahaya X Trade\".<br><strong>Barang bukti:</strong> flashdisk OTG 64 GB berisi folder <code>Backup_Redmi_2025-07-10</code> (backup ADB ponsel Xiaomi Redmi Note 13 Pro), disita dari rumah <strong>Andika Wijaya</strong> pada 15 Juli 2025. Ponsel aslinya sudah di-<em>factory reset</em>.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-07</span>.dd</code> (raw, 72 MiB, <strong>FAT32 tanpa partition table</strong>). Zona waktu WIB. Untuk FAT, atur time zone data source ke Asia/Jakarta.</p><h4 class=\"mdh\">Latar belakang</h4><p>Tiga korban melapor tertipu \"platform trading Cahaya X Trade\" setelah dihubungi CS bernama \"Rina\" lewat WhatsApp. Nomor CS terdaftar atas nama Andika Wijaya. Pada malam 14 Juli, sehari sebelum penggeledahan kantor PT Cahaya Aset Digital (EVD-10), Andika diminta \"membersihkan HP\".</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Identifikasi korban, modus, nominal, dan rekening penampung.</li><li>Buktikan Andika memakai persona \"Rina CS Cahaya\".</li><li>Temukan hubungan dengan atasan (\"Pak H\"), joki rekening, dan alur ke wallet kripto.</li><li>Pulihkan data yang dihapus pada 14 Juli malam.</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Sebut korban, nominal, rekening, peran Andika dan pihak lain, serta apa yang hanya berdasarkan catatan pribadi."}, {"id": "EVD-08", "title": "EVD-08 — Lembar Kerja (Mesin Penyerang)", "short": "Mesin Penyerang", "exam": false, "intro": "<aside class=\"note\"><p>Di bawah ini <code>~</code> berarti folder <code>/home/fajar</code>. Pada laptop ini Autopsy menampilkan setiap partisi sebagai <strong>vol</strong> tersendiri di pohon kiri.</p></aside>", "sections": [{"n": "1", "name": "Pemeriksaan EVD-08", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-08</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-08</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-08.dd.\n\npertanyaan: berapa md5 image evd-08.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "1f08e7**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-08</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Encryption Detection, Hash Lookup, Keyword Search, File Type Identification, Extension Mismatch Detector, Interesting Files, PhotoRec Carver</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-08.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): encryption detection, hash lookup, keyword search, file type identification, extension mismatch detector, interesting files, photorec carver.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Partisi", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-08</span>.dd</code> dan perhatikan daftar volume (vol).</li><li>Buka setiap volume. Mana yang berisi folder, dan mana yang kosong?</li></ol>", "ask": "<p>Berapa jumlah partisi di image ini?</p>", "text": "partisi langkah:\n1. klik evd-08.dd dan perhatikan daftar volume (vol).\n2. buka setiap volume. mana yang berisi folder, dan mana yang kosong?\n\npertanyaan: berapa jumlah partisi di image ini?\n", "hint": "Hitung baris volume, tanpa menghitung partition table dan Unallocated.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 4, "lvl": "Dasar", "title": "Identitas sistem", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <code>/etc/hostname</code>, <code>/etc/os-release</code>, dan <code>/etc/passwd</code> di partisi Linux.</li></ol>", "ask": "<p>Apa hostname sistem Linux ini?</p>", "text": "identitas sistem langkah:\n1. buka /etc/hostname, /etc/os-release, dan /etc/passwd di partisi linux.\n\npertanyaan: apa hostname sistem linux ini?\n", "hint": "Buka /etc/hostname.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k***"}, {"n": 5, "lvl": "Dasar", "title": "Partisi yang sengaja disembunyikan", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <code>/etc/fstab</code>. File ini mengatur partisi mana yang di-mount otomatis saat komputer menyala.</li></ol>", "ask": "<p>Partisi mana yang sengaja tidak di-mount menurut /etc/fstab?</p>", "text": "partisi yang sengaja disembunyikan langkah:\n1. buka /etc/fstab. file ini mengatur partisi mana yang di-mount otomatis saat komputer menyala.\n\npertanyaan: partisi mana yang sengaja tidak di-mount menurut /etc/fstab?\n", "hint": "Cari baris komentar (diawali #) tentang partisi ketiga.", "mandiri": false, "isian": "Jawaban singkat", "mask": "/d**/s***"}, {"n": 6, "lvl": "Dasar", "title": "Folder alat", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/tools/</code> dan <code>~/tools/build/</code>.</li></ol>", "ask": "<p>Apa nama biner ransomware untuk SLN di tools/build/?</p>", "text": "folder alat langkah:\n1. buka ~/tools/ dan ~/tools/build/.\n\npertanyaan: apa nama biner ransomware untuk sln di tools/build/?\n", "hint": "Nama file memuat singkatan nama korban.", "mandiri": false, "isian": "Jawaban singkat", "mask": "k**_s**.e**"}, {"n": 7, "lvl": "Dasar", "title": "Hasil scan", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/recon/nmap_sln_20250512.txt</code>.</li></ol>", "ask": "<p>IP mana yang menjalankan Fortinet SSL VPN menurut nmap_sln_20250512.txt?</p>", "text": "hasil scan langkah:\n1. buka ~/recon/nmap_sln_20250512.txt.\n\npertanyaan: ip mana yang menjalankan fortinet ssl vpn menurut nmap_sln_20250512.txt?\n", "hint": "Cari host vpn.samlognus.co.id di hasil scan.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2**.*.1**.**"}, {"n": 8, "lvl": "Dasar", "title": "Kredensial valid", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/recon/kredensial_valid.txt</code>.</li></ol>", "ask": "<p>Akun apa yang diperoleh \"dari orang dalam (Pak H)\" menurut kredensial_valid.txt?</p>", "text": "kredensial valid langkah:\n1. buka ~/recon/kredensial_valid.txt.\n\npertanyaan: akun apa yang diperoleh \"dari orang dalam (pak h)\" menurut kredensial_valid.txt?\n", "hint": "Setiap akun diberi keterangan sumber dan tanggal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "s**_b*****"}, {"n": 9, "lvl": "Dasar", "title": "SSH key", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/.ssh/id_ed25519.pub</code>.</li></ol>", "ask": "<p>Apa komentar pada public key ~/.ssh/id_ed25519.pub?</p>", "text": "ssh key langkah:\n1. buka ~/.ssh/id_ed25519.pub.\n\npertanyaan: apa komentar pada public key ~/.ssh/id_ed25519.pub?\n", "hint": "Komentar adalah teks setelah spasi terakhir.", "mandiri": false, "isian": "Jawaban singkat", "mask": "f****@k***"}, {"n": 10, "lvl": "Dasar", "title": "Log koneksi VPN", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/vpn/conn.log</code>.</li></ol>", "ask": "<p>Akun VPN apa yang dipakai untuk masuk ke SLN menurut vpn/conn.log?</p>", "text": "log koneksi vpn langkah:\n1. buka ~/vpn/conn.log.\n\npertanyaan: akun vpn apa yang dipakai untuk masuk ke sln menurut vpn/conn.log?\n", "hint": "Cari baris koneksi openfortivpn.", "mandiri": false, "isian": "Jawaban singkat", "mask": "d***.a********"}, {"n": 11, "lvl": "Dasar", "title": "Catatan deploy", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/tools/deploy_notes.md</code>.</li></ol>", "ask": "<p>Ke path apa locker ditaruh di FS01 menurut deploy_notes.md?</p>", "text": "catatan deploy langkah:\n1. buka ~/tools/deploy_notes.md.\n\npertanyaan: ke path apa locker ditaruh di fs01 menurut deploy_notes.md?\n", "hint": "Catatan menyebut nama samaran proses sistem dan folder di ProgramData.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*:\\Pr*********\\M********\\C*****\\s******_u**.e**"}, {"n": 12, "lvl": "Menengah", "title": "Shell history", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>~/.zsh_history</code>. Setiap baris berformat <code>: &lt;angka&gt;:0;&lt;perintah&gt;</code>. Angka itu adalah waktu <em>Unix epoch</em>.</li><li>Ubah epoch ke WIB dengan konverter epoch (misalnya <code>date -d @1746731610</code> di Linux, atau konverter daring), lalu tambahkan 7 jam bila hasilnya UTC.</li></ol>", "ask": "<p>Pukul berapa (YYYY-MM-DD HH:MM:SS WIB) perintah ./tools/kabut_builder.sh main dijalankan?</p>", "text": "shell history langkah:\n1. buka ~/.zsh_history. setiap baris berformat : <angka>:0;<perintah>. angka itu adalah waktu unix epoch.\n2. ubah epoch ke wib dengan konverter epoch (misalnya date -d @1746731610 di linux, atau konverter daring), lalu tambahkan 7 jam bila hasilnya utc.\n\npertanyaan: pukul berapa (yyyy-mm-dd hh:mm:ss wib) perintah ./tools/kabut_builder.sh main dijalankan?\n", "hint": "Ubah epoch 1746731610 ke WIB (UTC+7).", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-** **:**:**"}, {"n": 13, "lvl": "Menengah", "title": "File terenkripsi yang mencurigakan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Encryption Suspected</strong> (<a class=\"pref\" href=\"#panduan-p9\" data-p=\"P9\">P9</a>).</li></ol>", "ask": "<p>Apa path file yang ditandai Encryption Suspected?</p>", "text": "file terenkripsi yang mencurigakan langkah:\n1. buka analysis results → encryption suspected (p9).\n\npertanyaan: apa path file yang ditandai encryption suspected?\n", "hint": "File bernama satu huruf di folder cache thumbnail.", "mandiri": false, "isian": "Jawaban singkat", "mask": "/h***/f****/.c****/th********/.*"}, {"n": 14, "lvl": "Menengah", "title": "Waktu file kontainer", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik file dari Soal 13, lalu buka tab <strong>File Metadata</strong>. Catat <em>Created</em>, <em>Modified</em>, <em>Accessed</em>, dan <em>Changed</em>.</li></ol>", "ask": "<p>Berapa nilai Created file kontainer .t (YYYY-MM-DD HH:MM:SS)?</p>", "text": "waktu file kontainer langkah:\n1. klik file dari soal 13, lalu buka tab file metadata. catat created, modified, accessed, dan changed.\n\npertanyaan: berapa nilai created file kontainer .t (yyyy-mm-dd hh:mm:ss)?\n", "hint": "Lihat tab File Metadata. Created lebih baru daripada Modified.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-** **:**:**"}, {"n": 15, "lvl": "Menengah", "title": "Isi partisi tersembunyi", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka volume partisi kecil terpisah dari Soal 3.</li><li>Buka <code>kunci.txt</code>, <code>wallet.txt</code>, <code>panel_vps.txt</code>, dan folder <code>kabut_ops/</code>.</li></ol>", "ask": "<p>Apa password vault yang tertulis di kunci.txt?</p>", "text": "isi partisi tersembunyi langkah:\n1. buka volume partisi kecil terpisah dari soal 3.\n2. buka kunci.txt, wallet.txt, panel_vps.txt, dan folder kabut_ops/.\n\npertanyaan: apa password vault yang tertulis di kunci.txt?\n", "hint": "kunci.txt ada di partisi tersembunyi DATA_K.", "mandiri": false, "isian": "Jawaban singkat", "mask": "K****#V******"}, {"n": 16, "lvl": "Menengah", "title": "Bukti pembayaran tebusan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <code>kabut_ops/bukti_bayar_SLN.txt</code> di partisi tersembunyi.</li></ol>", "ask": "<p>Berapa BTC tebusan yang dibayar SLN menurut bukti_bayar_SLN.txt?</p>", "text": "bukti pembayaran tebusan langkah:\n1. buka kabut_ops/bukti_bayar_sln.txt di partisi tersembunyi.\n\npertanyaan: berapa btc tebusan yang dibayar sln menurut bukti_bayar_sln.txt?\n", "hint": "File ada di kabut_ops/ pada partisi tersembunyi.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*.*"}, {"n": 17, "lvl": "Menengah", "title": "File yang dihapus", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files</strong> (<a class=\"pref\" href=\"#panduan-p6\" data-p=\"P6\">P6</a>).</li></ol>", "ask": "<p>Apa nama deleted file di partisi Linux?</p>", "text": "file yang dihapus langkah:\n1. buka views → deleted files (p6).\n\npertanyaan: apa nama deleted file di partisi linux?\n", "hint": "File ada di folder loot/SLN/ dan berukuran 0 di Autopsy.", "mandiri": false, "isian": "Jawaban singkat", "mask": "kr********_d***.t**"}, {"n": 18, "lvl": "Menengah", "title": "Memulihkan isi lewat pencarian", "tahap": "Tahap 6 · Pemulihan", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Exact Match</strong> dengan kata <code>dump lsass</code> atau <code>svc_backup:1104</code> (<a class=\"pref\" href=\"#panduan-p7\" data-p=\"P7\">P7</a>).</li><li>Buka hasil dari unallocated space.</li></ol>", "ask": "<p>Service account apa yang ada di isi kredensial_dump.txt selain Administrator?</p>", "text": "memulihkan isi lewat pencarian langkah:\n1. jalankan keyword search exact match dengan kata dump lsass atau svc_backup:1104 (p7).\n2. buka hasil dari unallocated space.\n\npertanyaan: service account apa yang ada di isi kredensial_dump.txt selain administrator?\n", "hint": "Cari keyword \"dump lsass\" di unallocated space.", "mandiri": false, "isian": "Jawaban singkat", "mask": "s**_b*****"}, {"n": 19, "lvl": "Menengah", "title": "Hash set known-bad", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Hashset Hits → KABUT_known_bad</strong>.</li></ol>", "ask": "<p>Berapa file yang cocok dengan hash set KABUT_known_bad?</p>", "text": "hash set known-bad langkah:\n1. buka analysis results → hashset hits → kabut_known_bad.\n\npertanyaan: berapa file yang cocok dengan hash set kabut_known_bad?\n", "hint": "Hitung hit di tools/ dan tools/build/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 20, "lvl": "Menengah", "title": "Jejak di area swap", "tahap": "Tahap 7 · Pencarian dan identifikasi", "label": "Langkah", "steps": "<ol><li>Jalankan Keyword Search <strong>Substring Match</strong> dengan kata <code>openssl</code>, lalu dengan <code>PASSWORD=</code>.</li><li>Perhatikan hasil yang berasal dari volume swap (Soal 3).</li></ol>", "ask": "<p>Password akun dewi.anggraini apa yang ditemukan di area swap?</p>", "text": "jejak di area swap langkah:\n1. jalankan keyword search substring match dengan kata openssl, lalu dengan password=.\n2. perhatikan hasil yang berasal dari volume swap (soal 3).\n\npertanyaan: password akun dewi.anggraini apa yang ditemukan di area swap?\n", "hint": "Cari baris yang diawali PASSWORD= di volume swap.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A****@i******"}, {"n": 21, "lvl": "Sulit", "title": "Dekripsi kontainer", "tahap": "Tahap 8 · Membuka encrypted container", "label": "Langkah", "steps": "<ol><li>Ekstrak file kontainer dari Soal 13 (<a class=\"pref\" href=\"#panduan-p5\" data-p=\"P5\">P5</a>), misalnya sebagai <code>t.bin</code>.</li><li>Ambil password dan parameter dari <code>kunci.txt</code> (Soal 15) atau dari temuan swap (Soal 20).</li><li>Di Linux atau WSL, jalankan:<div class='cont'><code>openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -nosalt -nopad -pass pass:'&lt;KATA_SANDI&gt;' -in t.bin -out v.tar</code></div></li><li>Lihat isinya dengan <code>tar tvf v.tar</code>, lalu ekstrak dengan <code>tar xvf v.tar</code>.</li></ol>", "ask": "<p>Apa nama file pembagian hasil di dalam kontainer yang didekripsi?</p>", "text": "dekripsi kontainer langkah:\n1. ekstrak file kontainer dari soal 13 (p5), misalnya sebagai t.bin.\n2. ambil password dan parameter dari kunci.txt (soal 15) atau dari temuan swap (soal 20).\n3. di linux atau wsl, jalankan:\n   openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -nosalt -nopad -pass pass:'<kata_sandi>' -in t.bin -out v.tar\n4. lihat isinya dengan tar tvf v.tar, lalu ekstrak dengan tar xvf v.tar.\n\npertanyaan: apa nama file pembagian hasil di dalam kontainer yang didekripsi?\n", "hint": "Hasil dekripsi adalah file tar dengan folder operasi/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "p********.t**"}, {"n": 22, "lvl": "Sulit", "title": "Pembagian hasil tebusan", "tahap": "Tahap 8 · Membuka encrypted container", "label": "Langkah", "steps": "<ol><li>Baca <code>operasi/pembagian.txt</code>, <code>operasi/korban.csv</code>, dan <code>operasi/kontak.txt</code> dari hasil Soal 21.</li></ol>", "ask": "<p>Berapa persen bagian kabut_admin dari tebusan SLN?</p>", "text": "pembagian hasil tebusan langkah:\n1. baca operasi/pembagian.txt, operasi/korban.csv, dan operasi/kontak.txt dari hasil soal 21.\n\npertanyaan: berapa persen bagian kabut_admin dari tebusan sln?\n", "hint": "pembagian.txt berisi empat persentase.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 23, "lvl": "Sulit", "title": "Kronologi aktivitas penyerang", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Gabungkan waktu dari Soal 7–22, terutama <code>.zsh_history</code> dan <code>conn.log</code>.</li><li>Gunakan <strong>Tools → Timeline</strong> (<a class=\"pref\" href=\"#panduan-p11\" data-p=\"P11\">P11</a>) untuk memeriksa waktu dibuatnya file di <code>tools/build/</code> dan <code>loot/</code>.</li></ol>", "ask": "<p>Pada tanggal berapa (YYYY-MM-DD) dump database KSP diambil menurut nama file di loot/KSP/?</p>", "text": "kronologi aktivitas penyerang langkah:\n1. gabungkan waktu dari soal 7–22, terutama .zsh_history dan conn.log.\n2. gunakan tools → timeline (p11) untuk memeriksa waktu dibuatnya file di tools/build/ dan loot/.\n\npertanyaan: pada tanggal berapa (yyyy-mm-dd) dump database ksp diambil menurut nama file di loot/ksp/?\n", "hint": "Tanggal tercantum di nama file .sql.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-**"}, {"n": 24, "lvl": "Sulit", "title": "Menguji dalih tersangka", "tahap": "Tahap 9 · Rekonstruksi", "label": "Langkah", "steps": "<ol><li>Buka folder <code>~/ctf/</code>, lalu bandingkan dengan isi <code>tools/</code>, <code>recon/</code>, <code>loot/</code>, dan partisi tersembunyi.</li></ol>", "ask": "<p>Apakah isi laptop mendukung dalih \"hanya untuk latihan CTF\"? (ya/tidak)</p>", "text": "menguji dalih tersangka langkah:\n1. buka folder ~/ctf/, lalu bandingkan dengan isi tools/, recon/, loot/, dan partisi tersembunyi.\n\npertanyaan: apakah isi laptop mendukung dalih \"hanya untuk latihan ctf\"? (ya/tidak)\n\n---\n", "hint": "Bandingkan folder ctf/ dengan target nyata di recon/ dan loot/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "t****"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 25, "lvl": "Sulit", "title": "Ransomware yang menyerang SLN", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat MD5 <code>~/tools/build/kbl_sln.exe</code> dan <code>~/tools/build/BACA_SAYA_KABUT_SLN.txt</code>.</li><li>Tambahkan <code><span class=\"evd\">EVD-11</span>.dd</code> (file server SLN yang terkena ransomware) ke case yang sama, dengan modul <strong>Hash Lookup</strong>.</li><li>Cari kedua MD5 itu di EVD-11 (<a class=\"pref\" href=\"#panduan-p8\" data-p=\"P8\">P8</a>), atau buka <em>Hashset Hits</em> EVD-11.</li></ol>", "ask": "<p>Apa nama biner di EVD-11 yang identik dengan kbl_sln.exe?</p>", "text": "ransomware yang menyerang sln langkah:\n1. catat md5 ~/tools/build/kbl_sln.exe dan ~/tools/build/baca_saya_kabut_sln.txt.\n2. tambahkan evd-11.dd (file server sln yang terkena ransomware) ke case yang sama, dengan modul hash lookup.\n3. cari kedua md5 itu di evd-11 (p8), atau buka hashset hits evd-11.\n\npertanyaan: apa nama biner di evd-11 yang identik dengan kbl_sln.exe?\n", "hint": "Cari MD5 kbl_sln.exe di EVD-11.", "mandiri": false, "isian": "Jawaban singkat", "mask": "s******_u**.e**"}, {"n": 26, "lvl": "Sulit", "title": "Log VPN dari dua sisi", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat waktu sesi VPN dan RDP dari <code>~/vpn/conn.log</code> (Soal 10).</li><li>Di EVD-11, buka <code>Shares/IT/log_backup/fortigate_vpn_2025-05-17.log</code>.</li></ol>", "ask": "<p>Dari IP publik mana akun VPN dewi.anggraini masuk menurut log FortiGate EVD-11?</p>", "text": "log vpn dari dua sisi langkah:\n1. catat waktu sesi vpn dan rdp dari ~/vpn/conn.log (soal 10).\n2. di evd-11, buka shares/it/log_backup/fortigate_vpn_2025-05-17.log.\n\npertanyaan: dari ip publik mana akun vpn dewi.anggraini masuk menurut log fortigate evd-11?\n\n---\n", "hint": "Lihat nilai remip di baris tunnel-up.", "mandiri": false, "isian": "Jawaban singkat", "mask": "1**.**.1**.**"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> peran mesin ini dalam serangan ke SLN, Arunika, dan KSP, serta bukti penerimaan dan pembagian tebusan.</li><li><strong>Tidak terbukti:</strong> misalnya siapa kabut_admin, dan apakah wallet benar-benar menerima dana.</li><li><strong>Keterbatasan:</strong> misalnya log dan history yang dapat diubah, sampel yang dinetralkan, dan swap yang hanya berisi potongan data.</li></ul>", "scen_title": "EVD-08 — Mesin Penyerang", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP (fiktif)<br><strong>Barang bukti:</strong> SSD laptop <strong>kali</strong> milik <strong>Fajar Nugroho</strong> (alias <em>f4j4r</em> / <em>kabut_admin</em>?), disita dari kamar kos di Semarang pada 16 Juli 2025 pukul 05.40 WIB.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-08</span>.dd</code> (raw, 80 MiB, MBR dengan 3 partisi). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>IP 198.51.100.77 muncul sebagai pengirim email BEC (EVD-02), pengirim email ke Arunika (EVD-03), dan pengunggah webshell ke webserver KSP (EVD-04). Penyedia VPS memberikan data sewa yang mengarah ke Fajar. Saat penggeledahan, Fajar mengaku laptopnya \"hanya untuk latihan CTF\".</p><h4 class=\"mdh\">Yang diminta penyidik</h4><ol><li>Petakan seluruh partisi, termasuk yang tidak di-mount oleh sistem.</li><li>Temukan alat serangan, hasil scan, kredensial curian, dan biner ransomware.</li><li>Buka encrypted container.</li><li>Hubungkan mesin ini dengan serangan SLN (EVD-11), Arunika (EVD-03), dan KSP (EVD-04).</li><li>Identifikasi upaya anti-forensik.</li></ol>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Sebut peran mesin dalam tiga serangan, bukti tebusan, anti-forensik, dan batas atribusi perangkat vs orang."}, {"id": "EVD-09", "title": "EVD-09 — Lembar Kerja (PC Kantor Bersama: Siapa yang Menyetujui?)", "short": "PC Kantor Bersama: Siapa yang Menyetujui?", "exam": false, "intro": "<aside class=\"note\"><p>PC ini dipakai beberapa orang. Selalu catat <strong>profil pengguna mana</strong> (folder <code>Users/&lt;nama&gt;</code>) yang menjadi sumber setiap artefak.</p></aside>", "sections": [{"n": "1", "name": "Pemeriksaan EVD-09", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-09</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-09</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-09.dd.\n\npertanyaan: berapa md5 image evd-09.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "662d47**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-09</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Recent Activity, EXIF Parser, Hash Lookup, Keyword Search, File Type Identification, Interesting Files</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-09.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): recent activity, exif parser, hash lookup, keyword search, file type identification, interesting files.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Disk dan identitas komputer", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-09</span>.dd</code> dan lihat daftar volume.</li><li>Buka <strong>Data Artifacts → Operating System Information</strong>.</li></ol>", "ask": "<p>Apa computer name PC ini?</p>", "text": "disk dan identitas komputer langkah:\n1. klik evd-09.dd dan lihat daftar volume.\n2. buka data artifacts → operating system information.\n\npertanyaan: apa computer name pc ini?\n", "hint": "Lihat Operating System Information.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**-F**-P***"}, {"n": 4, "lvl": "Dasar", "title": "Pengguna PC", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Buka <strong>OS Accounts</strong> dan folder <code>Users/</code>.</li></ol>", "ask": "<p>Berapa akun pengguna di folder Users (tanpa Public)?</p>", "text": "pengguna pc langkah:\n1. buka os accounts dan folder users/.\n\npertanyaan: berapa akun pengguna di folder users (tanpa public)?\n", "hint": "Hitung folder profil di Users/.", "mandiri": false, "isian": "Jawaban singkat", "mask": "*"}, {"n": 5, "lvl": "Dasar", "title": "Log logon", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>ProgramData/SLN/EndpointAgent/logon_audit.log</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) akun hendra.wibisono logon pada 15 April?</p>", "text": "log logon langkah:\n1. buka programdata/sln/endpointagent/logon_audit.log dengan tab text.\n\npertanyaan: pukul berapa (hh:mm:ss) akun hendra.wibisono logon pada 15 april?\n", "hint": "Baca logon_audit.log pada 15 April sore.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 6, "lvl": "Dasar", "title": "Formulir cuti Hendra", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>Users/hendra.wibisono/Documents/Pribadi/Form_Cuti_14-18_April_2025.pdf</code>.</li></ol>", "ask": "<p>Ke kota mana Hendra cuti menurut formulir cutinya?</p>", "text": "formulir cuti hendra langkah:\n1. buka users/hendra.wibisono/documents/pribadi/form_cuti_14-18_april_2025.pdf.\n\npertanyaan: ke kota mana hendra cuti menurut formulir cutinya?\n", "hint": "Baca Form_Cuti_14-18_April_2025.pdf.", "mandiri": false, "isian": "Jawaban singkat", "mask": "D*******"}, {"n": 7, "lvl": "Dasar", "title": "Catatan magang", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>Users/magang.lina/Documents/catatan_magang.txt</code>.</li></ol>", "ask": "<p>Di aplikasi apa Lina menyimpan password Hendra menurut catatan_magang.txt?</p>", "text": "catatan magang langkah:\n1. buka users/magang.lina/documents/catatan_magang.txt.\n\npertanyaan: di aplikasi apa lina menyimpan password hendra menurut catatan_magang.txt?\n", "hint": "Baca catatan tanggal 11 April.", "mandiri": false, "isian": "Jawaban singkat", "mask": "C*****"}, {"n": 8, "lvl": "Dasar", "title": "Folder \"Intel Graphics\" yang janggal", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>ProgramData/Intel/Graphics/</code> dan subfoldernya.</li><li>Buka <code>igfx.ini</code> dengan tab <strong>Text</strong>.</li></ol>", "ask": "<p>Apa nama program keylogger di ProgramData/Intel/Graphics?</p>", "text": "folder \"intel graphics\" yang janggal langkah:\n1. buka programdata/intel/graphics/ dan subfoldernya.\n2. buka igfx.ini dengan tab text.\n\npertanyaan: apa nama program keylogger di programdata/intel/graphics?\n", "hint": "Folder itu berisi satu .exe, satu .ini, dan folder cache.", "mandiri": false, "isian": "Jawaban singkat", "mask": "i******.e**"}, {"n": 9, "lvl": "Dasar", "title": "Persetujuan di browser", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web History</strong>, lalu cari URL yang memuat <code>PAY-2025-0415-007</code>.</li><li>Perhatikan kolom path file sumber: <code>History</code> itu milik profil siapa?</li></ol>", "ask": "<p>Dari profil pengguna siapa halaman approve PAY-2025-0415-007 diakses?</p>", "text": "persetujuan di browser langkah:\n1. buka data artifacts → web history, lalu cari url yang memuat pay-2025-0415-007.\n2. perhatikan kolom path file sumber: history itu milik profil siapa?\n\npertanyaan: dari profil pengguna siapa halaman approve pay-2025-0415-007 diakses?\n", "hint": "Path file History di Web History menunjukkan nama profil.", "mandiri": false, "isian": "Jawaban singkat", "mask": "h*****.w*******"}, {"n": 10, "lvl": "Dasar", "title": "Password tersimpan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Web Accounts</strong>. Cara lain: buka file <code>Login Data</code> di setiap profil Chrome dengan tab <strong>Application</strong>.</li></ol>", "ask": "<p>Profil lain mana yang juga menyimpan kredensial e-Approval hendra.wibisono?</p>", "text": "password tersimpan langkah:\n1. buka data artifacts → web accounts. cara lain: buka file login data di setiap profil chrome dengan tab application.\n\npertanyaan: profil lain mana yang juga menyimpan kredensial e-approval hendra.wibisono?\n", "hint": "Bandingkan Web Accounts dari setiap profil.", "mandiri": false, "isian": "Jawaban singkat", "mask": "m*****.l***"}, {"n": 11, "lvl": "Dasar", "title": "Flashdisk pada 15 April", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → USB Device Attached</strong>.</li></ol>", "ask": "<p>Apa serial number flashdisk yang terhubung pada 15 April?</p>", "text": "flashdisk pada 15 april langkah:\n1. buka data artifacts → usb device attached.\n\npertanyaan: apa serial number flashdisk yang terhubung pada 15 april?\n", "hint": "Lihat USB Device Attached.", "mandiri": false, "isian": "Jawaban singkat", "mask": "070*************"}, {"n": 12, "lvl": "Menengah", "title": "Program yang berjalan otomatis", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik <code>Windows/System32/config/SOFTWARE</code>, lalu buka tab <strong>Application</strong> (registry viewer).</li><li>Telusuri key <code>Microsoft\\Windows\\CurrentVersion\\Run</code>.</li></ol>", "ask": "<p>Apa nama value di Run key yang menjalankan keylogger?</p>", "text": "program yang berjalan otomatis langkah:\n1. klik windows/system32/config/software, lalu buka tab application (registry viewer).\n2. telusuri key microsoft\\windows\\currentversion\\run.\n\npertanyaan: apa nama value di run key yang menjalankan keylogger?\n", "hint": "Buka hive SOFTWARE, lalu telusuri Microsoft\\Windows\\CurrentVersion\\Run.", "mandiri": false, "isian": "Jawaban singkat", "mask": "Ig********"}, {"n": 13, "lvl": "Menengah", "title": "Foto liburan dan zona waktu", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → EXIF Metadata</strong> untuk foto di <code>Users/hendra.wibisono/Pictures/Cuti_Bali/</code>.</li><li>Perhatikan <strong>offset zona waktu</strong> foto (<code>+08:00</code> = WITA). Autopsy menampilkan jam sesuai yang tertulis di foto, tanpa mengubahnya ke WIB.</li></ol>", "ask": "<p>Pukul berapa dalam WIB (HH:MM:SS) foto IMG_20250415_172012.jpg diambil?</p>", "text": "foto liburan dan zona waktu langkah:\n1. buka data artifacts → exif metadata untuk foto di users/hendra.wibisono/pictures/cuti_bali/.\n2. perhatikan offset zona waktu foto (+08:00 = wita). autopsy menampilkan jam sesuai yang tertulis di foto, tanpa mengubahnya ke wib.\n\npertanyaan: pukul berapa dalam wib (hh:mm:ss) foto img_20250415_172012.jpg diambil?\n", "hint": "EXIF mencatat 17:20:12 dengan offset +08:00 (WITA). Kurangi satu jam.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 14, "lvl": "Menengah", "title": "Kapan foto sampai ke PC?", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik foto dari Soal 13, lalu bandingkan <em>Created</em> di tab <strong>File Metadata</strong> dengan waktu EXIF.</li><li>Cek <code>logon_audit.log</code>: kapan Hendra kembali login ke PC ini?</li></ol>", "ask": "<p>Pada tanggal berapa (YYYY-MM-DD) foto-foto Bali disalin ke PC?</p>", "text": "kapan foto sampai ke pc? langkah:\n1. klik foto dari soal 13, lalu bandingkan created di tab file metadata dengan waktu exif.\n2. cek logon_audit.log: kapan hendra kembali login ke pc ini?\n\npertanyaan: pada tanggal berapa (yyyy-mm-dd) foto-foto bali disalin ke pc?\n", "hint": "Lihat Created di File Metadata, lalu cocokkan dengan logon Hendra setelah cuti.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-**"}, {"n": 15, "lvl": "Menengah", "title": "Flashdisk \"DATA_BG\" di dua profil", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Buka <strong>Data Artifacts → Recent Documents</strong>, lalu cari path <code>E:\\</code>.</li><li>Perhatikan profil sumber setiap shortcut: <code>Users/hendra.wibisono/…/Recent/</code> dan <code>Users/bagus.prakoso/…/Recent/</code>.</li></ol>", "ask": "<p>Apa label flashdisk di nama shortcut drive E:?</p>", "text": "flashdisk \"data_bg\" di dua profil langkah:\n1. buka data artifacts → recent documents, lalu cari path e:\\.\n2. perhatikan profil sumber setiap shortcut: users/hendra.wibisono/…/recent/ dan users/bagus.prakoso/…/recent/.\n\npertanyaan: apa label flashdisk di nama shortcut drive e:?\n", "hint": "Shortcut drive diberi nama berformat \"LABEL (E)\".", "mandiri": false, "isian": "Jawaban singkat", "mask": "D***_**"}, {"n": 16, "lvl": "Menengah", "title": "Instalasi keylogger", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Gabungkan Soal 5 (logon 10 April), Soal 11 (flashdisk pertama kali terhubung), Soal 15 (<code>igfx_setup.exe.lnk</code>), dan Soal 12 (Run key).</li><li>Lihat juga <strong>Data Artifacts → Run Programs</strong>, atau file <code>Windows/Prefetch/IGFX_SETUP.EXE-*.pf</code>.</li></ol>", "ask": "<p>Dari akun siapa keylogger di-install?</p>", "text": "instalasi keylogger langkah:\n1. gabungkan soal 5 (logon 10 april), soal 11 (flashdisk pertama kali terhubung), soal 15 (igfx_setup.exe.lnk), dan soal 12 (run key).\n2. lihat juga data artifacts → run programs, atau file windows/prefetch/igfx_setup.exe-.pf.\n\npertanyaan: dari akun siapa keylogger di-install?\n", "hint": "Shortcut igfx_setup.exe.lnk ada di profil siapa?", "mandiri": false, "isian": "Jawaban singkat", "mask": "b****.p******"}, {"n": 17, "lvl": "Menengah", "title": "Waktu file yang dipalsukan", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Klik <code>ProgramData/Intel/Graphics/igfxhlp.exe</code> dan buka tab <strong>File Metadata</strong>.</li><li>Bandingkan <em>Created</em> di <strong><code>$STANDARD_INFORMATION</code></strong> dengan <em>Created</em> di <strong><code>$FILE_NAME</code></strong> (lihat Soal 21 EVD-03 bila belum pernah).</li></ol>", "ask": "<p>Berapa nilai Created di $FILE_NAME milik igfxhlp.exe (YYYY-MM-DD HH:MM:SS)?</p>", "text": "waktu file yang dipalsukan langkah:\n1. klik programdata/intel/graphics/igfxhlp.exe dan buka tab file metadata.\n2. bandingkan created di $standard_information dengan created di $file_name (lihat soal 21 evd-03 bila belum pernah).\n\npertanyaan: berapa nilai created di $file_name milik igfxhlp.exe (yyyy-mm-dd hh:mm:ss)?\n", "hint": "Di File Metadata, lihat kelompok $FILE_NAME.", "mandiri": false, "isian": "Jawaban singkat", "mask": "2***-**-** **:**:**"}, {"n": 18, "lvl": "Menengah", "title": "Aktivitas browser Bagus", "tahap": "Tahap 5 · Analisis artefak", "label": "Langkah", "steps": "<ol><li>Di <strong>Web History</strong> dan <strong>Web Search</strong>, filter profil <code>bagus.prakoso</code>.</li></ol>", "ask": "<p>Pukul berapa (HH:MM) Bagus membuka halaman audit e-Approval pada 15 April?</p>", "text": "aktivitas browser bagus langkah:\n1. di web history dan web search, filter profil bagus.prakoso.\n\npertanyaan: pukul berapa (hh:mm) bagus membuka halaman audit e-approval pada 15 april?\n", "hint": "Filter Web History pada profil bagus.prakoso.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**"}, {"n": 19, "lvl": "Menengah", "title": "Log keylogger 11 April", "tahap": "Tahap 6 · Membuka log keylogger", "label": "Langkah", "steps": "<ol><li>Klik <code>ProgramData/Intel/Graphics/cache/klg_20250411.dat</code>. Isinya teks berkode <strong>Base64</strong>.</li><li>Ekstrak file (<a class=\"pref\" href=\"#panduan-p5\" data-p=\"P5\">P5</a>), lalu dekode. Pilihannya: CyberChef (\"From Base64\"), Windows <code>certutil -decode klg_20250411.dat hasil.txt</code>, atau Linux <code>base64 -d</code>.</li></ol>", "ask": "<p>Password apa yang terekam di klg_20250411.dat untuk akun Hendra?</p>", "text": "log keylogger 11 april langkah:\n1. klik programdata/intel/graphics/cache/klg_20250411.dat. isinya teks berkode base64.\n2. ekstrak file (p5), lalu dekode. pilihannya: cyberchef (\"from base64\"), windows certutil -decode klg_20250411.dat hasil.txt, atau linux base64 -d.\n\npertanyaan: password apa yang terekam di klg_20250411.dat untuk akun hendra?\n", "hint": "Dekode base64, lalu cari baris yang diikuti &lt;TAB&gt;.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**#F******"}, {"n": 20, "lvl": "Menengah", "title": "Log keylogger 15 April yang dihapus", "tahap": "Tahap 6 · Membuka log keylogger", "label": "Langkah", "steps": "<ol><li>Buka <strong>Views → Deleted Files</strong> dan cari <code>klg_20250415.dat</code>.</li><li>Ekstrak dan dekode seperti Soal 19.</li><li>Lihat waktu <em>Modified</em> folder <code>ProgramData/Intel/Graphics/cache</code> di <strong>File Metadata</strong>.</li></ol>", "ask": "<p>Pukul berapa (HH:MM:SS) tombol Setujui diklik menurut klg_20250415.dat?</p>", "text": "log keylogger 15 april yang dihapus langkah:\n1. buka views → deleted files dan cari klg_20250415.dat.\n2. ekstrak dan dekode seperti soal 19.\n3. lihat waktu modified folder programdata/intel/graphics/cache di file metadata.\n\npertanyaan: pukul berapa (hh:mm:ss) tombol setujui diklik menurut klg_20250415.dat?\n", "hint": "Dekode file terhapus itu dan cari kata Setujui.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**:**:**"}, {"n": 21, "lvl": "Menengah", "title": "Hash set known-bad", "tahap": "Tahap 7 · Pencarian", "label": "Langkah", "steps": "<ol><li>Buka <strong>Analysis Results → Hashset Hits → KABUT_known_bad</strong>.</li></ol>", "ask": "<p>File apa april 16:31–16:47?\n\n---\n", "hint": "Timbang siapa yang memasang alat, flashdisk siapa yang terhubung, dan siapa yang mengecek audit.", "mandiri": false, "isian": "Jawaban singkat", "mask": "B**** P******"}]}, {"n": "2", "name": "Keterkaitan dengan barang bukti lain", "intro": "", "items": [{"n": 27, "lvl": "Sulit", "title": "Flashdisk DATA_BG milik siapa?", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Catat serial number flashdisk dari Soal 11 (kolom <em>Device ID/Serial</em> di USB Device Attached).</li><li>Tambahkan <code><span class=\"evd\">EVD-05</span>.dd</code> (laptop Bagus) ke case yang sama, dengan modul <strong>Recent Activity</strong>.</li><li>Di EVD-05, buka <strong>Data Artifacts → USB Device Attached</strong>, lalu cari serial number yang sama.</li></ol>", "ask": "<p>Apakah flashdisk 070B2C11D3A4E519 pernah terhubung ke laptop Bagus di EVD-05? (ya/tidak)</p>", "text": "flashdisk data_bg milik siapa? langkah:\n1. catat serial number flashdisk dari soal 11 (kolom device id/serial di usb device attached).\n2. tambahkan evd-05.dd (laptop bagus) ke case yang sama, dengan modul recent activity.\n3. di evd-05, buka data artifacts → usb device attached, lalu cari serial number yang sama.\n\npertanyaan: apakah flashdisk 070b2c11d3a4e519 pernah terhubung ke laptop bagus di evd-05? (ya/tidak)\n", "hint": "Cari serial number yang sama di USB Device Attached EVD-05.", "mandiri": false, "isian": "Jawaban singkat", "mask": "**"}, {"n": 28, "lvl": "Sulit", "title": "Cocokkan dengan email e-Approval", "tahap": "Keterkaitan", "label": "Langkah", "steps": "<ol><li>Tambahkan <code><span class=\"evd\">EVD-02</span>.dd</code> (laptop Dewi) ke case yang sama.</li><li>Di EVD-02, buka <code>Users/dewi.anggraini/Documents/Email/09_eapproval_disetujui.eml</code>.</li></ol>", "ask": "<p>Dari terminal mana persetujuan dilakukan menurut email e-Approval di EVD-02?</p>", "text": "cocokkan dengan email e-approval langkah:\n1. tambahkan evd-02.dd (laptop dewi) ke case yang sama.\n2. di evd-02, buka users/dewi.anggraini/documents/email/09_eapproval_disetujui.eml.\n\npertanyaan: dari terminal mana persetujuan dilakukan menurut email e-approval di evd-02?\n\n---\n", "hint": "Buka 09_eapproval_disetujui.eml di EVD-02.", "mandiri": false, "isian": "Jawaban singkat", "mask": "S**-F**-P***"}]}], "penutup": "<p>Buat laporan dari hasil tag (<a class=\"pref\" href=\"#panduan-p12\" data-p=\"P12\">P12</a>), lalu tulis kesimpulan maksimal satu halaman:</p><ul><li><strong>Terbukti:</strong> penggunaan akun Hendra pada 15 April, keylogger, dan flashdisk DATA_BG.</li><li><strong>Tidak terbukti:</strong> identitas orang yang secara fisik duduk di depan PC.</li><li><strong>Alternatif penjelasan:</strong> mana yang sudah disingkirkan dan mana yang belum.</li><li><strong>Keterbatasan:</strong> misalnya tidak ada log Windows asli maupun CCTV, log dari agen pihak ketiga, EXIF yang dapat diubah, dan password yang diketahui beberapa orang.</li></ul>", "scen_title": "EVD-09 — PC Kantor Bersama (Atribusi Pengguna)", "scen": "<p><strong>Perkara:</strong> Operasi KABUT GELAP (fiktif). Klaster BEC PT Samudra Logistik Nusantara.<br><strong>Barang bukti:</strong> PC bersama divisi keuangan <strong>SLN-FIN-PC03</strong> (10.20.3.23), dipakai bergantian oleh beberapa pegawai. Dicabut dari jaringan dan diserahkan pada 22 April 2025.<br><strong>Image:</strong> <code><span class=\"evd\">EVD-09</span>.dd</code> (raw, 90 MiB, GPT + NTFS). Zona waktu WIB.</p><h4 class=\"mdh\">Latar belakang</h4><p>Pembayaran BEC Rp 1,475 M (EVD-02) disetujui di sistem e-Approval atas nama <strong>hendra.wibisono</strong> pada <strong>15 April 2025 pukul 16:40:52</strong> dari terminal SLN-FIN-PC03. Hendra menyatakan sedang cuti di Bali (14–18 April) dan tidak pernah menyetujuinya. PC ini juga dipakai Dewi (staf), Lina (mahasiswa magang), dan Bagus (IT, melakukan \"maintenance\" pada 10 April).</p><p><strong>Pertanyaan utama:</strong> siapa yang sebenarnya duduk di depan PC dan memakai akun Hendra pada 15 April 16:31–16:47?</p><h4 class=\"mdh\">Yang diminta penyidik</h4><p>Kumpulkan dan timbang bukti yang <strong>saling bertentangan</strong>: aktivitas profil Hendra, kredensial Hendra yang tersimpan di browser orang lain, keylogger, perangkat USB, dan alibi berbasis foto. Sampaikan kesimpulan atribusi beserta tingkat keyakinan dan keterbatasannya.</p>", "penutup_title": "Penutup — Kesimpulan untuk Jaksa (tahap pelaporan)", "penutup_hint": "Pisahkan \"akun dipakai\" dari \"orang tertentu yang memakai\". Sebut alternatif yang sudah disingkirkan dan yang belum."}, {"id": "EVD-10", "title": "EVD-10 — Lembar Kerja (Laptop Sindikat Investasi Kripto)", "short": "Laptop Sindikat Investasi Kripto", "exam": false, "intro": "", "sections": [{"n": "1", "name": "Pemeriksaan EVD-10", "intro": "", "items": [{"n": 1, "lvl": "Dasar", "title": "Verifikasi integritas image", "tahap": "Tahap 1 · Persiapan", "label": "Langkah", "steps": "<ol><li>Ikuti <a class=\"pref\" href=\"#panduan-p1\" data-p=\"P1\">P1</a> untuk <code><span class=\"evd\">EVD-10</span>.dd</code>.</li></ol>", "ask": "<p>Berapa MD5 image <span class=\"evd\">EVD-10</span>.dd hasil perhitungan Anda?</p>", "text": "verifikasi integritas image langkah:\n1. ikuti p1 untuk evd-10.dd.\n\npertanyaan: berapa md5 image evd-10.dd hasil perhitungan anda?\n", "hint": "Hasil certutil atau md5sum berupa 32 karakter heksadesimal.", "mandiri": false, "isian": "Jawaban singkat", "mask": "6a5a78**************************"}, {"n": 2, "lvl": "Dasar", "title": "Menyiapkan case dan ingest", "tahap": "Tahap 2 · Pemrosesan di Autopsy", "label": "Langkah", "steps": "<ol><li>Buat case dan tambahkan <code><span class=\"evd\">EVD-10</span>.dd</code> (<a class=\"pref\" href=\"#panduan-p2\" data-p=\"P2\">P2</a>) dengan time zone Asia/Jakarta.</li><li>Pastikan hash set <code>KABUT_known_bad</code> sudah diimpor (<a class=\"pref\" href=\"#panduan-p3\" data-p=\"P3\">P3</a>).</li><li>Centang modul (<a class=\"pref\" href=\"#panduan-p4\" data-p=\"P4\">P4</a>): <strong>Recent Activity, Hash Lookup, Keyword Search, EXIF Parser, Embedded File Extractor, File Type Identification, Interesting Files</strong>.</li></ol>", "ask": "<p>Time zone apa yang Anda pilih untuk data source?</p>", "text": "menyiapkan case dan ingest langkah:\n1. buat case dan tambahkan evd-10.dd (p2) dengan time zone asia/jakarta.\n2. pastikan hash set kabut_known_bad sudah diimpor (p3).\n3. centang modul (p4): recent activity, hash lookup, keyword search, exif parser, embedded file extractor, file type identification, interesting files.\n\npertanyaan: time zone apa yang anda pilih untuk data source?\n", "hint": "Lihat langkah 5 di P2.", "mandiri": false, "isian": "Jawaban singkat", "mask": "A***/J******"}, {"n": 3, "lvl": "Dasar", "title": "Disk dan identitas komputer", "tahap": "Tahap 3 · Orientasi", "label": "Langkah", "steps": "<ol><li>Klik <code><span class=\"evd\">EVD-10</span>.dd</code> dan lihat daftar volume.</li><li>Buka <strong>Data Artifacts → Operating System Information</strong> dan <strong>OS Accounts</strong>.</li></ol>", "ask": "<p>Apa computer name laptop ini?</p>", "text": "disk dan identitas komputer langkah:\n1. klik evd-10.dd dan lihat daftar volume.\n2. buka data artifacts → operating system information dan os accounts.\n\npertanyaan: apa computer name laptop ini?\n", "hint": "Lihat Operating System Information.", "mandiri": false, "isian": "Jawaban singkat", "mask": "C**-D******"}, {"n": 4, "lvl": "Dasar", "title": "Dokumen perusahaan", "tahap": "Tahap 4 · Penelusuran file", "label": "Langkah", "steps": "<ol><li>Buka <code>Users/hartono/Documents/Perusahaan/</code>.</li><li>Buka akta pendirian dengan tab <strong>Application</strong> atau <strong>Text</strong>.</li></ol>", "ask": "<p>Siapa Direktur Utama menurut akta pendirian?</p>", "text": "dokumen perusahaan langkah:\n1. buka users/hartono/documents/perusahaan/.\n2. buka akta pendirian dengan tab application atau text.\n\npertanyaan: siapa direktur u
