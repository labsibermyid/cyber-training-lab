<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presentasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--night:#1b0f33;--neon:#e0368f;--sunset:#ff8a3d;--gold:#ffd27a;--lagoon:#14b3ad;
 --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--night);color:#fff;font:15px/1.5 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
body.menu-open .stage,body.menu-open .top,body.menu-open .bottom{visibility:hidden}

/* latar */
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(90% 55% at 50% 118%,#ff8a3d55,transparent 60%),
 radial-gradient(70% 50% at 50% 105%,#e0368f66,transparent 65%),
 linear-gradient(180deg,#140a27 0%,#1b0f33 45%,#2b1250 100%)}
.bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000022 3px 4px);pointer-events:none}
.palms{position:absolute;bottom:0;width:240px;height:320px;opacity:.55}
.palms.l{left:-30px}.palms.r{right:-30px;transform:scaleX(-1)}
@media (max-width:900px){.palms{display:none}}

/* bar atas */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px clamp(12px,2.4vw,28px);background:linear-gradient(180deg,#140a27ee,#140a2700)}
.deckname{font:italic 900 clamp(20px,2vw,28px)/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap{font:600 13px var(--f-body);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{margin-left:auto}
.tbtn{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;background:#ffffff1a;font:600 13px var(--f-body);white-space:nowrap}
.tbtn:hover{background:#ffffff33}
.tbtn kbd{font:700 11px var(--f-body);background:#fff;color:var(--night);border-radius:4px;padding:2px 5px}
.tbtn svg{width:15px;height:15px}

/* panggung slide */
.stage{position:fixed;inset:58px clamp(10px,3vw,60px) 64px;z-index:2;display:grid;place-items:center}
.frame{position:relative;width:min(100%,calc((100vh - 140px) * 16 / 9));aspect-ratio:720/405.36;border-radius:6px;overflow:hidden;background:#21123a;box-shadow:0 0 0 1px #ffffff22,10px 12px 0 var(--neon),0 30px 80px #000a;transition:box-shadow .4s}
.frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame .wipe{position:absolute;inset:-10% auto -10% -40%;width:30%;background:linear-gradient(90deg,var(--gold),var(--sunset));transform:skewX(-18deg) translateX(-140%);z-index:3;pointer-events:none;opacity:0}
.frame.go .wipe{animation:wipe .42s cubic-bezier(.6,0,.3,1)}
@keyframes wipe{0%{opacity:1}to{opacity:1;transform:skewX(-18deg) translateX(560%)}}
.frame.go .slide{animation:fadein .42s ease-out}
@keyframes fadein{0%,30%{opacity:0}}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:italic 800 22px var(--f-disp);letter-spacing:.08em;opacity:.7}
.nav{position:absolute;top:0;bottom:0;width:22%;z-index:2}
.nav.prev{left:0;cursor:w-resize}.nav.next{right:0;cursor:e-resize}

/* bar bawah */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px clamp(12px,2.4vw,28px) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;background:linear-gradient(0deg,#140a27ee,#140a2700)}
.count{font:italic 900 22px/1 var(--f-disp);white-space:nowrap;min-width:84px}
.count small{font-size:15px;opacity:.6}
.prog{flex:1;display:flex;gap:3px;height:6px}
.prog span{position:relative;height:100%;background:#ffffff26;border-radius:3px;overflow:hidden;cursor:pointer}
.prog span i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--neon),var(--gold));width:0}
.arrows{display:flex;gap:6px}
.arr{width:38px;height:34px;border-radius:8px;background:#ffffff1a;display:grid;place-items:center}
.arr:hover{background:#ffffff33}.arr svg{width:18px;height:18px}
.arr:disabled{opacity:.3;cursor:default}

/* judul bab ala misi */
.mission{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none}
.mission::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 50%,#140a27f0,#140a27aa);opacity:0}
.mission:not(.show){visibility:hidden}
.mission .box{position:relative;transform:skewX(-8deg);text-align:left}
.mission .k{display:inline-block;font:800 15px var(--f-body);letter-spacing:.18em;text-transform:uppercase;background:var(--gold);color:var(--night);padding:5px 12px}
.mission h2{margin:8px 0 0;font:italic 900 clamp(48px,8vw,120px)/.86 var(--f-disp);text-transform:uppercase;text-shadow:0 5px 0 var(--neon),0 0 50px #e0368f99;max-width:16ch}
@media (prefers-reduced-motion:no-preference){
 .mission.show .k{animation:mk 1.9s cubic-bezier(.2,.9,.3,1) both}
 .mission.show::before{animation:mb 1.9s ease both}
 @keyframes mb{0%{opacity:0}12%,82%{opacity:1}100%{opacity:0}}
 .mission.show h2{animation:mh 1.9s .08s cubic-bezier(.2,.9,.3,1) both}
 @keyframes mk{0%{opacity:0;transform:translateX(-80px)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(40px)}}
 @keyframes mh{0%{opacity:0;transform:translateX(120px)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-60px)}}
}
@media (prefers-reduced-motion:reduce){.mission{display:none}}

/* layar pembuka & menu jeda */
.screen{position:fixed;inset:0;z-index:10;background-color:#140a27;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,60px);align-items:center;padding:clamp(20px,5vh,60px) clamp(20px,6vw,90px);background-image:radial-gradient(70% 60% at 80% 100%,#e0368f40,transparent 70%),radial-gradient(60% 50% at 20% 110%,#ff8a3d33,transparent 70%)}
.screen .kick{font:700 14px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.screen h1{margin:10px 0 14px;font:italic 900 clamp(54px,8.5vw,128px)/.84 var(--f-disp);text-transform:uppercase;text-shadow:0 5px 0 var(--neon),0 0 40px #e0368f77}
.screen .meta{display:flex;flex-wrap:wrap;gap:8px 22px;font:600 15px var(--f-body);opacity:.85}
.screen .meta b{font:italic 900 28px/1 var(--f-disp);color:var(--gold);margin-right:6px}
.menu{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 120px);overflow:auto;padding:6px 10px 6px 6px}
.mi{position:relative;display:flex;align-items:baseline;gap:12px;text-align:left;padding:7px 26px 7px 12px;font:italic 900 clamp(20px,2.2vw,30px)/1.05 var(--f-disp);text-transform:uppercase;color:#ffffffbb;align-self:flex-start;isolation:isolate}
.mi .n{font:700 13px var(--f-body);font-style:normal;opacity:.6;min-width:22px}
.mi small{font:500 12px var(--f-body);font-style:normal;text-transform:none;opacity:.6;margin-left:6px}
.mi::before{content:"";position:absolute;inset:0;z-index:-1;background:#fff;box-shadow:5px 5px 0 var(--neon);transform:skewX(-12deg) scaleX(0);transform-origin:left;transition:transform .16s}
.mi[aria-current=true]{color:var(--night)}
.mi[aria-current=true]::before{transform:skewX(-12deg) scaleX(1)}
.mi:focus-visible{outline:none}
.mi.big{font-size:clamp(26px,3vw,40px)}
.hint{position:fixed;left:clamp(20px,6vw,90px);bottom:18px;z-index:11;display:flex;gap:16px;flex-wrap:wrap;font:600 13px var(--f-body);opacity:.85}
.hint kbd{font:700 11.5px var(--f-body);background:#fff;color:var(--night);border-radius:4px;padding:3px 6px;margin-right:5px}
.err{max-width:52ch}
@media (max-width:860px){
 .screen{grid-template-columns:minmax(0,1fr);align-content:start;overflow:auto}
 .hint{display:none}
 .stage{inset:56px 6px 60px}
 .frame{box-shadow:0 0 0 1px #ffffff22,6px 6px 0 var(--neon)}
 .chap{display:none}
 .top .tbtn span{display:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
 <svg class="palms l" viewBox="0 0 240 320"><g fill="#0d0620"><path d="M110 320c4-90 2-170 18-250l8 2c-14 80-12 160-14 248z"/><path d="M132 72c-30-22-76-26-112-14 38-4 74 4 104 22zM135 70c-8-38-36-66-72-76 30 16 56 44 66 80zM137 68c22-34 62-52 104-48-38 8-74 26-96 54zM135 74c34-10 74-4 104 20-32-14-70-18-100-14zM130 76c-22 18-36 48-36 82 8-30 22-58 42-76z"/></g></svg>
 <svg class="palms r" viewBox="0 0 240 320"><g fill="#0d0620"><path d="M110 320c4-90 2-170 18-250l8 2c-14 80-12 160-14 248z"/><path d="M132 72c-30-22-76-26-112-14 38-4 74 4 104 22zM135 70c-8-38-36-66-72-76 30 16 56 44 66 80zM137 68c22-34 62-52 104-48-38 8-74 26-96 54zM135 74c34-10 74-4 104 20-32-14-70-18-100-14zM130 76c-22 18-36 48-36 82 8-30 22-58 42-76z"/></g></svg>
</div>

<header class="top">
 <div style="min-width:0"><div class="deckname" id="deckName">Presentasi</div><div class="chap" id="chapName"></div></div>
 <div class="sp"></div>
 <button class="tbtn" id="menuBtn" type="button" aria-label="Buka menu bab"><kbd>Esc</kbd><span>Menu</span></button>
 <button class="tbtn" id="fsBtn" type="button" aria-label="Layar penuh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Layar penuh</span></button>
 <a class="tbtn" href="../" id="homeBtn" aria-label="Kembali ke beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Beranda</span></a>
</header>

<main class="stage">
 <div class="frame" id="frame" role="region" aria-roledescription="slide" aria-live="polite">
  <div class="slide" id="slide"></div>
  <div class="loading" id="loading">Memuat slide…</div>
  <span class="wipe" aria-hidden="true"></span>
  <button class="nav prev" type="button" id="navPrev" aria-label="Slide sebelumnya"></button>
  <button class="nav next" type="button" id="navNext" aria-label="Slide berikutnya"></button>
 </div>
</main>

<footer class="bottom">
 <div class="count" id="count">1 <small>/ 1</small></div>
 <div class="prog" id="prog" aria-hidden="true"></div>
 <div class="arrows">
  <button class="arr" type="button" id="prevBtn" aria-label="Slide sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="arr" type="button" id="nextBtn" aria-label="Slide berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
 </div>
</footer>

<div class="mission" id="mission" aria-hidden="true"><div class="box"><span class="k" id="misK"></span><h2 id="misT"></h2></div></div>

<section class="screen" id="screen" aria-label="Menu presentasi">
 <div>
  <div class="kick" id="kick">Presentasi</div>
  <h1 id="bigTitle">Memuat…</h1>
  <div class="meta" id="meta"></div>
 </div>
 <nav class="menu" id="menu" role="menu" aria-label="Pilih bab"></nav>
</section>
<div class="hint" id="hint"><span><kbd>↑</kbd><kbd>↓</kbd>Pilih</span><span><kbd>Enter</kbd>Buka</span><span><kbd>←</kbd><kbd>→</kbd>Ganti slide</span><span><kbd>Esc</kbd>Menu</span><span><kbd>F</kbd>Layar penuh</span></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const slug=(new URLSearchParams(location.search).get('d')||'').replace(/[^a-z0-9-]/g,'');
const base=`../${slug}/slides/`;
const KEY='deck-pos:'+slug;
let M=null,SL=[],cur=0,loaded=new Set(),menuIdx=0,menuItems=[],screenMode='intro';

window.DECK={load(from,arr){arr.forEach((s,i)=>SL[from+i]=s);}};
function addScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function fail(msg){$('bigTitle').textContent='Presentasi tidak ditemukan';$('meta').innerHTML=`<p class="err">${esc(msg)}</p>`;$('menu').innerHTML=`<a class="mi big" href="../" aria-current="true">Kembali ke beranda</a>`}
if(!slug){fail('Buka presentasi dari menu di halaman utama.');return}
const HOME='../#'+slug;$('homeBtn').href=HOME;

addScript(base+'deck.js?v=3').then(init).catch(()=>fail('Data presentasi untuk section ini belum diunggah.'));

function chunkOf(i){return M.chunks.findIndex(c=>i>=c.from&&i<c.from+c.count)}
function ensure(i){const k=chunkOf(i);if(k<0)return Promise.resolve();const c=M.chunks[k];if(loaded.has(k))return c.p||Promise.resolve();loaded.add(k);c.p=addScript(base+c.file+'?v=3');return c.p}
function chapterAt(i){let c=null;for(const ch of M.chapters)if(ch.page-1<=i)c=ch;return c}

function init(){
 M=window.DECK_META;document.title=M.title+' · Presentasi';
 $('deckName').textContent=M.title;$('bigTitle').textContent=M.title;
 $('meta').innerHTML=`<span><b>${M.pages}</b>slide</span><span><b>${M.chapters.length}</b>bab</span>`;
 // progres per bab
 const bounds=[0,...M.chapters.map(c=>c.page-1),M.pages].filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>a-b);
 $('prog').innerHTML=bounds.slice(0,-1).map((s,i)=>`<span style="flex:${bounds[i+1]-s}" data-s="${s}" data-e="${bounds[i+1]}" title="${esc((chapterAt(s)||{title:'Pembuka'}).title)}"><i></i></span>`).join('');
 $('prog').addEventListener('click',e=>{const sp=e.target.closest('span');if(sp)go(+sp.dataset.s)});
 let saved=0;try{saved=+localStorage.getItem(KEY)||0}catch(e){}
 const h=parseInt(location.hash.slice(1));
 if(h>=1&&h<=M.pages){cur=h-1;closeScreen();show(cur,false)}
 else{cur=Math.min(saved,M.pages-1);openScreen('intro')}
 ensure(cur);
}

/* ---------- layar menu ---------- */
function openScreen(mode){
 screenMode=mode;$('screen').hidden=false;$('hint').hidden=false;document.body.classList.add('menu-open');
 const ch=M.chapters;
 const items=[];
 if(mode==='pause')items.push({label:'Lanjutkan',sub:`slide ${cur+1}`,act:closeScreen,big:true});
 else if(cur>0)items.push({label:'Lanjutkan',sub:`slide ${cur+1}`,act:()=>{closeScreen();show(cur,false)},big:true});
 items.push({label:'Mulai dari awal',act:()=>{closeScreen();go(0)},big:mode!=='pause'&&cur===0});
 ch.forEach(c=>items.push({n:c.no,label:c.title,sub:`slide ${c.page}`,act:()=>{closeScreen();go(c.page-1)}}));
 items.push({label:'Kembali ke beranda',act:()=>{location.href=HOME}});
 menuItems=items;menuIdx=0;
 $('kick').textContent=mode==='pause'?'Jeda':'Presentasi';
 $('menu').innerHTML=items.map((it,i)=>`<button type="button" class="mi${it.big?' big':''}" role="menuitem" data-i="${i}" aria-current="${i===0}" tabindex="${i===0?0:-1}">${it.n?`<span class="n">${it.n}</span>`:''}<span>${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</span></button>`).join('');
 setTimeout(()=>$('menu').querySelector('.mi')?.focus(),0);
}
function closeScreen(){$('screen').hidden=true;$('hint').hidden=true;document.body.classList.remove('menu-open');$('frame').focus?.()}
function menuMove(t){const b=$('menu').querySelectorAll('.mi');if(!b.length)return;t=(t+b.length)%b.length;b[menuIdx].setAttribute('aria-current','false');b[menuIdx].tabIndex=-1;menuIdx=t;b[t].setAttribute('aria-current','true');b[t].tabIndex=0;b[t].focus();b[t].scrollIntoView({block:'nearest'})}
$('menu').addEventListener('click',e=>{const b=e.target.closest('.mi');if(!b||!b.dataset.i)return;menuItems[+b.dataset.i].act()});
$('menu').addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest('.mi');if(b&&b.dataset.i&&+b.dataset.i!==menuIdx)menuMove(+b.dataset.i)});

/* ---------- slide ---------- */
let lastChapter=null;
function show(i,anim=true){
 cur=i;const f=$('frame');
 const paint=()=>{
  if(cur!==i)return;
  $('loading').hidden=true;$('slide').innerHTML=SL[i]||'';
  if(anim&&!reduce){f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
 };
 if(SL[i])paint();else{$('loading').hidden=false;$('slide').innerHTML='';ensure(i).then(paint)}
 // pramuat potongan berikutnya
 if(i+8<M.pages)ensure(i+8);
 $('count').innerHTML=`${i+1} <small>/ ${M.pages}</small>`;
 const ch=chapterAt(i);$('chapName').textContent=ch?`Bab ${ch.no} · ${ch.title}`:'Pembuka';
 $('prevBtn').disabled=i===0;$('nextBtn').disabled=i===M.pages-1;
 $('prog').querySelectorAll('span').forEach(sp=>{const s=+sp.dataset.s,e=+sp.dataset.e;sp.querySelector('i').style.width=(i>=e?100:i<s?0:((i-s+1)/(e-s)*100))+'%'});
 try{localStorage.setItem(KEY,i)}catch(e){}
 history.replaceState(null,'','#'+(i+1));
 // judul bab ala misi saat memasuki slide pembuka bab
 const opener=M.chapters.find(c=>c.page-1===i);
 if(opener&&anim&&lastChapter!==opener.no){
  const m=$('mission');$('misK').textContent=`Bab ${opener.no} dari ${opener.of}`;$('misT').textContent=opener.title;
  m.classList.remove('show');void m.offsetWidth;m.classList.add('show');
 }
 lastChapter=ch?ch.no:null;
}
function go(i){i=Math.max(0,Math.min(M.pages-1,i));if(i===cur&&$('slide').innerHTML)return;show(i,true)}

$('prevBtn').onclick=$('navPrev').onclick=()=>go(cur-1);
$('nextBtn').onclick=$('navNext').onclick=()=>go(cur+1);
$('menuBtn').onclick=()=>openScreen('pause');
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('fsBtn').onclick=fs;

document.addEventListener('keydown',e=>{
 if(!M)return;
 if(!$('screen').hidden){
  if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();menuMove(menuIdx+1)}
  else if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();menuMove(menuIdx-1)}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();menuItems[menuIdx]?.act()}
  else if(e.key==='Escape'&&screenMode==='pause'){e.preventDefault();closeScreen()}
  else if(e.key==='f'||e.key==='F')fs();
  return;
 }
 const k=e.key;
 if(['ArrowRight','PageDown',' ','Enter','d'].includes(k)){e.preventDefault();go(cur+1)}
 else if(['ArrowLeft','PageUp','Backspace','a'].includes(k)){e.preventDefault();go(cur-1)}
 else if(k==='Home'){e.preventDefault();go(0)}
 else if(k==='End'){e.preventDefault();go(M.pages-1)}
 else if(k==='Escape'||k==='m'||k==='M'){e.preventDefault();openScreen('pause')}
 else if(k==='f'||k==='F')fs();
});
// geser (sentuh)
let tx=null,ty=null;
$('frame').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('frame').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1));tx=null},{passive:true});
})();
</script>
</body>
</html>
