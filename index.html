<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyber Lab · Latihan keamanan siber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
 --night:#1b0f33;--dusk:#3a1466;--neon:#e0368f;--sunset:#ff8a3d;--gold:#ffd27a;--lagoon:#14b3ad;
 --tint:#e0368f;
 --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
 --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--night);color:#fff;font:16px/1.5 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* ================= scene ================= */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden}
#scene svg{position:absolute;left:50%;bottom:0;height:100%;width:max(100%,1500px);transform:translateX(-50%)}
.layer{transition:transform .3s ease-out}
#tint{position:absolute;inset:0;background:linear-gradient(90deg,var(--night) 0%,color-mix(in srgb,var(--night) 70%,transparent) 38%,transparent 70%),radial-gradient(70% 60% at 75% 70%,color-mix(in srgb,var(--tint) 35%,transparent),transparent 70%);transition:background .6s;pointer-events:none}
body.on-title #tint{background:linear-gradient(180deg,transparent 40%,#1b0f33cc 100%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000014 3px 4px);pointer-events:none;mix-blend-mode:multiply}

/* ================= title screen ================= */
#title{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 clamp(22px,7vw,110px);cursor:pointer;user-select:none}
.logo{font:italic 900 clamp(84px,16vw,220px)/.78 var(--f-disp);letter-spacing:-.01em;margin:0}
.logo span{display:block}
.logo .a{color:#fff;text-shadow:0 5px 0 var(--neon),0 0 40px #e0368f88}
.logo .b{color:var(--gold);text-shadow:0 5px 0 #b8562a,0 0 40px #ff8a3d88;margin-left:.35em}
.tagline{font:600 clamp(15px,1.6vw,19px)/1.3 var(--f-body);margin:22px 0 0;opacity:.9;max-width:34ch}
.press{margin-top:clamp(40px,9vh,90px);font:italic 800 clamp(22px,2.4vw,30px)/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:12px;align-items:center}
.press kbd{font:700 14px/1 var(--f-body);letter-spacing:0;background:#fff;color:var(--night);border-radius:6px;padding:6px 9px;box-shadow:0 3px 0 #b9a7cf;text-transform:none}

/* ================= menu ================= */
#menu{position:fixed;inset:0;z-index:2;display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(18px,4vh,40px) clamp(18px,5vw,80px) 0}
.crumb{grid-column:1/-1;font:italic 800 clamp(26px,3vw,40px)/1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:baseline;gap:14px;margin-bottom:clamp(14px,3vh,30px)}
.crumb small{font:500 14px var(--f-body);letter-spacing:0;text-transform:none;opacity:.7}
.list{display:flex;flex-direction:column;gap:4px;align-self:center;padding-bottom:20px}
.item{position:relative;display:inline-flex;align-self:flex-start;align-items:center;gap:16px;max-width:100%;text-align:left;padding:8px 34px 8px 14px;font:italic 900 clamp(30px,3.9vw,50px)/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em;color:#ffffffb8;isolation:isolate;transition:color .12s}
.item .n{font:700 15px/1 var(--f-body);font-style:normal;width:26px;opacity:.65}
.item .tag{margin-left:6px;font:700 12px/1 var(--f-body);font-style:normal;letter-spacing:.06em;padding:5px 8px;border-radius:4px;background:#ffffff22;color:#fff}
.item::before{content:"";position:absolute;inset:0;z-index:-1;background:#fff;box-shadow:6px 6px 0 var(--tint);transform:skewX(-12deg) scaleX(0);transform-origin:left;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.item[aria-current=true]{color:var(--night)}
.item:focus-visible{outline:none}
.item:focus-visible::before{box-shadow:6px 6px 0 var(--tint),0 0 0 3px var(--gold)}
.item[aria-current=true]::before{transform:skewX(-12deg) scaleX(1)}
.item[aria-current=true] .n{opacity:1}
.item[aria-current=true] .tag{background:var(--night);color:var(--gold)}
.item[aria-disabled=true]{color:#ffffff55}
.item[aria-disabled=true][aria-current=true]{color:#1b0f3399}
.item.small{font-size:clamp(24px,3vw,36px)}

.preview{align-self:center;justify-self:end;width:min(520px,100%);position:relative;margin-left:30px;padding-bottom:20px}
.card{position:relative;background:#fff;color:var(--night);border-radius:6px;padding:26px 28px 24px;transform:rotate(-2deg);box-shadow:12px 14px 0 var(--tint),0 30px 60px #0007;overflow:hidden;transition:box-shadow .4s}
.card .glyph{position:absolute;right:-18px;top:-12px;width:190px;height:190px;color:var(--tint);opacity:.18}
.card .k{font:700 13px var(--f-body);letter-spacing:.08em;color:var(--tint);text-transform:uppercase}
.card h2{font:italic 900 clamp(40px,4.6vw,64px)/.9 var(--f-disp);margin:6px 0 12px;text-transform:uppercase;position:relative}
.card p{margin:0;max-width:38ch;font-size:16px;position:relative}
.card .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13.5px var(--f-body);padding:6px 11px;border-radius:999px;background:#1b0f330f}
.chip i{width:9px;height:9px;border-radius:50%;background:#1b0f3333}
.chip.on i{background:var(--lagoon)}
.card .slash{position:absolute;inset:-20% auto -20% -40%;width:35%;background:var(--gold);transform:skewX(-20deg) translateX(-120%);opacity:.9;pointer-events:none}
.card.swap .slash{animation:slash .45s cubic-bezier(.5,0,.3,1)}
.card.swap > :not(.slash){animation:pop .45s ease-out}
@keyframes slash{to{transform:skewX(-20deg) translateX(560%)}}
@keyframes pop{0%,35%{opacity:0;transform:translateX(-10px)}}
.files{list-style:none;padding:0;margin:14px 0 0;position:relative}
.files li{font-size:14px;padding:6px 0;border-top:1px solid #1b0f3318}
.files small{color:#6c5f80}

.hints{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:14px 0 calc(16px + env(safe-area-inset-bottom));border-top:1px solid #ffffff22;font:600 14px var(--f-body)}
.hints span{display:inline-flex;align-items:center;gap:8px;opacity:.9}
.hints kbd{font:700 12.5px/1 var(--f-body);min-width:28px;text-align:center;background:#fff;color:var(--night);border-radius:5px;padding:5px 7px;box-shadow:0 2px 0 #b9a7cf}
.hints .r{margin-left:auto;opacity:.6;font-weight:500}

/* ================= loading ================= */
#loading{position:fixed;inset:0;z-index:5;background:var(--night);display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(22px,6vw,90px) clamp(30px,8vh,80px);overflow:hidden}
#loading .big{position:absolute;right:-2vw;top:8vh;font:italic 900 clamp(90px,18vw,260px)/.8 var(--f-disp);text-transform:uppercase;color:transparent;-webkit-text-stroke:2px var(--tint);opacity:.55;text-align:right}
#loading .tip{max-width:56ch;font-size:clamp(16px,1.6vw,19px);margin:0 0 22px}
#loading .tip b{display:block;font:italic 800 24px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.bar{height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;max-width:520px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--gold))}
#loading.go .bar i{transition:width .9s cubic-bezier(.4,0,.2,1);width:100%}

/* ================= motion ================= */
@media (prefers-reduced-motion:no-preference){
 .sun{animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
 @keyframes rise{from{transform:translateY(140px)}}
 .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}
 @keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.8deg)}}
 .shimmer rect{animation:shim 3.2s ease-in-out infinite}
 .shimmer rect:nth-child(2){animation-delay:-.8s}.shimmer rect:nth-child(3){animation-delay:-1.6s}.shimmer rect:nth-child(4){animation-delay:-2.4s}
 @keyframes shim{50%{transform:scaleX(.6);opacity:.4}}
 .shimmer rect{transform-box:fill-box;transform-origin:center}
 .car{animation:drive 11s linear infinite}
 @keyframes drive{from{transform:translateX(-260px)}to{transform:translateX(1760px)}}
 .car2{animation:drive2 15s linear infinite;animation-delay:-6s}
 @keyframes drive2{from{transform:translateX(1760px)}to{transform:translateX(-260px)}}
 .bird{animation:fly 26s linear infinite}
 @keyframes fly{from{transform:translate(-120px,0)}50%{transform:translate(800px,-30px)}to{transform:translate(1720px,10px)}}
 .neon{animation:flick 5s steps(1) infinite}
 @keyframes flick{0%,100%{opacity:1}42%{opacity:.35}44%{opacity:1}46%{opacity:.5}48%{opacity:1}}
 .logo .a{animation:slam .6s .15s cubic-bezier(.2,1.4,.4,1) both}
 .logo .b{animation:slam .6s .32s cubic-bezier(.2,1.4,.4,1) both}
 @keyframes slam{from{opacity:0;transform:translateX(-60px) skewX(-14deg)}}
 .tagline{animation:fade .6s .6s both}
 .press{animation:fade .6s .9s both,blink 1.4s 1.5s steps(2,start) infinite}
 @keyframes fade{from{opacity:0}}
 @keyframes blink{50%{opacity:.25}}
 #menu.enter .item{animation:inL .4s cubic-bezier(.2,.8,.2,1) both}
 #menu.enter .item:nth-child(2){animation-delay:.04s}#menu.enter .item:nth-child(3){animation-delay:.08s}#menu.enter .item:nth-child(4){animation-delay:.12s}#menu.enter .item:nth-child(5){animation-delay:.16s}#menu.enter .item:nth-child(6){animation-delay:.2s}#menu.enter .item:nth-child(7){animation-delay:.24s}
 @keyframes inL{from{opacity:0;transform:translateX(-40px)}}
}
@media (prefers-reduced-motion:reduce){.card.swap .slash,.card.swap>*{animation:none}}

/* ================= responsive ================= */
@media (max-width:860px){
 body{overflow:auto}
 #menu{position:relative;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;padding-top:20px}
 #tint{background:linear-gradient(180deg,#1b0f33aa,#1b0f33ee 60%)}
 .list{align-self:start}
 .item{font-size:clamp(26px,7.4vw,38px);padding:9px 26px 9px 12px;white-space:normal}
 .preview{justify-self:stretch;margin:6px 0 0;width:auto}
 .card{transform:none;box-shadow:8px 8px 0 var(--tint)}
 .card .glyph{width:130px;height:130px}
 .hints .key{display:none}
 .hints .r{margin-left:0}
}
@media (min-width:861px){.hints .touch{display:none}}
</style>

<script>
(()=>{
const S=window.LAB_SECTIONS||window.LABSIBER_SECTIONS||[];
/* Sample otomatis: file <slug>/sample/sample.zip dideteksi saat halaman dibuka */
const AUTO={};
function fmtSize(b){if(!b)return'';const mb=b/1048576;return mb>=1?mb.toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB'}
function sampleList(s){return s.sample.length?s.sample:(AUTO[s.slug]?[AUTO[s.slug]]:[])}
/* Tools: link Google Drive share diubah otomatis jadi link unduh langsung */
function driveDirect(u){const m=String(u||'').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/);return m?'https://drive.google.com/uc?export=download&id='+m[1]:u}
function toolList(s){return (s.tools||[]).filter(t=>t&&t.href)}
S.forEach(s=>{s.tools=s.tools||[];s.sample=s.sample||[];if(s.sample.length)return;
 const href=s.slug+'/sample/sample.zip';
 fetch(href+'?t='+Date.now(),{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)return;
  AUTO[s.slug]={name:'Sample '+s.short,href,size:fmtSize(+r.headers.get('content-length')),note:s.sampleNote||'',dl:'Sample-'+s.short.replace(/\s+/g,'-')+'.zip',auto:true};
  if(typeof render==='function'&&document.getElementById('menu')&&!document.getElementById('menu').hidden)render(false);}).catch(()=>{});
});
if(!S.length){document.querySelector('.tagline').textContent='Daftar materi gagal dimuat. Muat ulang halaman ini.';return}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TINT={'cti-apt-profiling':'#e0368f','threat-hunting-lab':'#14b3ad','malware-analysis':'#ff8a3d','digital-forensic':'#8e5cf0','phishing':'#2bb3ff','incident-response':'#ff4d5e'};
const GLYPH={
 'cti-apt-profiling':'<circle cx="32" cy="32" r="26"/><circle cx="32" cy="32" r="15"/><path d="M8 32s9-12 24-12 24 12 24 12-9 12-24 12S8 32 8 32z"/><circle cx="32" cy="32" r="5" fill="currentColor"/>',
 'threat-hunting-lab':'<circle cx="32" cy="32" r="22"/><circle cx="32" cy="32" r="9"/><path d="M32 2v16M32 46v16M2 32h16M46 32h16"/>',
 'malware-analysis':'<ellipse cx="32" cy="36" rx="13" ry="17"/><path d="M32 19v34M19 30H6M19 42H8M45 30h13M45 42h11M22 22l-8-8M42 22l8-8M24 52l-8 6M40 52l8 6"/><circle cx="32" cy="16" r="6"/>',
 'digital-forensic':'<circle cx="26" cy="26" r="18"/><path d="M39 39l19 19"/><path d="M18 28c0-6 4-10 8-10s8 4 8 10-3 10-3 10M22 30c0-3 2-5 4-5s4 2 4 5"/>',
 'phishing':'<path d="M40 6v30a12 12 0 1 1-24 0v-4"/><path d="M16 32l-6 6M16 32l6 5"/><circle cx="40" cy="6" r="3"/>',
 'incident-response':'<path d="M32 4l24 9v17c0 16-11 26-24 30C19 56 8 46 8 30V13z"/><path d="M32 18v18M32 44v2"/>'};
const TIPS=[
 ['Tips','Baca dulu skenario dan tujuan lab sebelum menjawab. Bukti yang Anda butuhkan biasanya sudah disebut di sana.'],
 ['Tips','Catat waktu, host, dan indikator setiap temuan. Catatan itu yang akan menghubungkan satu section dengan section berikutnya.'],
 ['Tips','Progres tersimpan otomatis di browser ini. Gunakan perangkat yang sama sampai lab selesai.'],
 ['Tips','Buka file sample hanya di mesin virtual latihan, bukan di laptop kerja.'],
 ['Tips','Tombol Beranda di pojok setiap lab membawa Anda kembali ke menu ini.']];

let level='main',sec=0,idx=0,fileKind=null;
const card=$('card'),list=$('list'),crumb=$('crumb');

function itemsFor(){
 const s=S[sec];
 if(level==='main')return S.map((x,i)=>({label:x.short,n:i+1,tag:x.status==='ready'?'':'Segera',act:()=>{sec=i;go('sec',0)}}));
 if(level==='sec'){
  const ready=!!s.lab;
  return [
   {label:'Buka lab',disabled:!ready,act:()=>launch(s)},
   {label:'Presentasi',tag:s.slidesCount?String(s.slidesCount):'',disabled:!s.slides,act:()=>launch(s,s.slides,'Presentasi')},
   {label:'Materi PDF',tag:s.pdf.length?String(s.pdf.length):'',disabled:!s.pdf.length,act:()=>{fileKind='pdf';go('files',0)}},
   {label:'Sample',tag:sampleList(s).length?(AUTO[s.slug]&&!s.sample.length?(AUTO[s.slug].size||'ZIP'):String(sampleList(s).length)):'',disabled:!sampleList(s).length,act:()=>{const L=sampleList(s);if(L.length===1&&L[0].auto){openFile(L[0])}else{fileKind='sample';go('files',0)}}},
   {label:'Tools',tag:toolList(s).length?String(toolList(s).length):'',disabled:!toolList(s).length,act:()=>{const L=toolList(s);if(L.length===1){openFile(L[0],'tool')}else{fileKind='tools';go('files',0)}}},
   {label:'Kembali',act:back}];
 }
 const arr=fileKind==='sample'?sampleList(s):fileKind==='tools'?toolList(s):s[fileKind];
 return arr.map(f=>({label:f.name,small:true,tag:f.size||'',act:()=>openFile(f,fileKind==='tools'?'tool':'')})).concat([{label:'Kembali',small:true,act:back}]);
}
function render(anim){
 const s=S[sec],its=itemsFor();
 document.documentElement.style.setProperty('--tint',TINT[s.slug]||'#e0368f');
 crumb.innerHTML=level==='main'?'Pilih section <small>'+S.length+' section, kerjakan berurutan</small>':
  level==='sec'?esc(s.title)+' <small>Section '+(sec+1)+'</small>':esc(s.title)+' <small>'+({pdf:'Materi PDF',sample:'Sample',tools:'Tools'}[fileKind])+'</small>';
 list.innerHTML=its.map((it,i)=>`<button type="button" class="item${it.small?' small':''}" role="menuitem" data-i="${i}" aria-current="${i===idx}" ${it.disabled?'aria-disabled="true"':''} tabindex="${i===idx?0:-1}">${it.n?`<span class="n">${it.n}</span>`:''}<span>${esc(it.label)}</span>${it.tag?`<span class="tag">${esc(it.tag)}</span>`:''}</button>`).join('');
 if(anim){const m=$('menu');m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter')}
 paintCard(true);
}
function paintCard(swap){
 const s=S[level==='main'?idx:sec];
 const has=[!!s.lab,!!s.slides,s.pdf.length>0,sampleList(s).length>0,toolList(s).length>0];
 let body;
 if(level==='files'){
  const arr=fileKind==='sample'?sampleList(s):fileKind==='tools'?toolList(s):s[fileKind],f=arr[idx];
  body=f?`<p>${esc(f.name)}${f.size?' · '+esc(f.size):''}</p>${f.note?`<p style="margin-top:8px"><b>${esc(f.note)}</b></p>`:''}${fileKind==='sample'?'<p style="margin-top:10px;font-size:14px">Buka sample hanya di mesin virtual latihan.</p>':''}${fileKind==='tools'?'<p style="margin-top:10px;font-size:14px">Tekan Enter atau ketuk untuk mengunduh. Pasang di mesin virtual latihan.</p>':''}`:'<p>Kembali ke menu section.</p>';
 }else{
  body=`<p>${esc(s.status==='ready'?s.summary:'Section ini sedang disiapkan.')}</p>
  <div class="chips"><span class="chip ${has[0]?'on':''}"><i></i>Lab</span><span class="chip ${has[1]?'on':''}"><i></i>Presentasi${has[1]?' ('+s.slidesCount+')':''}</span><span class="chip ${has[2]?'on':''}"><i></i>Materi PDF${has[2]?' ('+s.pdf.length+')':''}</span><span class="chip ${has[3]?'on':''}"><i></i>Sample${has[3]?' ('+sampleList(s).length+')':''}</span><span class="chip ${has[4]?'on':''}"><i></i>Tools${has[4]?' ('+toolList(s).length+')':''}</span></div>`;
 }
 card.innerHTML=`<span class="slash"></span><svg class="glyph" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GLYPH[s.slug]||''}</svg>
  <div class="k">Section ${S.indexOf(s)+1}${s.status==='ready'?'':' · Segera'}</div><h2>${esc(s.short)}</h2>${body}`;
 if(swap&&!reduce){card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap')}
}
function move(to,focus=true){
 const its=list.querySelectorAll('.item');if(!its.length)return;
 to=(to+its.length)%its.length;if(to===idx&&focus){its[to].focus();return}
 its[idx]?.setAttribute('aria-current','false');its[idx]&&(its[idx].tabIndex=-1);
 idx=to;its[idx].setAttribute('aria-current','true');its[idx].tabIndex=0;if(focus)its[idx].focus();
 if(level==='main')document.documentElement.style.setProperty('--tint',TINT[S[idx].slug]);
 paintCard(level!=='sec');
}
function go(lv,i){level=lv;idx=i;render(true);focusCur();if(lv!=='files')syncHash()}
function back(){if(level==='files'){go('sec',{pdf:2,sample:3,tools:4}[fileKind])}else if(level==='sec'){level='main';idx=sec;render(true);focusCur();syncHash(true)}else{showTitle()}}
function activate(i){const it=itemsFor()[i];if(!it||it.disabled)return;it.act()}
function focusCur(){list.querySelectorAll('.item')[idx]?.focus()}
function syncHash(main){const h=main?'':'#'+S[sec].slug;if(location.hash!==h)history.replaceState(null,'',location.pathname+h)}
function openFile(f,kind){if(kind==='tool'){const u=driveDirect(f.href),fol=/\/folders\//.test(u);toast((fol?'Membuka folder '+f.name+' di tab baru. Klik tombol Download di Google Drive':'Mengunduh '+f.name+(f.size?' ('+f.size+')':'')+(f.note?'. '+f.note:'')),fol?'folder':'tool');window.open(u,'_blank','noopener');return}
 if(/^https?:/.test(f.href)||/\.pdf$/i.test(f.href))window.open(f.href,'_blank','noopener');else{const a=document.createElement('a');a.href=f.href;a.download=f.dl||'';if(f.auto)toast('Mengunduh '+f.name+(f.size?' ('+f.size+')':'')+(f.note?'. '+f.note:''));document.body.appendChild(a);a.click();a.remove()}}
function toast(msg,kind){let t=document.getElementById('dlToast');if(!t){t=document.createElement('div');t.id='dlToast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:#21123a;color:#f1e9f7;border:1px solid #f0479e;border-radius:12px;padding:12px 18px;font:600 15px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:90vw;text-align:center;transition:opacity .3s';document.body.appendChild(t)}t.textContent=msg+(kind==='folder'?'. Drive akan mengemasnya jadi ZIP.':kind==='tool'?'. Jika Google Drive menampilkan peringatan, klik "Download anyway".':' — buka hanya di mesin virtual latihan.');t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},4200)}
function launch(s,url,kind){
 url=url||s.lab;
 if(reduce){location.href=url;return}
 const L=$('loading'),t=TIPS[Math.floor(Math.random()*TIPS.length)];
 $('ldBig').textContent=kind?kind:s.short;$('ldTip').innerHTML=`<b>${t[0]}</b>${esc(t[1])}`;
 L.hidden=false;L.classList.remove('go');void L.offsetWidth;L.classList.add('go');
 setTimeout(()=>{location.href=url},1000);
}
window.addEventListener('pageshow',e=>{if(e.persisted){$('loading').hidden=true}});

list.addEventListener('click',e=>{const b=e.target.closest('.item');if(!b)return;const i=+b.dataset.i;if(i!==idx)move(i,true);activate(i)});
list.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest('.item');if(b&&+b.dataset.i!==idx)move(+b.dataset.i,false)});
document.addEventListener('keydown',e=>{
 if(!$('title').hidden){if(['Enter',' '].includes(e.key)||e.key.length===1){e.preventDefault();showMenu()}return}
 if(!$('loading').hidden)return;
 const k=e.key;
 if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();move(idx+1)}
 else if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();move(idx-1)}
 else if(k==='Enter'||k===' '||k==='ArrowRight'){e.preventDefault();activate(idx)}
 else if(k==='Escape'||k==='Backspace'||k==='ArrowLeft'){e.preventDefault();back()}
});

function showMenu(at){
 try{sessionStorage.setItem('cl-started','1')}catch(e){}
 document.body.classList.remove('on-title');$('title').hidden=true;$('menu').hidden=false;
 if(at!=null){sec=at;level='sec';idx=0}else{level='main';idx=sec}
 render(true);focusCur();
}
function showTitle(){document.body.classList.add('on-title');$('menu').hidden=true;$('title').hidden=false;$('title').focus();history.replaceState(null,'',location.pathname);try{sessionStorage.removeItem('cl-started')}catch(e){}}
$('title').addEventListener('click',()=>showMenu());

// mulai: langsung ke menu jika ada #section atau baru kembali dari lab
const h=S.findIndex(s=>'#'+s.slug===location.hash);
let started=false;try{started=sessionStorage.getItem('cl-started')==='1'}catch(e){}
if(h>=0)showMenu(h);else if(started)showMenu();else $('title').focus();

// parallax mengikuti kursor
if(!reduce&&matchMedia('(pointer:fine)').matches){
 const layers=[...document.querySelectorAll('.layer')];let raf=0;
 window.addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>layers.forEach(l=>{const d=+l.dataset.depth;l.style.transform=`translate(${(-x*d).toFixed(1)}px,${(-y*d*.4).toFixed(1)}px)`}))});
}
})();
</script>
</body>
</html>
